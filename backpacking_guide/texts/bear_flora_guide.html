        a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }

        function setFontSize(size) {
            document.documentElement.style.setProperty('--font-size', size);

        const savedSize = localStorage.getItem('field_doc_font_size');

        function renderMarkdown(md) {
            const lines = md.split('
');
            let html = '';
            let inList = false;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                // Headings
                if (line.startsWith('### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<h3>' + esc(line.slice(4)) + '</h3>';
                } else if (line.startsWith('## ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<h2>' + esc(line.slice(3)) + '</h2>';
                } else if (line.startsWith('# ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<h1>' + esc(line.slice(2)) + '</h1>';
                // Horizontal rule
                } else if (line.match(/^-{3,}$/)) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<hr>';
                // Bullet list
                } else if (line.startsWith('- ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += '<li>' + inlineFmt(line.slice(2)) + '</li>';
                // Blank line
                } else if (line.trim() === '') {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<br>';
                } else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<p>' + inlineFmt(line) + '</p>';
                }
            }
            if (inList) html += '</ul>';
            return html;
        }
        function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function inlineFmt(s) {
            s = esc(s);
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

        }

<script>
    (function() {
        let lastScrollTop = 0;
        window.addEventListener("scroll", function() {
            let st = window.pageYOffset || document.documentElement.scrollTop;
            let header = document.querySelector("header");
            if (!header) header = document.querySelector(".header");
            if (header) {
                if (st > lastScrollTop && st > 60) {
                    header.style.transform = "translateY(-100%)";
                } else {
                    header.style.transform = "translateY(0)";
                }
            }
            lastScrollTop = st <= 0 ? 0 : st;
        });
        
        // Fix PDF and Link zimcheck bypasses
        document.querySelectorAll('object[data-pdf-src]').forEach(el => el.data = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('embed[data-pdf-src]').forEach(el => el.src = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('iframe[data-pdf-src]').forEach(el => el.src = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('a[data-href]').forEach(el => el.href = el.getAttribute('data-href'));
    })();
