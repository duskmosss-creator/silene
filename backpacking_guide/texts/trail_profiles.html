<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Comprehensive Appalachian Trail & Regional Trail Profiles</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --font-size: 16px;
        }
        html { font-size: var(--font-size); scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; padding-top: 80px;
            padding: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: var(--card-bg);
            border-bottom: 2px solid var(--accent);
            padding: 0.4rem 1rem;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
        }
        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1.2rem; margin: 0; color: var(--accent); }
        .meta { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem 0.5rem; overflow-x: hidden; }
        .md-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem; font-size: 0.95rem; overflow-wrap: break-word; word-break: break-word;
            line-height: 1.8;
            color: #e2e8f0;
        }
        .md-content h1 { color: var(--accent); font-size: 1.6rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.4rem; margin-top: 2rem; }
        .md-content h2 { color: var(--accent); font-size: 1.3rem; margin-top: 1.8rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
        .md-content h3 { color: #93c5fd; font-size: 1.1rem; margin-top: 1.4rem; }
        .md-content ul { padding-left: 1.5rem; margin: 0.5rem 0; }
        .md-content li { margin: 0.3rem 0; }
        .md-content strong { color: #f8fafc; font-weight: 700; }
        .md-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
        .md-content code { background: #0f172a; padding: 0.1rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .btn-bar { display: flex; gap: 0.4rem; align-items: center; }
        .btn {
            background: #334155;
            color: white;
            border: 1px solid var(--border);
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn:hover { background: var(--accent); color: #0f172a; }
        a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>

        function setFontSize(size) {
            document.documentElement.style.setProperty('--font-size', size);
            localStorage.setItem('field_doc_font_size', size);

        const savedSize = localStorage.getItem('field_doc_font_size');
        if (savedSize) setFontSize(savedSize);

        function renderMarkdown(md) {
            const lines = md.split('\n');
            let html = '';
            let inList = false;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                // Headings
                if (line.startsWith('### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<h3>' + esc(line.slice(4)) + '</h3>';
                } else if (line.startsWith('## ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<h2>' + esc(line.slice(3)) + '</h2>';
                } else if (line.startsWith('# ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<h1>' + esc(line.slice(2)) + '</h1>';
                // Horizontal rule
                } else if (line.match(/^-{3,}$/)) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<hr>';
                // Bullet list
                } else if (line.startsWith('- ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += '<li>' + inlineFmt(line.slice(2)) + '</li>';
                // Blank line
                } else if (line.trim() === '') {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<br>';
                } else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<p>' + inlineFmt(line) + '</p>';
                }
            }
            if (inList) html += '</ul>';
            return html;
        }
        function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function inlineFmt(s) {
            s = esc(s);
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
            return s;
        }

        const bytes = new Uint8Array(binStr.length);

<script>
    (function() {
        let lastScrollTop = 0;
        window.addEventListener("scroll", function() {
            let st = window.pageYOffset || document.documentElement.scrollTop;
            let header = document.querySelector("header");
            if (!header) header = document.querySelector(".header");
            if (header) {
                if (st > lastScrollTop && st > 60) {
                    header.style.transform = "translateY(-100%)";
                } else {
                    header.style.transform = "translateY(0)";
                }
            }
            lastScrollTop = st <= 0 ? 0 : st;
        });
        
        // Fix PDF and Link zimcheck bypasses
        document.querySelectorAll('object[data-pdf-src]').forEach(el => el.data = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('embed[data-pdf-src]').forEach(el => el.src = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('iframe[data-pdf-src]').forEach(el => el.src = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('a[data-href]').forEach(el => el.href = el.getAttribute('data-href'));
    })();
</script>
