<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>National Geographic Magazine (1947 Full Year Collection) (Full PDF)</title>
    <script src="../js/pdf.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
        }
        .header {{
            background: var(--card-bg);
            border-bottom: 2px solid var(--accent);
            padding: 0.4rem 1rem;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
        }}
        h1 { font-size: 1.1rem; margin: 0; color: var(--accent); }
        .page-info { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
        .scroll-container {
            max-width: 950px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .pdf-page-wrap {
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            overflow: hidden;
            max-width: 100%;
            display: flex;
            justify-content: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }
        object, embed {
            width: 100%;
            height: 92vh;
            border: none;
        }
        a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="header">
        <div style="max-width: 950px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <h1 style="font-size: 0.95rem; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 75%;">National Geographic Magazine (1947 Full Year Collection)</h1>
            <a href="../index.html" onclick="if(window.history.length>1){window.history.back();return false;}else{location.href='../index.html';return false;}" style="font-size: 0.85rem; white-space: nowrap; color: var(--accent); text-decoration: none; font-weight: 600;">← Back</a>
        </div>
    </div>
    
    <div class="scroll-container" id="pdfScrollContainer">
        <div style="width: 100%; text-align: center; margin-bottom: 1rem;">
            <a href="194701to12.pdf" target="_blank" style="display: inline-block; background: var(--accent); color: #0f172a; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 700; text-decoration: none;">📄 Open / Download Raw PDF Magazine Directly (194701to12.pdf)</a>
        </div>
        <iframe src="194701to12.pdf" style="width: 100%; height: 85vh; border: 1px solid var(--border); border-radius: 8px; background: #ffffff;"></iframe>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '../js/pdf.worker.min.js';
        const pdfUrl = '194701to12.pdf';
        const container = document.getElementById('pdfScrollContainer');

        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc) {
            const canvasList = document.createElement('div');
            canvasList.style.display = 'flex';
            canvasList.style.flexDirection = 'column';
            canvasList.style.gap = '1.5rem';
            canvasList.style.alignItems = 'center';
            canvasList.style.marginTop = '1.5rem';
            container.appendChild(canvasList);

            for (let pageNum = 1; pageNum <= Math.min(pdfDoc.numPages, 100); pageNum++) {
                pdfDoc.getPage(pageNum).then(function(page) {
                    const wrap = document.createElement('div');
                    wrap.className = 'pdf-page-wrap';
                    
                    const canvas = document.createElement('canvas');
                    wrap.appendChild(canvas);
                    canvasList.appendChild(wrap);

                    const ctx = canvas.getContext('2d');
                    const dpr = window.devicePixelRatio || 2.0;
                    const scale = 1.8 * dpr;
                    const viewport = page.getViewport({ scale: scale });

                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);
                    canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
                    canvas.style.maxWidth = '100%';
                    canvas.style.height = 'auto';

                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };
                    page.render(renderContext);
                });
            }
        }).catch(function(err) {
            console.log("PDF.js canvas rendering fallback to native iframe.");
        });
    </script>
</body>
</html>
