<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>National Geographic 2006 08</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding-top: 70px;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: var(--card-bg);
            border-bottom: 2px solid var(--accent);
            padding: 0.4rem 1rem;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem 0.5rem; overflow-x: hidden; }
        .md-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            font-size: 0.95rem;
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.8;
            color: #e2e8f0;
        }
        .md-content h1 { color: var(--accent); font-size: 1.6rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.4rem; margin-top: 1.5rem; }
        .md-content h2 { color: var(--accent); font-size: 1.3rem; margin-top: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
        .md-content h3 { color: #93c5fd; font-size: 1.1rem; margin-top: 1.2rem; }
        .md-content ul { padding-left: 1.5rem; margin: 0.5rem 0; }
        .md-content li { margin: 0.3rem 0; }
        .md-content strong { color: #f8fafc; font-weight: 700; }
        .md-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
        .md-content code { background: #0f172a; padding: 0.1rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="header">
        <div style="max-width: 950px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <h1 style="font-size: 0.95rem; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 75%; color: var(--accent);">National Geographic 2006 08</h1>
            <a href="../index.html" style="font-size: 0.85rem; white-space: nowrap; color: var(--accent); text-decoration: none; font-weight: 600;">← Back</a>
        </div>
    </div>
    
    <div class="container">
        <div class="md-content">
            <p>National Geographic Magazine (August 2006 Issue)</p>
<br>
<p>Year: 2006</p>
<br>
<p>Description: Modern biodiversity indexing in GSMNP and synchronous firefly photobiology.</p>
<br>
<p>This volume is part of the National Geographic Society historical collection.</p>
        </div>
    </div>

    <script>
        (function() {
            let lastScrollTop = 0;
            window.addEventListener("scroll", function() {
                let st = window.pageYOffset || document.documentElement.scrollTop;
                let header = document.querySelector(".header");
                if (header) {
                    if (st > lastScrollTop && st > 60) {
                        header.style.transform = "translateY(-100%)";
                    } else {
                        header.style.transform = "translateY(0)";
                    }
                }
                lastScrollTop = st <= 0 ? 0 : st;
            });
        })();
    </script>
</body>
</html>
