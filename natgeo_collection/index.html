<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>National Geographic Archived Magazines Collection</title>
    <style>
        :root {
            --bg: #0f172a;
            --header-bg: #1e293b;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #fbbf24;
            --border: #334155;
            --base-font-size: 16px;
        }

        html { font-size: var(--base-font-size); scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 4px solid var(--accent);
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 { color: var(--accent); margin: 0 0 0.5rem 0; font-size: 1.9rem; letter-spacing: 0.03em; }
        header p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

        .controls {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; }

        .search-bar {
            flex: 1;
            min-width: 220px;
            padding: 0.65rem 1rem;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2); }

        .filter-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; }

        .tab {
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            background: #334155;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .tab.active, .tab:hover { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 700; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }

        @media only screen and (min-width: 852px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media only screen and (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover { transform: translateY(-2px); border-color: var(--accent); }
        
        .card-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.75rem;
        }

        .card-title { font-size: 1.05rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem; }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 0.5rem;
            margin-top: 1rem;
        }

        .badge { background: #fef3c7; color: #92400e; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700; font-size: 0.75rem; }
        .badge-pdf { background: #991b1b; color: #fee2e2; }
    </style>
</head>
<body>
    <header>
        <h1>NATIONAL GEOGRAPHIC ARCHIVED MAGAZINES</h1>
        <p>Full Multi-Megabyte PDF Volumes & Text Collection</p>
    </header>

    <div class="container">
        <section class="controls">
            <div class="control-row">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search full text across all National Geographic volumes...">
            </div>

            <div class="filter-tabs" id="filterTabs">
                <div class="tab active" data-category="ALL">All Volumes</div>
                <div class="tab" data-category="Historical">Historical (1889+)</div>
                <div class="tab" data-category="Smokies">Smokies & Parks</div>
                <div class="tab" data-category="Appalachia">Appalachia</div>
                <div class="tab" data-category="Nature">Nature & Wildlife</div>
            </div>
        </section>

        <main class="grid" id="cardGrid"></main>
    </div>

    <script>
        const articles = [{"id": "nationalgeograph11889nati", "title": "National Geographic Magazine (Volume 1 - 1889 Historical Archive)", "category": "Historical", "path": "pdfs/nationalgeograph11889nati.html", "cover": "images/nationalgeograph11889nati_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 1 - 1889 Historical Archive)"}, {"id": "nationalgeograph37natiuoft", "title": "National Geographic Magazine (Volume 37 - 1920 Expedition Archive)", "category": "Smokies", "path": "pdfs/nationalgeograph37natiuoft.html", "cover": "images/nationalgeograph37natiuoft_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 37 - 1920 Expedition Archive)"}, {"id": "194701to12", "title": "National Geographic Magazine (1947 Full Year Collection)", "category": "Appalachia", "path": "pdfs/194701to12.html", "cover": "images/194701to12_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (1947 Full Year Collection)"}, {"id": "194905", "title": "National Geographic Magazine (1949 Full Year Collection)", "category": "Nature", "path": "pdfs/194905.html", "cover": "images/194905_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (1949 Full Year Collection)"}, {"id": "195011", "title": "National Geographic Magazine (1950 Full Year Collection)", "category": "Appalachia", "path": "pdfs/195011.html", "cover": "images/195011_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (1950 Full Year Collection)"}, {"id": "195105", "title": "National Geographic Magazine (1951 Full Year Collection)", "category": "Historical", "path": "pdfs/195105.html", "cover": "images/195105_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (1951 Full Year Collection)"}, {"id": "195204", "title": "National Geographic Magazine (1952 Full Year Collection)", "category": "Nature", "path": "pdfs/195204.html", "cover": "images/195204_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (1952 Full Year Collection)"}, {"id": "195304", "title": "National Geographic Magazine (1953 Full Year Collection)", "category": "Historical", "path": "pdfs/195304.html", "cover": "images/195304_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (1953 Full Year Collection)"}, {"id": "nationalgeograph2009unse", "title": "National Geographic Magazine (2009 Modern Color Issue)", "category": "Nature", "path": "pdfs/nationalgeograph2009unse.html", "cover": "images/195011_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (2009 Modern Color Issue)"}, {"id": "nationalgeograp421922nati", "title": "National Geographic Magazine (Volume 42 - 1922 Edition)", "category": "Historical", "path": "pdfs/nationalgeograp421922nati.html", "cover": "images/194701to12_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 42 - 1922 Edition)"}, {"id": "nationalgeograp401921nati", "title": "National Geographic Magazine (Volume 40 - 1921 Edition)", "category": "Historical", "path": "pdfs/nationalgeograp401921nati.html", "cover": "images/194905_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 40 - 1921 Edition)"}, {"id": "nationalgeograp371920nati", "title": "National Geographic Magazine (Volume 37 - 1920 Edition)", "category": "Smokies", "path": "pdfs/nationalgeograp371920nati.html", "cover": "images/nationalgeograph37natiuoft_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 37 - 1920 Edition)"}, {"id": "nationalgeograp331918nati", "title": "National Geographic Magazine (Volume 33 - 1918 Edition)", "category": "Nature", "path": "pdfs/nationalgeograp331918nati.html", "cover": "images/195105_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 33 - 1918 Edition)"}, {"id": "nationalgeograp321917nati", "title": "National Geographic Magazine (Volume 32 - 1917 Edition)", "category": "Nature", "path": "pdfs/nationalgeograp321917nati.html", "cover": "images/195204_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 32 - 1917 Edition)"}, {"id": "nationalgeograp301916nati", "title": "National Geographic Magazine (Volume 30 - 1916 Edition)", "category": "Historical", "path": "pdfs/nationalgeograp301916nati.html", "cover": "images/195304_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 30 - 1916 Edition)"}, {"id": "nationalgeograph271915nati", "title": "National Geographic Magazine (Volume 27 - 1915 Edition)", "category": "Appalachia", "path": "pdfs/nationalgeograph271915nati.html", "cover": "images/jishankhan_hotmail_1954_cover.jpg", "type": "PDF MAGAZINE", "has_pdf": true, "content": "National Geographic Magazine (Volume 27 - 1915 Edition)"}];
        const searchInput = document.getElementById('searchInput');
        const tabs = document.querySelectorAll('.tab');
        const cardGrid = document.getElementById('cardGrid');

        let currentCategory = 'ALL';
        let searchQuery = '';

        function renderArticles() {
            cardGrid.innerHTML = '';
            articles.forEach(item => {
                const matchesCategory = (currentCategory === 'ALL' || item.category === currentCategory);
                let matchesSearch = !searchQuery || item.title.toLowerCase().includes(searchQuery) || (item.content && item.content.toLowerCase().includes(searchQuery));

                if (matchesSearch && matchesCategory) {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = item.path;

                    let badgeClass = item.has_pdf ? 'badge-pdf' : '';
                    let linkText = item.has_pdf ? '📄 Open High-Res Full NatGeo PDF →' : '📖 Open Magazine Article Viewer →';

                    card.innerHTML = `
                        <div>
                            <img data-cover-src="${item.cover}" class="card-cover" alt="NatGeo Cover" loading="lazy" decoding="async">
                            <div class="card-title">${item.title}</div>
                            <div style="margin-top: 0.5rem; color: var(--accent); font-weight: 600; font-size: 0.85rem;">${linkText}</div>
                        </div>
                        <div class="card-meta">
                            <span>Category: ${item.category}</span>
                            <span class="badge ${badgeClass}">${item.type}</span>
                        </div>
                    `;
                    cardGrid.appendChild(card);
                    card.querySelectorAll('img[data-cover-src]').forEach(img => { img.src = img.getAttribute('data-cover-src'); img.removeAttribute('data-cover-src'); });
                }
            });
        }

        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); renderArticles(); });
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.getAttribute('data-category');
                renderArticles();
            });
        });
        renderArticles();
    </script>
</body>
</html>
