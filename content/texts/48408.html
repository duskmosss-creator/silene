    <style>
        :root {
            --bg: #0f172a;

            --font-size: 16px;
        }

        body {

            color: var(--text-main);
            margin: 0; padding-top: 80px;
            padding: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: var(--card-bg);
            border-bottom: 2px solid var(--accent);
            padding: 0.4rem 1rem;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;

            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1.2rem; margin: 0; color: var(--accent); }
        .meta { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem 0.5rem; overflow-x: hidden; }
        .text-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1rem;
            line-height: 1.8;
            color: #e2e8f0;
        }
        .btn-bar { display: flex; gap: 0.4rem; align-items: center; }
        .btn {
            background: #334155;
            color: white;
            border: 1px solid var(--border);
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn:hover { background: var(--accent); color: #0f172a; }
        a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>

                    header.style.transform = "translateY(0)";
                }
            }
            lastScrollTop = st <= 0 ? 0 : st;
        });
        
        // Fix PDF and Link zimcheck bypasses
        document.querySelectorAll('object[data-pdf-src]').forEach(el => el.data = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('embed[data-pdf-src]').forEach(el => el.src = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('iframe[data-pdf-src]').forEach(el => el.src = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('a[data-href]').forEach(el => el.href = el.getAttribute('data-href'));
    })();
</script>
</body>
