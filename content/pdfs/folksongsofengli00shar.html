<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Folk-songs of English Origin in the Appalachian Mountains</title>
    <script src="../js/pdf.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
        }
        .header {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { font-size: 1.1rem; margin: 0; color: var(--accent); }
        .page-info { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
        .scroll-container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .pdf-page-wrap {
            background: transparent;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }
        object, embed {
            width: 100%;
            height: 92vh;
            border: none;
        }
        a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Folk-songs of English Origin in the Appalachian Mountains</h1>
            <a href="../index.html">← Back to Archive Index</a>
        </div>
        <div>
            <span class="page-info" id="statusText">Rendering High-Res Document...</span>
        </div>
    </div>
    
    <div class="scroll-container" id="pdfScrollContainer">
        <object data="folksongsofengli00shar.pdf" type="application/pdf">
            <embed src="folksongsofengli00shar.pdf" type="application/pdf" />
        </object>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '../js/pdf.worker.min.js';
        const pdfUrl = 'folksongsofengli00shar.pdf';
        const container = document.getElementById('pdfScrollContainer');
        const statusText = document.getElementById('statusText');

        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc) {
            statusText.textContent = 'Document Pages: ' + pdfDoc.numPages + ' (High-Res Vertical Scroll)';
            container.innerHTML = '';

            // Render pages in high-resolution edge-to-edge canvas mode
            for (let pageNum = 1; pageNum <= Math.min(pdfDoc.numPages, 100); pageNum++) {
                pdfDoc.getPage(pageNum).then(function(page) {
                    const wrap = document.createElement('div');
                    wrap.className = 'pdf-page-wrap';
                    
                    const canvas = document.createElement('canvas');
                    wrap.appendChild(canvas);
                    container.appendChild(wrap);

                    const ctx = canvas.getContext('2d');
                    
                    // High DPI resolution scale (2.5x rendering for zero compression distortion)
                    const outputScale = window.devicePixelRatio || 2.5;
                    const unscaledViewport = page.getViewport({ scale: 1.0 });
                    const containerWidth = Math.min(container.clientWidth || 1000, window.innerWidth);
                    const cssScale = containerWidth / unscaledViewport.width;
                    const viewport = page.getViewport({ scale: cssScale * outputScale });

                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';

                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };
                    page.render(renderContext);
                });
            }
        }).catch(function(err) {
            console.log("PDF.js render fallback to native embed.");
        });
    </script>
</body>
</html>
