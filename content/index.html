<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Appalachian Corridor Digital Archive</title>
    <style>
        :root {
            --bg: #0f172a;
            --header-bg: #1e293b;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --base-font-size: 16px;
        }

        html { font-size: var(--base-font-size); scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 1.75rem 1rem;
            text-align: center;
        }

        header h1 { color: var(--accent); margin: 0 0 0.25rem 0; font-size: 1.8rem; font-weight: 700; }
        header p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

        .controls {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; }

        .search-bar {
            flex: 1;
            min-width: 220px;
            padding: 0.65rem 1rem;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

        .settings-bar { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }

        .btn {
            background: #334155;
            border: 1px solid var(--border);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn:hover, .btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .filter-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; }

        .tab {
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            background: #334155;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .tab.active, .tab:hover { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }

        @media only screen and (min-width: 852px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media only screen and (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s ease, transform 0.2s ease;
            content-visibility: auto;
            contain-intrinsic-size: 1px 250px;
        }

        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.75rem;
        }

        .card-title { font-size: 1.05rem; font-weight: 600; color: var(--accent); margin-bottom: 0.5rem; }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 0.5rem;
            margin-top: 1rem;
        }

        .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700; font-size: 0.75rem; }
        .badge-text { background: #0369a1; color: #e0f2fe; }
        .badge-pdf { background: #991b1b; color: #fee2e2; }
        .badge-audio { background: #92400e; color: #fef3c7; }

        .no-results { text-align: center; grid-column: 1 / -1; padding: 2rem; color: var(--text-muted); display: none; }
    </style>
</head>
<body>
    <header>
        <h1>Appalachian Corridor Archive</h1>
        <p>Great Smoky Mountains National Park to DuPont State Recreational Forest</p>
    </header>

    <div class="container">
        <section class="controls">
            <div class="control-row">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search full text across all books, PDFs, and audio...">
                <div class="settings-bar">
                    <span>Font Size:</span>
                    <button class="btn" onclick="setFontSize('14px')">S</button>
                    <button class="btn active" id="btnMed" onclick="setFontSize('16px')">M</button>
                    <button class="btn" onclick="setFontSize('18px')">L</button>
                </div>
            </div>

            <div class="filter-tabs" id="filterTabs">
                <div class="tab active" data-category="ALL">All</div>
                <div class="tab" data-category="History">History</div>
                <div class="tab" data-category="Cherokee">Cherokee</div>
                <div class="tab" data-category="Culture">Culture</div>
                <div class="tab" data-category="Nature">Nature</div>
                <div class="tab" data-category="Travel">Travel</div>
                <div class="tab" data-category="Audio">Audio</div>
            </div>
        </section>

        <main class="grid" id="cardGrid">
            <div class="no-results" id="noResults">No matching documents found.</div>
        </main>
    </div>

    <script>
        const searchData = [{"id": "gutenberg-58971", "title": "Great Smoky Mountains National Park", "category": "History", "path": "texts/58971.html", "cover": "", "type": "TEXT", "content": "Great Smoky Mountains National Park"}, {"id": "gutenberg-71447", "title": "Great Smoky Mountains National Park: Open All Year", "category": "History", "path": "texts/71447.html", "cover": "", "type": "TEXT", "content": "Great Smoky Mountains National Park: Open All Year"}, {"id": "gutenberg-31709", "title": "Our Southern Highlanders", "category": "Culture", "path": "texts/31709.html", "cover": "", "type": "TEXT", "content": "Our Southern Highlanders"}, {"id": "gutenberg-50952", "title": "The Heart of the Alleghanies", "category": "Travel", "path": "texts/50952.html", "cover": "", "type": "TEXT", "content": "The Heart of the Alleghanies"}, {"id": "gutenberg-48408", "title": "Letters from the Alleghany Mountains", "category": "Travel", "path": "texts/48408.html", "cover": "", "type": "TEXT", "content": "Letters from the Alleghany Mountains"}, {"id": "gutenberg-60246", "title": "Gatlinburg and the Great Smokies", "category": "History", "path": "texts/60246.html", "cover": "", "type": "TEXT", "content": "Gatlinburg and the Great Smokies"}, {"id": "gutenberg-3126", "title": "On Horseback", "category": "Travel", "path": "texts/3126.html", "cover": "", "type": "TEXT", "content": "On Horseback"}, {"id": "gutenberg-59522", "title": "Biltmore House and Gardens", "category": "History", "path": "texts/59522.html", "cover": "", "type": "TEXT", "content": "Biltmore House and Gardens"}, {"id": "gutenberg-31367", "title": "The Training of a Forester", "category": "Forestry", "path": "texts/31367.html", "cover": "", "type": "TEXT", "content": "The Training of a Forester"}, {"id": "gutenberg-72365", "title": "At Home in the Smokies", "category": "History", "path": "texts/72365.html", "cover": "", "type": "TEXT", "content": "At Home in the Smokies"}, {"id": "gutenberg-45634", "title": "Myths of the Cherokee", "category": "Cherokee", "path": "texts/45634.html", "cover": "", "type": "TEXT", "content": "Myths of the Cherokee"}, {"id": "gutenberg-46493", "title": "The Cherokee Nation of Indians", "category": "Cherokee", "path": "texts/46493.html", "cover": "", "type": "TEXT", "content": "The Cherokee Nation of Indians"}, {"id": "archive-westernnorthcar00arth", "title": "Western North Carolina: A History (1730-1913)", "category": "History", "path": "pdfs/westernnorthcar00arth.html", "cover": "images/westernnorthcar00arth_cover.jpg", "type": "PDF", "content": "Western North Carolina: A History (1730-1913) PDF Document"}, {"id": "archive-historyofwataug00arth", "title": "A History of Watauga County, North Carolina", "category": "History", "path": "pdfs/historyofwataug00arth.html", "cover": "images/historyofwataug00arth_cover.jpg", "type": "PDF", "content": "A History of Watauga County, North Carolina PDF Document"}, {"id": "archive-folksongsofengli00shar", "title": "Folk-songs of English Origin in the Appalachian Mountains", "category": "Culture", "path": "pdfs/folksongsofengli00shar.html", "cover": "images/folksongsofengli00shar_cover.jpg", "type": "PDF", "content": "Folk-songs of English Origin in the Appalachian Mountains PDF Document"}, {"id": "archive-nurserysongsfrom00shar", "title": "Nursery Songs from the Appalachian Mountains", "category": "Culture", "path": "pdfs/nurserysongsfrom00shar.html", "cover": "images/nurserysongsfrom00shar_cover.jpg", "type": "PDF", "content": "Nursery Songs from the Appalachian Mountains PDF Document"}, {"id": "archive-riflemakingingre13nati", "title": "Rifle Making in the Great Smoky Mountains", "category": "Culture", "path": "pdfs/riflemakingingre13nati.html", "cover": "images/riflemakingingre13nati_cover.jpg", "type": "PDF", "content": "Rifle Making in the Great Smoky Mountains PDF Document"}, {"id": "archive-checklistoffungi00pete", "title": "Checklist of Fungi of the Great Smoky Mountains National Park", "category": "Nature", "path": "pdfs/checklistoffungi00pete.html", "cover": "images/checklistoffungi00pete_cover.jpg", "type": "PDF", "content": "Checklist of Fungi of the Great Smoky Mountains National Park PDF Document"}, {"id": "archive-floraofgreatsmok00whit", "title": "Flora of Great Smoky Mountains National Park", "category": "Nature", "path": "pdfs/floraofgreatsmok00whit.html", "cover": "images/floraofgreatsmok00whit_cover.jpg", "type": "PDF", "content": "Flora of Great Smoky Mountains National Park PDF Document"}, {"id": "archive-statushistoryofm00culb", "title": "Status and History of the Mountain Lion in GSMNP", "category": "Nature", "path": "pdfs/statushistoryofm00culb.html", "cover": "images/statushistoryofm00culb_cover.jpg", "type": "PDF", "content": "Status and History of the Mountain Lion in GSMNP PDF Document"}, {"id": "archive-whitetaileddeero00wath", "title": "White-Tailed Deer of Cades Cove", "category": "Nature", "path": "pdfs/whitetaileddeero00wath.html", "cover": "images/whitetaileddeero00wath_cover.jpg", "type": "PDF", "content": "White-Tailed Deer of Cades Cove PDF Document"}, {"id": "archive-carologueaccesst00hoff", "title": "Carologue: Access to North Carolina", "category": "History", "path": "pdfs/carologueaccesst00hoff.html", "cover": "images/carologueaccesst00hoff_cover.jpg", "type": "PDF", "content": "Carologue: Access to North Carolina PDF Document"}, {"id": "elkmont-audio", "title": "Elkmont Historical Audio Recording", "category": "Audio", "path": "audio/elkmont_audio.html", "cover": "", "type": "AUDIO", "content": "Elkmont Historical Audio Recording Oral History"}];
        const searchInput = document.getElementById('searchInput');
        const tabs = document.querySelectorAll('.tab');
        const cardGrid = document.getElementById('cardGrid');

        let currentCategory = 'ALL';
        let searchQuery = '';

        function setFontSize(size) {
            document.documentElement.style.setProperty('--base-font-size', size);
            localStorage.setItem('appalachian_font_size', size);
        }

        const savedFontSize = localStorage.getItem('appalachian_font_size');
        if (savedFontSize) { setFontSize(savedFontSize); }

        function renderCards() {
            cardGrid.innerHTML = '';
            searchData.forEach(item => {
                const matchesCategory = (currentCategory === 'ALL' || item.category === currentCategory);
                let matchesSearch = !searchQuery || item.title.toLowerCase().includes(searchQuery) || (item.content && item.content.toLowerCase().includes(searchQuery));

                if (matchesSearch && matchesCategory) {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = item.path;

                    let badgeClass = 'badge-text';
                    let linkText = '📖 Open Document Viewer →';
                    if (item.type === 'PDF') {
                        badgeClass = 'badge-pdf';
                        linkText = '📄 Open Zero-Distortion Vertical PDF →';
                    } else if (item.type === 'AUDIO') {
                        badgeClass = 'badge-audio';
                        linkText = '🎵 Play Offline Audio (WAV) →';
                    }

                    let coverHTML = item.cover ? `<img data-cover-src="${item.cover}" class="card-cover" alt="Cover" loading="lazy" decoding="async">` : '';

                    card.innerHTML = `
                        <div>
                            ${coverHTML}
                            <div class="card-title">${item.title}</div>
                            <div style="margin-top: 0.5rem; color: var(--accent); font-weight: 600; font-size: 0.85rem;">${linkText}</div>
                        </div>
                        <div class="card-meta">
                            <span>Category: ${item.category}</span>
                            <span class="badge ${badgeClass}">${item.type}</span>
                        </div>
                    `;
                    cardGrid.appendChild(card);
                    card.querySelectorAll('img[data-cover-src]').forEach(img => { img.src = img.getAttribute('data-cover-src'); img.removeAttribute('data-cover-src'); });
                }
            });
        }

        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); renderCards(); });
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.getAttribute('data-category');
                renderCards();
            });
        });
        renderCards();
    </script>
</body>
</html>
