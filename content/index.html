k Series\n\nNational Park Handbooks, compact introductions to the great natural and\nhistoric places administered by the National Park Service, are designed\nto promote understanding and enjoyment of the parks. Each is intended to\nbe informative reading and a useful guide before, during, and after a\npark visit. More than 100 titles are in print. This is Handbook 112. You\nmay purchase the handbooks through the mail by writing to Superintendent\nof Documents, U.S. Government Printing Office, Washington, DC 20402.\n\n\n                            About This Book\n\nGreat Smoky Mountains National Park straddles the North\nCarolina-Tennessee border and encompasses the climax of the Appalachian\nMountain System. Major attractions are the mountains themselves, the\npreserved structures and lore of mountain folklife, stupendous displays\nof flowering plants and shrubs, fall colors, wild animals, superb hiking\nopportunities, and gorgeous rivers, streams, and waterfalls. This\nhandbook is published in support of the National Park Service's\nmanagement policies and interpretive programs at the park. Part 1 gives\na brief introduction to what you may find in a leisurely visit to the\npark; Part 2 outlines the natural history of the mountains and their\nvalleys; and Part 3 presents concise travel guide and reference\nmaterials.\n\n\n           Library of Congress Cataloging in Publication Data\n\n\n  United States. National Park Service.\n  Great Smoky Mountains National Park, North Carolina and Tennessee.\n  (National park handbook; 112)\n  Includes index.\n  1. Great Smoky Mountains National Park (N.C. and Tenn.)\n    I. Title.\n    II. Series: Handbook (United States. National Park Service. Division\n          of Publications); 112.\n  F443.G7U63 1981    976.8'89    81-11320    AACR2\n\n\n                                Contents\n\n  Part 1 Welcome to the Great Smokies                                   4\n      The Appalachians at Their Best                                    7\n  Part 2 The Nature of Things in the Highlands                         22\n      _By Napier Shelton_\n      A One-day Walk to Maine                                          25\n      The Trout's World                                                39\n      The Evolution of Abundance                                       53\n      Bears, Boars and Acorns                                          67\n      The Tracks of Our Predecessors                                   79\n  Part 3 Guide and Adviser                                             98\n      Topical Reference                                               101\n      Going to the Great Smokies                                      101\n      Park Map                                                        102\n      Visitor Centers                                                 104\n      The Smokies by Car                                              107\n      Wildflowers and Fall Colors                                     110\n      Activities                                                      112\n      Hiking and Backpacking                                          114\n      Accommodations                                                  118\n      For Your Safety                                                 120\n      Nearby Attractions                                              122\n      Books to Read                                                   125\n      Index                                                           126\n\n\n\n\n                   1    Welcome to the Great Smokies\n\n\n    [Illustration: _A rustic Cades Cove cabin preserves the spirit of\n    pioneer life and times._]\n\n    [Illustration: _Here in the East's wettest corner, winter snows\n    release moisture slowly into the ground until spring thaw swells\n    streams to rush downslope. The ultimate destination? The Gulf of\n    Mexico._]\n\n\n                     The Appalachians at Their Best\n\nAt first glimpse there appear to be two Smokies: the mountains' wild\nnature, and the folk life. The mind calls up both the sweeping mountain\nvistas whose peaks succeed peaks to the far horizon and the rustic\ncabins and barns set off with the split rail fences of 19th-century\nmountain life. The mountains are everywhere, punctuated by restored\nsettlements, by Cades Cove, Mingus Mill, Cataloochee, and Little\nGreenbrier. But this is not the full story for there are many, many\nGreat Smokies, a double fistful of which may be just for you. There are\nas many Great Smokies as there are people who come here intent on\ndiscovering their secrets: the folklorist's and amateur historian's\nSmokies; the trout angler's Smokies; the Smokies of the backpacker,\nday-tripper, and trail walker; the botanist's, ecologist's, and birder's\nSmokies; and the automobile tourist's Smokies. Take your pick.\n\nYou can walk into the Smokies, into the heart of the wilderness. You can\ndrive through the Smokies, through the jewels in the crown of the\nAppalachian highlands. You can enter them through North Carolina or\nthrough Tennessee. But you can also enter them through any strong\ninterest _you_ may have, for there are as many Smokies as there are ways\nyou can see them. And one good way to see them is through the eyes of a\nnative son whose love for these mountains is exceeded only by his love\nfor people. Such is Glenn Cardwell.\n\nGlenn Cardwell took his aging mother and father down to the Noah \"Bud\"\nOgle cabin just after the National Park Service finished restoring it.\nGlenn works for the park and would conduct nature walks at the cabin, so\nhe wanted to see what his folks would say. They used to live nearby and\nhis mother's Aunt Cindy and her husband, Noah, built the cabin just off\nCherokee Orchard Road out of Gatlinburg.\n\n\"Well I'll tell you,\" Glenn said, \"my mother got to reminiscing not one\nstep off the parking lot and stopped at every rock and spot in the yard\nand told a tale. It must've taken the better part of an hour just to get\nher through the yard and down to the porch.\"\n\nGlenn's mother took one look at the porch and said, \"They put the step\n[a big flat rock] in the wrong place.\" And so the restoration team had\n... but it was another rock that bothered Mrs. Cardwell most.\n\nWalking back to the car she stopped dead in her tracks and said\ndespairingly, \"What have they _done_ to Cindy's rock?\"\n\nGlenn had no idea what she meant although he could see the road cut\nclose to a big boulder. The road had been relocated but Glenn recalled\nnothing unusual about the rock.\n\nHis mother, still staring, repeated her question. Glenn's father\nshrugged, \"Looks to me like somebody blowed hell out of it.\"\n\n\"I still couldn't figure out what was bothering my mother,\" Glenn said.\n\nBut now, in the 1980s, he will tell you that everyone in the Smokies had\nscaffolds in their yards back in Aunt Cindy's day for drying fruits and\nvegetables for winter storage. Everyone, that is, but Aunt Cindy. She\nused the big boulder across from their cabin, or what used to be the\nflat part of it. Many's the time Glenn's mother, as a little girl,\nhelped Aunt Cindy spread produce to sun dry on the rock.\n\nGlenn Cardwell is an affable walking encyclopedia of Smokies life at the\ntime the Smokies changed from a piece of Tennessee and North Carolina\nreal estate into our second national park in the East. Stories such as\nGlenn's--and there are many--supply a compelling human resonance to this\nwilderness land. Glenn's enthusiasm is a bit unusual, because his father\nwas bought out _twice_ by the Federal government as lands were being\nacquired for the park. And each buy-out meant an unplanned relocation\nfor the family, moving and building anew.\n\n\"I think if my mother hadn't had me on the way at the time of the first\nbuy-out,\" Glenn said, \"my father would have pulled up stakes and gone\nback to Cumberland, Virginia, like many, many of our other relatives\ndid.\" But the Cardwells stayed on near the park and Glenn embodies a\ntransition, bridging new and old ways of doing and seeing things here.\nHis father was bitter at first, but when he visited the Noah \"Bud\" Ogle\nCabin years later he admitted he was glad the park had come along so\nthat some things remained unchanged. It was nice, he said, that he and\nothers could still see the land as it had been.\n\nThe Great Smokies represented a new direction in national park policy in\nthe 1920s. The eighteen national parks then in existence in the West had\nbeen created from lands already owned by the Federal government. The\nSmokies lands authorized for park purchase beginning in 1926 were all in\nprivate ownership in more than 6,600 tracts. The lion's share was owned\nby eighteen timber and pulpwood companies, but 1,200 other tracts were\nfarms. Worse, there were also more than 5,000 lots and summer homes.\nMany of these had been won in promotion schemes and their owners had\nnever bothered to pay taxes on them. This created an awesome land\nacquisition headache.\n\nThe Federal government would not purchase land for national parks in\nthose days, so in 1927 the Tennessee and North Carolina legislatures\neach provided for appropriation of $2 million to purchase the land.\nAlready, $1 million had been pledged. The legislation also created State\nPark Commissions in each state to handle the buying. The John D.\nRockefeller family supplemented the fund drive with a $5 million\ndonation. This was considered one of the biggest and most important\naccomplishments of the entire national park movement. The two states\neventually purchased the needed lands and donated them to the Federal\ngovernment.\n\nTen years of dogged, full-scale activity and several more years of tying\nup loose ends were required to get the acquisition job done. Despite\nthis tremendous impact of human land use in the Smokies, however, about\nforty percent of the park's 209,000 hectares (517,000 acres) constitutes\nthe East's most extensive virgin forest. Forest recovery is now well\nunderway throughout the park despite the former blight left by logging\nand subsequent forest fires, and landslides, and other forms of erosion.\n\nAt one time no sharp edge separated two aspects of nature in the Great\nSmokies: man and the wilderness. Cherokee Indians lived here in ways\nironically similar to those of the whites who would soon displace them.\nThey cultivated crops, hunted, believed in one god, practiced a\ndemocratic form of government, and lived not in teepees but in\nmud-and-log structures. \"The place of blue smoke,\" _Shaconage_, they\ncalled this mountain hunting ground. And here amidst the haze lived also\nthe spirit of their people; it, too, could not be divorced from the land\nitself. Treaty after treaty saw the Cherokees lose more and more\nhomeland, up to and finally including the Smokies. In one of the great\nhuman tragedies that blots American history they were forcibly removed\nwestward, \"relocated\" to Oklahoma via the \"Trail of Tears.\" One fourth\nof the people died along the way. A few Cherokees had resisted removal,\nstaying behind in small groups and hiding out in the mountains. Troops\ncould not relocate them because they couldn't _locate_ them. Later the\nCherokees were allowed to return and reclaim the borders of their old\nhomeland. They live there today on the Cherokee Reservation.\n\n    [Illustration: _A contented cow lends realism to the reconstructed\n    Pioneer Farmstead, next to Oconaluftee Visitor Center._]\n\n    [Illustration: _Mt. LeConte is the park's third highest peak,\n    following Mt. Guyot and Clingmans Dome, the highest. Smokies rocks\n    are among the continent's oldest sediments. The ranges have survived\n    200 million years of erosion. By contrast, the Sierra Nevada is\n    thought to be only 1 million years old._]\n\n    [Illustration: _First things first! A rain-geared backpacker makes\n    sure her feet are protected against blisters. The park offers more\n    than 1,300 kilometers (800 miles) of trails, including 110\n    kilometers (70 miles) of the Appalachian Trail that stretches from\n    Maine to Georgia._]\n\nIt is difficult now to appreciate the pressure once exerted on the\nAppalachian highlands by human settlement. Back when land meant\nlivelihood to a nation of agrarian people, the gradual pressure from the\neastern coast, across the Piedmont, reached the Appalachian chain. The\nshortage of arable lands forced people into and finally onto the\nmountains in search of a plot of ground that would produce a livelihood.\nAnd so settlement came to the Great Smokies, gradually working its way\nup the mountainsides to the limits of cultivation. Grazing was\neventually pushed beyond those limits all the way up the mountain to the\nbalds. Combined overgrazing, overfishing, destructive logging practices,\nand overhunting would soon turn dense wilderness into a ravaged\nlandscape. The National Park was authorized in 1926, established for\nprotection in 1930, and established for development in 1934. And now,\nabout 50 years later, wilderness is again in ascendancy, as field\nnaturalist Napier Shelton amply testifies as he takes you exploring in\nPart Two of this handbook.\n\nThe wilderness richness here is both astounding and close at hand.\nRichness? There are more species of salamanders here--22--than in any\nother part of the world. In the lush density of the Smokies forests\nthere are more tree species than in all of Nort"}, {"id": "gutenberg-71447", "title": "Great Smoky Mountains National Park: Open All Year", "category": "History", "path": "texts/71447.txt", "type": "TEXT", "local": "content/texts/71447.txt", "content": "The Project Gutenberg eBook of Great Smoky Mountains National Park\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Great Smoky Mountains National Park\n        Tennessee--North Carolina, open all year\n\nCreator: United States. National Park Service\n\n\n        \nRelease date: August 19, 2023 [eBook #71447]\n\nLanguage: English\n\nOriginal publication: Washington DC: U. S. Government Printing Office, 1954\n\nOther information and formats: www.gutenberg.org/ebooks/71447\n\nCredits: Bob Taylor, Lisa Corcoran, Stephen Hutcheson and the Online Distributed Proofreading Team at https://www.pgdp.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK GREAT SMOKY MOUNTAINS NATIONAL PARK ***\n\n\n\n\n\n  Transcriber\u2019s Note\n  Italic text displayed as: _italic_\n  Bold text displayed as: =bold=\n\n\n\n\n  Great Smoky\n  Mountains\n  NATIONAL PARK\n\n  TENNESSEE\u2014NORTH CAROLINA\n  OPEN ALL YEAR\n\n  [Illustration: stream in woods]\n\n  UNITED STATES DEPARTMENT OF THE\n  INTERIOR \u00b7 Douglas McKay, _Secretary_\n  NATIONAL PARK SERVICE \u00b7 Conrad L. Wirth, _Director_\n\n\n\n\n  Great Smoky\n  Mountains\n  NATIONAL PARK\n\n  The National Park System, of which this park is a unit, is\n  dedicated to conserving the scenic, scientific, and historic\n  heritage of the United States for the benefit and enjoyment of its\n  people.\n\n\nGreat Smoky Mountains National Park is located on the crest of the\nhigh divide which forms the boundary between Tennessee and North\nCarolina. This mountain range, representing one of the oldest uplands\non earth, zigzags through the park from northeast to southwest for 71\nmiles, or 54 miles by air line. For 36 miles along its main crest the\nrange maintains an altitude in excess of 5,000 feet. Sixteen of its\npeaks rise more than 6,000 feet. The deep blue haze rising from the\nvalleys to the summits of the lofty peaks gives these mountains their\nname.\n\n[Illustration: _View from Heintooga Overlook._]\n\nRenowned for its splendid forests and containing a rich variety\nof plant life, the Great Smokies region has long been regarded by\nprominent botanists as the cradle of the present vegetation of\neastern America.\n\nArnold Guyot, eminent scientist whose exploration of the Appalachian\nSystem began a century ago, was the first to describe the Great Smoky\nMountains from personal observation. He wrote:\n\n\u201cAlthough the high peaks of the Smoky mountains are some fifty feet\nlower than the isolated and almost exceptional group of the Black\nmountains, by their number, their magnitude, the continuity and\ngeneral elevation of the chains, and of the base upon which they\nrepose, they are like a massive and high citadel which is really the\nculminating region of all the Appalachian System.\u201d\n\n\n\n\nHistory of the Park\n\n\nPrior to the start of the 20th century, the area now comprising\nthe park was little known to the outside world, although DeSoto is\nbelieved to have viewed the mountains. They were, and still are, the\nhome of the Cherokees who now occupy the Cherokee Indian Reservation\nin North Carolina, adjacent to the park on the south. The few white\nsettlers were the rugged mountaineer descendants of colonists from\nEngland and Scotland who lived isolated and primitive lives. The\nGreat Smokies region became better known during and subsequent to\nWorld War I when logging railroads of lumber companies penetrated\nsome of its virgin forests. Still later, highways skirted the area\nand visitors were able to view its majestic peaks from a distance.\n\nThe successful movement for the creation of a national park in this\narea was begun in 1923, and its establishment was authorized by\nthe Federal Government by act of Congress approved May 22, 1926.\nEnabling acts were passed by the State legislatures of North Carolina\nand Tennessee in 1927, and land acquisition was begun with State\nfunds, matched by a generous donation made by John D. Rockefeller,\nJr., through the Laura Spelman Rockefeller Memorial, in honor of\nhis mother. Subsequently, Federal funds were made available for the\ncompletion of the project.\n\nOn February 6, 1930, the Governors of North Carolina and Tennessee\npresented the Secretary of the Interior with deeds to an initial\n158,876 acres of land on behalf of their respective States. A limited\npark was thus established for administration and protection. The\npark, now containing 507,168 acres of Federal lands, was formally\ndedicated on September 2, 1946.\n\n\n\n\nPioneer Culture in the Great Smokies\n\n\nGreat Smoky Mountains National Park presents an opportunity to\npreserve frontier conditions of a century ago. The cultural and human\ninterest aspects of this park are exceeded only by its scenery and\nnatural history.\n\nIn places where the forest has not yet encroached upon them, there\nare clearings which were the sloping little farms of the mountain\npioneers. Sturdy log structures in varying stages of disintegration\nremain there as evidence of a way of life which has practically\ndisappeared in eastern United States. Some of these log cabins,\nbarns, and other buildings have been rehabilitated in place so that\nyou may see the original structures in their true setting. Most of\nthem are in Cades Cove, where the park\u2019s only grist mill powered by\nan overshot wheel is located. Cades Cove, an isolated, oval-shaped\nvalley surrounded by mountains, is a region of outstanding pastoral\ncharm which you should visit.\n\nSome of the finest of various types of authentic pioneer structures\nhave been assembled in the immediate vicinity of the Oconaluftee\nRanger Station and Pioneer Museum, located on the cross-mountain\nhighway about 2 miles north of Cherokee, N. C. On display in the\nmuseum are tools, household objects, and a variety of other handmade\nitems which were used by the pioneers who made their homes on lands\nwhich now comprise the park. This building is open from 9 a. m. to 5\np. m., April through October.\n\n\n\n\nThe Cherokee Indian Reservation\n\n\nYou will be interested in the Cherokee Indians on the Cherokee\nReservation, which is immediately south of the park. Although the\nGovernment has instituted here a comprehensive system of education\nand modern methods of living, ancient ceremonies and sports are\npreserved as tribal customs.\n\n[Illustration:\n\n  THOMPSON PHOTO\n\n_Rhododendron along the trail to Mount Le Conte._]\n\n\n\n\nForests\n\n\nCrowning the highest peaks with spruce and fir and carpeting the\nmountainsides with a wealth of deciduous trees is an unbroken\nforest cover, which cannot be matched in eastern America. In all of\nEurope there are not as many species of native trees as are to be\nfound in Great Smoky Mountains National Park. A number of these,\nsuch as Canada hemlock, silverbell, red spruce, yellow buckeye, and\nmountain-ash grow to record size, while others become giants of their\nkind. Approximately 40 percent of the more than half-million acres\nwhich comprise the park are in the original forested condition. A\ntotal of 130 native tree species are known to grow in this area.\n\n\n\n\nOther Plant Life\n\n\nFew, if any, areas in the eastern United States possess so great a\nvariety of plants. Altogether, the tree, shrub, and herb varieties\ntotal more than 1,300. Botanists have also listed over 1,800 species\nof fungi, 330 mosses and liverworts, and 230 lichens. The earliest\nflowers occasionally appear by the close of February in lowland\nareas, while the witchhazel, latest to bloom, may hold its blossoms\ninto December. Late April finds the spring flowers, including the\nabundant dogwood, at their blossoming peak; May is best for the\nmountain laurel; middle June usually finds both the flame azalea and\nrose-purple rhododendron at their finest; middle July is likely to be\nthe peak of the great white rhododendron\u2019s flowering. Autumn colors\nare excellent throughout October, with the height of coloration near\nthe end of the month.\n\n\n\n\nA Wildlife Sanctuary\n\n\nHere, as in all national parks, wildlife is given complete\nprotection. No hunting or trapping is permitted. Since establishment\nof the park, the black bear population has increased considerably, and\nsuch animals as the white-tailed deer, red and gray foxes, raccoon,\nbobcat, wild turkey, ruffed grouse, and others find sanctuary in\nthese mountains. More than 52 species of fur-bearing animals, some\n200 birds, 36 reptiles, 37 amphibians, and 80 fishes are known to\nlive here.\n\n=The feeding, touching, teasing, or molesting of bears is\nprohibited.= This regulation is enforced strictly for the protection\nof the public. Persons using park trails have nothing to fear from\nunmolested bears. If tempted by food, however, some bears, which\nfrequent sections of the motor road, become dangerous. They should\nnot be fed or approached. Persons using the Appalachian Trail\nshelters can protect their food supplies by suspending them from tree\nlimbs outside the shelter.\n\n\n\n\nFishing\n\n\nApproximately 600 miles of streams, many of them well suited to\ntrout, flow down the slopes of the Great Smoky Mountains. Each year\nthousands of hatchery-reared trout are released in the more heavily\nfished waters. Rainbow and brook trout and small-mouth bass lure the\ndevotees of Izaak Walton. Persons fishing in park waters must have\nthe State or county license issued and required by North Carolina, or\nthe State license issued and required by Tennessee, depending upon\nthe section of the park being fished. Catches are regulated, and some\nstreams may be found closed for restocking. The fishing season is\nfrom May 16 to August 31. Current regulations may be obtained from\nthe office of the superintendent or from park rangers or wardens.\n\n\n\n\nInterpretive Service\n\n\nBeginning in May and continuing for 6 months, a program of\nnaturalist-guided field trips and talks is available. This service is\nmaintained by the Government and is free to the public.\n\nNaturalists meet hikers at designated points in or near the park and\nconduct visits to outstanding objectives over good trails. Plant and\nanimal life is discussed informally along the way. There are several\ntypes of walks ranging from 2 hours to all day. Illustrated talks are\ngiven in the evenings at regular intervals, chiefly in hotel lobbies\nand other points of visitor-concentration.\n\nPrograms describing the nature-guide service are available\n(May-October) at headquarters and at Oconaluftee Ranger Station and\nare posted in hotels and various places throughout the park.\n\n\n\n\nAccommodations\n\n\nFree modern campgrounds are provided on the Tennessee side of the\npark at the Chimney Tops, 6 miles south of Gatlinburg, and Cades\nCove, 7 miles from the Townsend entrance to the park; on the North\nCarolina side at Smokemont, on the transmountain highway, Balsam\nMountain, 10 miles from Soco Gap on U. S. 19 (Blue Ridge Parkway\nspur), and Deep Creek, 2 miles from Bryson City. Aside from these\ncampgrounds, the only accommodations in the park are at Le Conte\nLodge on the top of Mount Le Conte, accessible only by foot or\nhorseback. For reservations and rates, write Jack Huff, Gatlinburg,\nTenn.\n\nA number of hotel and tourist courts are available in cities and\ntowns near the park, and at Knoxville and Asheville. Inquiries\nregarding these accommodations should be addressed to Knoxville\nTourist Bureau, Henley Street, Knoxville, Tenn.; East Tennessee\nAutomobile Club, Knoxville, Tenn., Chambers of Commerce of\nGatlinburg, Knoxville, and Maryville, Tenn., Asheville, Waynesville,\nBryson City, and Sylva, N. C.; Cherokee Association, Cherokee, N. C.;\nand Government Services, Inc., Fontana Village, Fontana Dam, N. C.\n\n\n\n\nAdministration\n\n\nGreat Smoky Mountains National Park is administered by the National\nPark Service of the United States Department of the Interior. A\nsuperintendent, whose address is Gatlinburg, Tenn., is in immediate\ncharge. Park headquarters are located 2 miles south of Gatlinburg.\nA member of the protection division maintains headquarters at\nOconaluftee Ranger Station, N. C., on U. S. 441; post office,\nCherokee, N. C.\n\n[Illustration:\n\n  THOMPSON PHOTO\n\n_Newfound Gap, highest point on the transmountain highway._]\n\n\n\n\nHelp Us Protect This Park\n\n\nPlease note the following requirements which are necessary for the\nprotection of the natural beauties of the park, as well as for your\ncomfort and convenience:\n\nThe park is a sanctuary for all living things. It is a violation of\nthe law to destroy, injure, or disturb trees, shrubs, flowers, birds,\nanimals, or any natural feature in the park.\n\nThe speed limit is 35 miles an hour, unless otherwise posted. Drive\ncarefully; keep to the right. Report all accidents to a park ranger.\n\nCamping or lighting fires at places other than designated campgrounds\nor picnic areas is not allowed, except by permit. To camp in remote\nsections of the park, except during periods of high fire hazard,\npermits may be secured at the office of the superintendent, the\nOconaluftee Ranger Station, or from the district park rangers or\nwardens. Camping is restricted to certain periods at the campgrounds.\nIndividual sites provided with fireplaces and water are available.\n\nPlease help to keep the park clean. Do not scatter papers, picnic\nremnants, and the like; use trash receptacles along roads, in picnic\nareas, and campgrounds.\n\nFire is one of the greatest dangers to the park. Put out fires\ncompletely upon leaving. Be sure cigarettes and matches are out\nbefore disposal. Lunches may be eaten along roadsides, but fires\nshould not be built.\n\nOnly those persons having special permits may collect botanical or\ngeological specimens in the park. Such permits may be secured by\ncompetent scientists upon application to the superintendent.\n\nDogs and cats are permitted in the park if on leash, crated, or\notherwise under physical restrictive control at all times.\n\nThe feeding, touching, teasing, or molesting of bears is prohibited.\n\nDeliberate infraction of park regulations may bring penalty of fine\nor imprisonment or both.\n\n\n[Illustration: Memorial Plaque\n\n  The founders of Great Smoky Mountains National Park are honored\n  with a memorial at Newfound Gap, on the North Carolina-Tennessee\n  line. A bronze plaque on a high terrace wall of the memorial bears\n  the following inscription:\n\n  \u201c=FOR THE PERMANENT ENJOYMENT OF THE PEOPLE\u2014This Park Was Given\n  One-half By The Peoples And States of North Carolina And Tennessee\n  And By The United States of America And One-Half In Memory of Laura\n  Spelman Rockefeller By The Laura Spelman Rockefeller Memorial\n  Founded By Her Husband John D. Rockefeller.=\u201d]\n\n  Revised 1954      16\u201453420-6      GPO\n\n[Illustration: GREAT SMOKY MOUNTAINS NATIONAL PARK]\n\nCOMPLETELY EXTINGUISH MATCHES AND CIGARETTES BEFORE THROWING AWAY.\nBE SURE CAMPFIRE IS OUT BEFORE LEAVING IT.\nALWAYS USE CAR ASHTRA"}, {"id": "gutenberg-31709", "title": "Our Southern Highlanders", "category": "Culture", "path": "texts/31709.txt", "type": "TEXT", "local": "content/texts/31709.txt", "content": "The Project Gutenberg eBook of Our Southern Highlanders\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Our Southern Highlanders\n\nAuthor: Horace Kephart\n\n\n        \nRelease date: March 20 12\n\n  XI. THE LAND OF DO WITHOUT                  234\n\n XII. HOME FOLKS AND NEIGHBOR PEOPLE          256\n\nXIII. THE MOUNTAIN DIALECT                    276\n\n XIV. THE LAW OF THE WILDERNESS               305\n\n  XV. THE BLOOD-FEUD                          327\n\n XVI. WHO ARE THE MOUNTAINEERS?               354\n\nXVII. \"WHEN THE SLEEPER WAKES\"                378\n\n\n\n\nILLUSTRATIONS\n\n\nBig Tom Wilson, the bear hunter              _Frontispiece_\n\n                                                FACING PAGE\n\nMap of Appalachia                                         8\n\nA family of pioneers in the twentieth century            16\n\n\"The very cliffs are sheathed with trees and shrubs\"     24\n\nAt the Post-Office                                       32\n\nThe author in camp in the Big Smokies                    40\n\n\"Bob\"                                                    48\n\n\"There are few jutting crags\"                            56\n\nThe bears' home--laurel and rhododendron                 64\n\nThe old copper mine                                      72\n\n\"What soldiers these fellows would make under\nleadership of some backwoods Napoleon\"                   80\n\n\"By and by up they came, carrying the bear on\nthe trimmed sapling\"                                     88\n\nSkinning a frozen bear                                   96\n\n\"... Powerful steep and laurely....\"                    104\n\nMountain still-house hidden in the laurel               112\n\nMoonshine still, side view                              120\n\nMoonshine still in full operation                       128\n\nCorn mill and blacksmith forge                          136\n\nA tub-mill                                              152\n\nCabin on the Little Fork of Sugar Fork of Hazel\nCreek in which the author lived alone for three years   160\n\nA mountain home                                         176\n\nMany of the homes have but one window                   192\n\nThe schoolhouse                                         208\n\n\"At thirty a mountain woman is apt to have a\nworn and faded look\"                                    216\n\nThe misty veil of falling water                         232\n\nAn average mountain cabin                               240\n\nA bee-gum                                               248\n\nLet the women do the work                               264\n\n\"Till the sky-line blends with the sky itself\"          288\n\nWhitewater Falls                                        312\n\nThe road follows the creek--there may be a dozen\nfords in a mile                                         320\n\n\"Dense forest and luxuriant undergrowth\"                336\n\n\n\n\n[Illustration: APPALACHIA\n\nThe wavy black line shows the outer boundaries of Southern Appalachian\nRegion. The shaded portion shows the chief areas covered by high\nmountains, 3,000 to 6,700 feet above sea-level.]\n\n\n\n\nOUR SOUTHERN HIGHLANDERS\n\n\n\n\nOUR SOUTHERN HIGHLANDERS\n\n\nCHAPTER I\n\n\"SOMETHING HIDDEN; GO AND FIND IT\"\n\n\nIn one of Poe's minor tales, written in 1845, there is a vague allusion\nto wild mountains in western Virginia \"tenanted by fierce and uncouth\nraces of men.\" This, so far as I know, was the first reference in\nliterature to our Southern mountaineers, and it stood as their only\ncharacterization until Miss Murfree (\"Charles Egbert Craddock\") began\nher stories of the Cumberland hills.\n\nTime and retouching have done little to soften our Highlander's\nportrait. Among reading people generally, South as well as North, to\nname him is to conjure up a tall, slouching figure in homespun, who\ncarries a rifle as habitually as he does his hat, and who may tilt its\nmuzzle toward a stranger before addressing him, the form of salutation\nbeing:\n\n\"Stop thar! Whut's you-unses name? Whar's you-uns a-goin' ter?\"\n\nLet us admit that there is just enough truth in this caricature to give\nit a point that will stick. Our typical mountaineer is lank, he is\nalways unkempt, he is fond of toting a gun on his shoulder, and his\ncuriosity about a stranger's name and business is promptly, though\npolitely, outspoken. For the rest, he is a man of mystery. The great\nworld outside his mountains knows almost as little about him as he does\nof it; and that is little indeed. News in order to reach him must be of\nsuch widespread interest as fairly to fall from heaven; correspondingly,\nscarce any incidents of mountain life will leak out unless they be of\nsensational nature, such as the shooting of a revenue officer in\nCarolina, the massacre of a Virginia court, or the outbreak of another\nfeud in \"bloody Breathitt.\" And so, from the grim sameness of such\nreports, the world infers that battle, murder, and sudden death are\ncommonplaces in Appalachia.\n\nTo be sure, in Miss Murfree's novels, as in those of John Fox, Jr., and\nof Alice MacGowan, we do meet characters more genial than feudists and\nillicit distillers; none the less, when we have closed the book, who is\nit that stands out clearest as type and pattern of the mountaineer? Is\nit not he of the long rifle and peremptory challenge? And whether this\nbe because he gets most of the limelight, or because we have a furtive\nliking for that sort of thing (on paper), or whether the armed outlaw be\nindeed a genuine protagonist--in any case, the Appalachian people remain\nin public estimation to-day, as Poe judged them, an uncouth and fierce\nrace of men, inhabiting a wild mountain region little known.\n\nThe Southern highlands themselves are a mysterious realm. When I\nprepared, eight years ago, for my first sojourn in the Great Smoky\nMountains, which form the master chain of the Appalachian system, I\ncould find in no library a guide to that region. The most diligent\nresearch failed to discover so much as a magazine article, written\nwithin this generation, that described the land and its people. Nay,\nthere was not even a novel or a story that showed intimate local\nknowledge. Had I been going to Teneriffe or Timbuctu, the libraries\nwould have furnished information a-plenty; but about this housetop of\neastern America they were strangely silent; it was _terra incognita_.\n\nOn the map I could see that the Southern Appalachians cover an area much\nlarger than New England, and that they are nearer the center of our\npopulation than any other mountains that deserve the name. Why, then, so\nlittle known? Quaintly there came to mind those lines familiar to my\nboyhood: \"Get you up this way southward, and go up into the mountain;\nand see the land, what it is; and the people that dwelleth therein,\nwhether they be strong or weak, few or many; and what the land is that\nthey dwell in, whether it be good or bad; and what cities they be that\nthey dwell in, whether in tents, or in strongholds; and what the land\nis, whether it be fat or lean, whether there be wood therein or not.\"\n\nIn that dustiest room of a great library where \"pub. docs.\" are stored,\nI unearthed a government report on forestry that gave, at last, a clear\nidea of the lay of the land. And here was news. We are wont to think of\nthe South as a low country with sultry climate; yet its mountain chains\nstretch uninterruptedly southwestward from Virginia to Alabama, 650\nmiles in an air line. They spread over parts of eight contiguous States,\nand cover an area somewhat larger than England and Scotland, or about\nthe same as that of the Alps. In short, the greatest mountain system of\neastern America is massed in our Southland. In its upper zone one sleeps\nunder blankets the year round.\n\nIn all the region north of Virginia and east of the Black Hills of\nDakota there is but one summit (Mount Washington, in New Hampshire) that\nreaches 6,000 feet above sea level, and there are only a dozen others\nthat exceed 5,000 feet. By contrast, south of the Potomac there are\nforty-six peaks, and forty-one miles of dividing ridges, that rise above\n6,000 feet, besides 288 mountains and some 300 miles of divide that\nstand more than 5,000 feet above the sea. In North Carolina alone the\nmountains cover 6,000 square miles, with an _average_ elevation of 2,700\nfeet, and with twenty-one peaks that overtop Mount Washington.\n\nI repeated to myself: \"Why, then, so little known?\" The Alps and the\nRockies, the Pyrennees and the Harz are more familiar to the American\npeople, in print and picture, if not by actual visit, than are the\nBlack, the Balsam, and the Great Smoky Mountains. It is true that summer\ntourists flock to Asheville and Toxaway, Linville and Highlands, passing\ntheir time at modern hotels and motoring along a few macadamed roads,\nbut what do they see of the billowy wilderness that conceals most of the\nnative homes? Glimpses from afar. What do they learn of the real\nmountaineer? Hearsay. For, mark you, nine-tenths of the Appalachian\npopulation are a sequestered folk. The typical, the average mountain\nman prefers his native hills and his primitive ancient ways.\n\nWe read more and talk more about the Filipinos, see more of the Chinese\nand the Syrians, than of these three million next-door Americans who are\nof colonial ancestry and mostly of British stock. New York, we say, is a\ncosmopolitan city; more Irish than in Dublin, more Germans than in\nMunich, more Italians than in Rome, more Jews than in nine Jerusalems;\nbut how many New Yorkers ever saw a Southern mountaineer? I am sure that\na party of hillsmen fresh from the back settlements of the Unakas, if\ndropped on the streets of any large city in the Union, and left to their\nown guidance, would stir up more comment (and probably more trouble)\nthan would a similar body of whites from any other quarter of the earth;\nand yet this same odd people is more purely bred from old American stock\nthan any other element of our population that occupies, by itself, so\ngreat a territory.\n\nThe mountaineers of the South are marked apart from all other folks by\ndialect, by customs, by character, by self-conscious isolation. So true\nis this that they call all outsiders \"furriners.\" It matters not whether\nyour descent be from Puritan or Cavalier, whether you come from\nBoston or Chicago, Savannah or New Orleans, in the mountains you are a\n\"furriner.\" A traveler, puzzled and scandalized at this, asked a native\nof the Cumberlands what he would call a \"Dutchman or a Dago.\" The fellow\nstudied a bit and then replied: \"Them's the outlandish.\"\n\n\n[Illustration: A Family of Pioneers in the Twentieth Century]\n\n\nForeigner, outlander, it is all one; we are \"different,\" we are \"quar,\"\nto the mountaineer. He knows he is an American; but his conception of\nthe metes and bounds of America is vague to the vanishing point. As for\ncountries over-sea--well, when a celebrated Nebraskan returned from his\ntrip around the globe, one of my backwoods neighbors proudly informed\nme: \"I see they give Bryan a lot of receptions when he kem back from the\nother world.\"\n\nNo one can understand the attitude of our highlanders toward the rest of\nthe earth until he realizes their amazing isolation from all that lies\nbeyond the blue, hazy skyline of their mountains. Conceive a shipload of\nemigrants cast away on some unknown island, far from the regular track\nof vessels, and left there for five or six generations, unaided and\nuntroubled by the growth of civilization. Among the descendants of such\na company we would expect to find customs and ideas unaltered from the\ntime of their forefathers. And that is just what we do find to-day among\nour castaways in the sea of mountains. Time has lingered in Appalachia.\nThe mountain folk still live in the eighteenth century. The progress of\nmankind from that age to this is no heritage of theirs.\n\nOur backwoodsmen of the Blue Ridge and the Unakas, of their connecting\nchains, and of the outlying Cumberlands, are still thinking essentially\nthe same thoughts, still living in much the same fashion, as did their\nancestors in the days of Daniel Boone. Nor is this their fault. They are\na people of keen intelligence and strong initiative when they can see\nanything to win. But, as President Frost says, they have been\n\"beleaguered by nature.\" They are belated--ghettoed in the midst of a\ncivilization that is as aloof from them as if it existed only on another\nplanet. And so, in order to be fair and just with these, our backward\nkinsmen, we must, for the time, decivilize ourselves to the extent of\n_going back_ and getting an eighteenth century point of view.\n\nBut, first, how comes it that the mountain folk have been so long\ndetached from the life and movement of their times? Why are they so\nforeign to present-day Americanism that they innocently call all the\nrest of us fo"}, {"id": "gutenberg-50952", "title": "The Heart of the Alleghanies", "category": "Travel", "path": "texts/50952.txt", "type": "TEXT", "local": "content/texts/50952.txt", "content": "The Project Gutenberg eBook of The Heart of the Alleghanies; or, Western North Carolina\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: The Heart of the Alleghanies; or, Western North Carolina\n\nAuthor: Wilbur Gleason Zeigler\n        Ben S. Grosscup\n\n\n        \nRelease date: January 17, 2016 [eBook #50952]\n                Most recently updated: October 22, 2024\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/50952\n\nCredits: Produced by Jane Robins, Chuck Greif and the Online\n        Distributed Proof el--A Hermit\u2019s History--Above a Thunder\n Storm--Bakersville--Traces of a Prehistoric People--The Sink-Hole and\n Ray Mica Mines--Cremation--Drawing Rein.....237\n\n\n _BEYOND IRON WAYS._\n\n Stage Riding--The Driver\u2019s Story--Waynesville--Court\n Week--Prescriptions for Spirit. Frument.--Before the Bar--An Out-Door\n Jury Room--White Sulphur Springs--A Night\u2019s Entertainment--The\n Haunted Cabin--A Panther Hunt--The Phantom Millers--Light on\n the Mysteries--Micadale--Recollections--Soco Falls--Webster--An\n Artist\u2019s Trials--Above the Tuckasege Cataract--Hamburg--A Cordial\n Invitation--Cashier\u2019s Valley--Whiteside--A Coffee Toper--Horse\n Cove--Golden Sands--Ravenel\u2019s Magnificent Site--Hints for the Mounted\n Tourist--The Macon Highlands--A Demon of the Abyss--A Region of\n Cascades and Cataracts--Through Rabun Gap--Clayton, Georgia--The Falls\n of Tallulah--An Iron Way.....279\n\n\n _A ZIGZAG TOUR._\n\n The Mountains as a Summer Resort--On the Western North\n Carolina Railroad--Sparkling Catawba Springs--Glen\n Alpine--Marion--Asheville--Romantic Drives--Turnpike--Arden\n Park--Hendersonville--Flat Rock--The Ante-War Period--C\u00e6sar\u2019s\n Head--Brevard--A \u201cMoonshine\u201d Expedition--A Narrow Escape--How\n Illicit Whisky is Sold--Along the French Broad--An Excited\n Countryman--Marshal--Warm Springs--Shut-in Gap--Paint Rock--A Picture\n of the Sublime.....333\n\n Tables of Altitude, Population, Area of counties, and\n Temperature.....371\n\n\n\n\nILLUSTRATIONS.\n\n                                                                    PAGE.\n\n1. VALLEY OF THE NOON-DAY SUN                               Frontispiece.\n\n2. UNAKA KANOOS                                                       13\n\n3. A SOCO LASS                                                        37\n\n4. MOUNT PISGAH                                                       43\n\n5. THE FINAL STRUGGLE                                                 74\n\n6. THE WARRIOR BALD                                                   82\n\n7. A NARROW WATER-WAY                                                102\n\n8. A GLIMPSE OF THE TOE                                              119\n\n9. ON THE CATALUCHE                                                  128\n\n10. OCHLAWAHA VALLEY FROM DUN CRAGIN                                 135\n\n11. ON THE LITTLE TENNESSEE                                          145\n\n12. SILVER SPRINGS                                                   173\n\n13. THE FRENCH BROAD CANON                                           182\n\n14. SWANNANOA HOTEL                                                  211\n\n15. SPARKLING CATAWBA SPRINGS                                        235\n\n16. THE WATAUGA FALLS                                                266\n\n17. MACON HIGHLANDS                                                  293\n\n18. THE JUNALUSKAS                                                   316\n\n19. THE CULLASAJA FALLS                                              329\n\n20. UP THE BLUE RIDGE                                                338\n\n21. BOLD HEADLANDS                                                   354\n\n22. CASCADES OF SPRING CREEK                                         369\n\nDR. W. C. KERR\u2019S MAP OF WESTERN NORTH CAROLINA (used by permission of\nState Board of Agriculture).\n\n\n\n\nINTRODUCTION.\n\n    Oh, holy melody of peace!\n      Oh, nature in thy grandest mood!\n      I love thee most where ways are rude\n    Of men, and wild the landscape\u2019s face.\n\n\n[Illustration: The great mountain system that begins in that part of\nCanada south of the St. Lawrence, and under the name of the Alleghanies,\nor Appalachians, extends southward for 1,300 miles, dying out in the\nGeorgia and Alabama foot-hills, attains its culmination in North\nCarolina. The title of Appalachians, as applied by De Soto to the whole\nsystem, is preferred by many geographers. Alleghany is the old Indian\nword, signifying \u201cendless.\u201d It is ancient in its origin, and in spite of\nits being anglicized still retains its soft, liquid sound. It was not\nuntil a comparatively late year that Western North Carolina was\ndiscovered to be the culminating region. Until 1835 the mountains of New\nHampshire were considered the loftiest of the Alleghanies, and Mount\nWashington was placed on the maps and mentioned in text books as the\nhighest point of rock in the eastern United States. It now holds its\ntrue position below several summits of the Black, Smoky, and Balsam\nranges. From the barometrical measurements of trustworthy explorers, no\nless than 57 peaks in Western North Carolina are found to be over 6,000\nfeet in altitude. The more accurate observations being taken by means of\nlevels, by the coast survey, may slightly reduce this number.\n\nIt was John C. Calhoun who, in 1825, first called particular attention\nto the southern section of the system. His attention had been turned to\nit by observing the numerous wide rivers, and tributaries of noble\nstreams, which, like throbbing arteries, came forth from all sides of\nthe North Carolina mountains, as from the chambers of a mighty heart. He\nsaw the New river flowing towards the Ohio; the Watauga, the Nolechucky,\nthe French Broad, the Big Pigeon, the Little Tennessee, the Hiawassee,\nand their thousand tributaries, pouring from the central valleys through\nthe deep gaps of the Smokies into the western plains, and uniting with\nthe branches from the Cumberland mountains to form the stately\nTennessee; the Yadkin, the Catawba, the Broad, the Chatooga, and the\nheadwaters of the greatest streams south of Virginia that empty into the\nAtlantic. From these observations he reasoned rightly that between the\nparallels of 35 degrees and 36 degrees and 30 minutes, north latitude,\nlay the highest plateau and mountains of the Atlantic coast.\n\nThe region, as measured in a bee line through the center of the plateau\nfrom Virginia to Georgia, is 200 miles in length. Its breadth, from the\nsummits of the parallel rampart ranges of the Blue Ridge and Smokies,\nvaries from 15 to 65 miles, and includes within this measurement a\nplateau expanse of 6,000 square miles, with an altitude of from 2,000 to\n4,000 feet. Inclusive of the eastern slope, the off-shooting spurs of\nthe Blue Ridge and the South mountains, the average breadth is 70 miles.\nA portion of the piedmont section, properly a part of the mountain\ndistrict, would be taken in the latter measurement. The counties are 25\nin number, reaching from Ashe, Alleghany, and Surrey in the north to\nMacon, Clay, and Cherokee in the south.\n\nAfter the bifurcation of the Blue Ridge and Smoky mountains in Virginia,\nembracing with a wide sweep several counties of that state and Ashe,\nAlleghany, and Watauga of North Carolina, they almost meet again in the\nnortheastern limit of Mitchell county. Here, in collosal conjunction,\nthrough their central sentinel heads, the two ranges seem holding\nconference before making their final separation. The Grandfather, the\nhighest peak of the Blue Ridge and the oldest mountain of the world,\nstands on one side; the majestic Roan of the Smokies, on the other,\nconnected by the short transverse upheaval known as Yellow mountain.\nThis spot is poetically spoken of as the grand portal to the inner\ntemple of the Alleghanies; the Grandfather and the Roan being the two\npillars between which hangs, forever locked, the massive gate of Yellow\nmountain. The high table-land of Watauga forms the green-carpeted step\nto it. Trending southwest, between the two separating ranges,--the Blue\nRidge bending like a bow, and the Smokies resembling the\nbow-string,--lies wrapped in its robe of misty purple, the central\nvalley, comprising 13 counties.\n\nThe western rampart range, bearing the boundary line between North\nCarolina and Tennessee, lifts its crest much higher than the Blue Ridge;\nis more massive in its proportions; less straggling in its contour; but\nwith lower gaps or gorges, narrow and rugged, through which flow all the\nrivers of the plateau. Generically known as the Smoky mountains, it is\nby the river gorges divided into separate sections, each of which has\nits peculiar name. The most northerly of these sections is termed the\nStone mountains; then follow the Iron, Bald, Great Smoky, Unaka, and the\nFrog mountains of Georgia. Twenty-three peaks of the Smoky mountains are\nover 6,000 feet in altitude, the loftiest being Clingman\u2019s Dome, 6,660\nfeet. The deepest gap is that of the Little Tennessee, 1,114 feet.\n\nThe eastern ra"}, {"id": "gutenberg-48408", "title": "Letters from the Alleghany Mountains", "category": "Travel", "path": "texts/48408.txt", "type": "TEXT", "local": "content/texts/48408.txt", "content": "The Project Gutenberg eBook of Letters from the Alleghany Mountains\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Letters from the Alleghany Mountains\n\nAuthor: Charles Lanman\n\n\n        \nRelease date: March 5, 2015 [eBook #48408]\n                Most recently updated: October 24, 2024\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/48408\n\nCredits: Produced by Marcia Brooks, Stephen Hutcheson and the online\n        Distributed Proofreaders Canada team at\n        http://www.pgdpcanada.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK LETTERS FROM THE ALLEGHANY MOUNTAINS ***\n\n                                LETTERS\n                                  FROM\n                        THE ALLEGHANY MOUNTAINS.\n\n\n                                   BY\n                            CHARLES LANMAN,\nAUTHOR OF \u201cA TOUR TO THE RIVER SAGUENAY,\u201d \u201cA SUMMER IN THE WILDERNESS,\u201d\n                     AND \u201cESSAYS FOR SUMMER HOURS.\u201d\n\n\n                               NEW-YORK:\n                     GEO. P. PUTNAM, 155 BROADWAY.\n                                 1849.\n\n\n      Entered, according to Act of Congress, in the year 1849, by\n                            GEO. P. PUTNAM,\nIn the Clerk\u2019s Office of the District Court of the United States for the\n                     Southern District of New-York.\n\n\n                                   TO\n                          JOSEPH GALES, ESQ.,\n\nMr Dear Sir,\u2014\n\nI have two reasons for embellishing this little volume with your\ndistinguished and honored name. In the first place, the material of\nwhich it is composed, was originally published in the _National\nIntelligencer_; and in the second place, I desire to record the fact,\nthat for many years past, in all matters appertaining to my pen you have\nbeen to me an invaluable counsellor and friend.\n\n      In love and gratitude,\n          Very sincerely yours,\n              Charles Lanman.\n  Washington, D. C., August, 1849.\n\n\n\n\n                               CONTENTS.\n\n\n                               LETTER I.\n                                                                    PAGE\n                                                          Dahlonega,   9\n\n                                LETTER II.\n                                                 Trip to Track Rock,  20\n\n                               LETTER III.\n                                            Valley of the Nacoochee,  25\n\n                                LETTER IV.\n                                                 Cascade of Tuccoah,  31\n\n                                LETTER V.\n                                              The Falls of Tallulah,  36\n\n                                LETTER VI.\n                                             The Hunter of Tallulah,  47\n\n                               LETTER VII.\n                                                     Trail Mountain,  53\n\n                               LETTER VIII.\n                                                    Down the Owassa,  58\n\n                                LETTER IX.\n                                               Across the Mountains,  65\n\n                                LETTER X.\n                                      Notes on the Little Tennessee,  75\n\n                                LETTER XI.\n                                                 The Smoky Mountain,  84\n\n                               LETTER XII.\n                                          The Cherokees of Carolina,  93\n\n                               LETTER XIII.\n                                                   Cherokee Customs, 100\n\n                               LETTER XIV.\n                                                Cherokee Characters, 106\n\n                                LETTER XV.\n                                                    Hickory Nut Gap, 115\n\n                               LETTER XVI.\n                                              Down the French Broad, 122\n\n                               LETTER XVII.\n                                             Trip to Black Mountain, 131\n\n                              LETTER XVIII.\n                                                The Catawba Country, 139\n\n                               LETTER XIX.\n                                     The Mountains and their People, 151\n\n                                LETTER XX.\n                                                The Nameless Valley, 157\n\n                               LETTER XXI.\n                                             The Valley of Virginia, 166\n\n                                 ADDENDA.\n                                 Geology of the Alleghany Mountains, 173\n                                    Soil of the Alleghany Mountains, 182\n                                Minerals of the Alleghany Mountains, 186\n                   Miscellaneous Remarks on the Alleghany Mountains, 192\n\n\n\n\n                 LETTERS FROM THE ALLEGHANY MOUNTAINS.\n\n\n\n\n                               LETTER I.\n\n\n                                    Dahlonega, Georgia, April, 1848.\n\nThe Cherokee word Dah-lon-e-ga signifies _the place of yellow\nmetal_; and is now applied to a small hamlet at the foot of the\nAlleghany Mountains, in Lumpkin county, Georgia, which is reputed to\nbe the wealthiest gold region in the United States. It is recorded\nof De Soto and his followers that, in the sixteenth century, they\nexplored this entire Southern country in search of gold, and\nunquestionable evidences of their work have been discovered in\nvarious sections of the State. Among these testimonials may be\nmentioned the remains of an old furnace, and other works for mining,\nwhich have been brought to light by recent explorations. But the\nattention of our own people was first directed to this region while\nyet the Cherokees were in possession of the land, though the digging\nof gold was not made a regular business until after they had been\npolitely banished by the General Government. As soon as the State of\nGeorgia had become the rightful possessor of the soil (according to\n_law_), much contention and excitement arose among the people as to\nwho should have the best opportunities for making fortunes; and, to\nsettle all difficulties, it was decided by the State Legislature\nthat the country should be surveyed and divided into lots of forty\nand one hundred and sixty acres, and distributed to the people by\nlottery. For several years subsequent to that period, deeds of wrong\nand outrage were practised to a very great extent by profligate\nadventurers who flocked to this El Dorado. In the year 1838,\nhowever, the Government established a branch Mint at this place,\nsince which time a much better state of things has existed in\nDahlonega.\n\nThe appearance of this village, though not more than a dozen years\nold, is somewhat antiquated, owing to the fact that the houses are\nchiefly built of logs, and, having never been painted, are\nparticularly dark and dingy, but uncommonly picturesque in form and\nlocation. The population of the place is about five hundred. It is\nlocated upon a hill, and though the country around is quite uneven,\nhaving been deeply ravined by atmospheric agents, when viewed in\nconnection with the mountains, (some ten or fifteen miles off,)\nwhich seem to hem it on three sides, presents the appearance of a\npit to a magnificent amphitheatre. On approaching Dahlonega I\nnoticed that the water-courses had all been mutilated with the spade\nand pickaxe, and that their waters were of a deep yellow; and having\nexplored the country since then, I find that such is the condition\nof all the streams within a circuit of many miles. Large brooks (and\neven an occasional river) have been turned into a new channel, and\nthereby deprived of their original beauty. And of all the hills in\nthe vicinity of Dahlonega which I have visited, I have not yet seen\none which is not actually riddled with shafts and tunnels. The soil\nis of a primitive character, quite yellowish in color, composed of\nsand and clay, and uncommonly easy to excavate with the spade.\nHeretofore the gold ore of Lumpkin county has been obtained from\nwhat is called the deposit beds, but the miners are now beginning to\ndirect their attention to the veined ore, which is supposed to be\nvery abundant in all directions. It is generally found in quartz and\na species of slate stone. The gold region of Georgia, strictly\nspeaking, is confined to a broad belt, which runs in a northeastern\nand southwestern direction from Dahlonega, which may be considered\nits centre. Several auriferous veins traverse the town, and it is\ncommon after a rain to see the inhabitants busily engaged in\n_hunting_ for gold in the streets. That huge quantities are thus\naccumulated in _these_ days I am not ready to believe, whatever may\nhave been done in former years. I know not that any very remarkable\nspecimens of gold ore have been found in the immediate vicinity of\nDahlonega, but an idea of the wealth of the State in this particular\nmay be gathered from the fact, that several lumps have heretofore\nbeen found in different sections, which were worth from five hundred\nto one thousand dollars. More valuable specimens have been found in\nNorth Carolina; but while Virginia, the Carolinas, and Alabama have\nall produced a goodly amount of gold, I have heard it conceded that\nGeorgia has produced the largest quantity and decidedly the best\nquality.\n\nAnd now with regard to the fortunes that have been made in this\nregion. They are very few and far between. But, by way of\nillustration, I will give two or three incidents which have come to\nmy knowledge. In passing, however, I may repeat the remark made to\nme by an intelligent gentleman, that the expenses of digging out the\ngold in this section of country have ever exceeded the gain by about\none hundred per cent. Immense amounts of labor as well as money have\nbeen expended, and, generally speaking, the condition of the people\nhas not been improved; the very wealth of the country has caused the\nruin of many individuals. The following story is a matter of popular\nhistory. After the State Legislature had divided the Cherokee\nPurchase into lots and regularly numbered them, it was rumored about\nthe country that lot No. 1052 was a great prize, and every body was\non tiptoe with regard to its distribution by the proposed lottery.\nAt that time 1052 _figured_ in the dreams of every Georgian, and\nthose figures were then far more _popular_ than the figures 54 40\nhave been in these latter days. Among the more crazy individuals who\nattended the lottery was one Mosely, who had determined either to\ndraw the much talked of prize _or purchase it of the winner_, even\nthough it should be at the cost of his entire property, which was\nquite large. The drawing took place, and 1052 came into the\npossession of a poor farmer named Ellison. Mosely immediately\nmounted his horse and hastened to Ellison\u2019s farm, where he found the\nchild of fortune following his plough. The would-be purchaser made\nknown the object of his visit, and Ellison only laughed at the\nimpetuosity of his impatient friend. Ellison said he was not anxious\nto sell the lot, but if Mosely _must_ have it, he _might_ have it\nfor $30,000. Mosely acceded to the terms, and in paying for the lot\nsacrificed most of his landed and personal property. The little\nproperty which was left him he was compelled to employ in working\nhis mines; he labored with great diligence for several years, but he\ncould never make both ends meet, for his mines were not at all\ndistinguished for their richness. In process of time he was\ncompelled to sell 1052 for what it would bring, and having\nsquandered that remnant of his former wealth, he left the country\nfor parts unknown, a veritable beggar. But, what is more singular\nthan all, the present proprietor of 1052 is that identical man\nEllison, who is annually realizing a handsome sum of money from the\nnewly-discovered gold ore found in the bowels of his lottery lot.\n\nAnother instance of good fortune, unattended with any _alloy_, is as\nfollows: Five years ago a couple of brothers, who were at work upon\nthe Georgia railroad, took it into their heads to visit Dahlonega\nand try their luck in the mining business. They were hardworking\nIrishmen, and understood the science of digging to perfection. They\nleased one or two lots in this vicinity, and are now reputed to be\nworth $15,000.\n\nAnd now that it has come into my mind, I will mention another\n_lottery_ anecdote, which was related to me by an old resident. By\nway of introduction, however, I ought here to mention that this\nregion is famous for the number and size of its rattlesnakes, and\nthat our hero had an utter abhorrence of the reptile. Among those\nwho obtained prizes at the great drawing, before alluded to, was an\nindividual from the southern part of the State, who drew a lot in\nthis vicinity. In process of time he came to the north to explore\nhis property, and had called at the house of a farmer near his land,\nfor the purpose of obtaining a guide. In conversing with the farmer,\nhe took occasion to express his dislike to the rattlesnake;\nwhereupon the farmer concluded that he would attempt a speculation.\nRemembering that in going to the stranger\u2019s land he might (if he\nchose to do so) pass through an out-of-the-way ravine which abounded\nin the dreaded snake, the farmer beckoned to the stranger, and they\ntook their way towards the ravine. After they had arrived at the\nspot, hardly a rod did the pedestrians pass without hearing the hiss\nof a snake or seeing its fiery tongue, and the stranger was as\ncompletely frightened as any one could possibly be by a similar\ncause. In his despair he turned to his companion and said:\n\n\u201cAre snakes as plenty as this _all_ over the country?\u201d\n\n\u201cI can\u2019t say about that, stranger, but one of my neighbors killed\nabout a hundred last year, and I\u2019ve hearn tell that your land is\nvery rich in snakes.\u201d\n\n\u201cNow I ain\u2019t a going any further in this infernal region, and I want\nto know if you have a horse that you\u2019ll give me for my land\u2014gold\nore, snakes, and all.\u201d\n\n\u201cI have, and a first-rate horse too.\u201d\n\n\u201cIt\u2019s a bargain.\u201d\n\nOn the following morning, the stranger, like the hero of a novel,\nmight be seen mounted on a Dahlonega steed, pursuing his devious\npathway along a lonely road towards the south pole.\n\nOf the uncounted gold mines which are found in this region, the most\nfruitful at the present times lies about twenty-five miles from\nhere, in a northerly direction, and is the property of Mr. Lorenzo\nDow Smith. And the success which has ever attended Lorenzo is worth\nrecording. In a conversation that I had with him in this place,\nwhe"}, {"id": "gutenberg-60246", "title": "Gatlinburg and the Great Smokies", "category": "History", "path": "texts/60246.txt", "type": "TEXT", "local": "content/texts/60246.txt", "content": "The Project Gutenberg eBook of Gatlinburg and the Great Smokies\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Gatlinburg and the Great Smokies\n\nAuthor: Ernie Pyle\n\n\n        \nRelease date: September 6, 2019 [eBook #60246]\n                Most recently updated: October 17, 2024\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/60246\n\nCredits: Produced by Stephen Hutcheson, Lisa Corcoran and the Online\n        Distributed Proofreading Team at http://www.pgdp.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK GATLINBURG AND THE GREAT SMOKIES ***\n\n                               GATLINBURG\n                                 _And_\n                           THE GREAT SMOKIES\n                                  _By\n                              Ernie Pyle_\n\n\n                              _Ernie Pyle_\n                       ONE OF HIS FAVORITE PHOTOS\n\n                           PRICE\u2014FIFTY CENTS\n\n                      Printed In The Great Smokies\n                           THE MOUNTAIN PRESS\n                         Gatlinburg, Tennessee\n\n\n\n\n                               _Foreword_\n\n\nIn the Fall of 1940, Ernie Pyle and \u201cthat girl\u201d who rode with him (his\nwife, \u201cJerry\u201d) came to Gatlinburg and Ernie wrote eleven columns for the\nScripps-Howard Newspapers about the village of Gatlinburg, the native\npeople and a trip he took to LeConte.\n\nWith permission of the Scripps-Howard Newspaper Alliance and Wm. Sloane\nAssociates Inc., Publishers, these columns are reproduced in this little\nbooklet.\n\nThey are good reading\u2014by one of the truly great writers of our time.\nThey are about things close to the heart of all who love the Smokies.\nThey are simple (as is all great writing) sincere and touched by a\nquaint and whimsical humor.\n\nI wish to thank Loye W. Miller, Editor of the Knoxville (Tennessee)\nNews-Sentinel, and Bert Vincent, Strolling Reporter, for their kind help\nand cooperation in re-printing these columns.\n\n  _C.C. Callaway_\n  Gatlinburg, Tenn.\u20141951\n  All Rights Reserved\n\n\n\n\n                   GATLINBURG, Tenn., Oct. 24, 1940\u2014\n\n\nFor four years I\u2019ve been trying to get to the Great Smoky Mountains\nNational Park and to write some masterful columns about the astounding\nmanner in which Nature splattered her contours and evolutions over this\npart of the globe.\n\nBut I monkeyed around and monkeyed around, and the first thing I knew\nhere was President Roosevelt down here dedicating the thing, and\nstealing all my glory.\n\nBut I just figured, well, the mountains are still here and the words are\nstill in the dictionary, so I might as well come on anyway and compose a\nlittle deathless literature on the Smokies, even if Mr. Roosevelt did\nbeat me to the draw.\n\nSo here we are in Gatlinburg, the north entrance to the great park.\nGatlinburg once consisted of five families. But today, thanks to tourist\nmoney, it is an amazingly charming little city, oozing with handicraft\nshops and tasteful inns and lovely stone houses and saddle horses and\npretty girls in jodhpurs.\n\nGatlinburg lies in a cup, and low wooded mountains rise on every side,\nand a little river runs behind the town, and the main street goes a\nlittle uphill and around a couple of bends, and it is all just like\nyou\u2019d want a mountain resort to be.\n\nRight now is the peak of the fall color season, and the mountains are\naflame with red and yellow and green, and anybody who can see them\nwithout some kind of a gladness at being alive must be a dull soul\nindeed.\n\n\n                             PASSED BY TIME\n\nCenturies ago, white pioneers from England and Scotland came into these\nmountains and set up their homes. They were so isolated that our\nso-called progress largely passed them by.\n\nThey grew up to be a little race distinct. There is no denying that a\nmountain man is different from a plains or city man. I can\u2019t exactly\ntell you the difference, but there is something basically rugged in his\ncharacter that would be nice to have within yourself.\n\nThere are old men in these mountains who would feel embarrassed and\nnaked if the long rifle did not rest on its nails in the wall. You can\nwalk into the hills right behind Gatlinburg and still hear even the\nchildren saying \u201chit\u201d for \u201cit,\u201d and \u201cheerd\u201d for \u201cheard.\u201d\n\nYou can still find leather tanning in the homes, and weaving and\nspinning, and people who make their own furniture, and think it a sin to\ntend garden on Sundays.\n\nIt was to preserve a little of this for posterity, and also to open up\nthe magnificent scenery of the Smokies to the great taxpaying public,\nthat the Great Smokies National Park was created.\n\nIt started in 1923, when the states of Tennessee and North Carolina\nbegan buying mountain land from the big timber companies. John D.\nRockefeller Jr. played an important part. He matched, dollar for dollar,\nevery cent put up by the two states.\n\nIn 1926, Congress authorized the establishment of a Park. The land\nalready bought was turned over to the Federal Government, and the\nGovernment itself bought more.\n\nThe National Park Service actually moved in and took charge about 10\nyears ago. Today the park is well up among the older western parks in\nthe facilities it has created for the public, such as roads, camp\ngrounds, hiking and horse trails. As far as I can see, every thing has\nbeen tastefully done. You have a feeling that the park is \u201cright.\u201d\n\nThis year visitors to the park will run more than 800,000. It is open\nall year, but summer and fall are the big seasons. In June, July and\nAugust you can\u2019t even find a place to sleep in Gatlinburg if you arrive\nlate.\n\n\n                           PARK IS OVAL SHAPE\n\nThe Great Smokies Park is roughly 54 miles long and 19 miles wide at the\nwidest point. It is oval shaped. Except for a few high, level pastures,\nit is tremendously rugged throughout its entirety. It has 16 peaks more\nthan 6000 feet high.\n\nVegetation is lush, clear to the top of the highest peak. There is no\ntimberline in these mountains. Balsam and spruce grow thick in the upper\nregions. In summer the rainfall is almost tropical, and in winter heavy\nsnows blanket the trees and slopes into a fairyland.\n\nAlmost constantly a gray haze hangs like a thin veil over the pile after\npile of far, high, ridges. That is why these mountains are called The\nSmokies. They say that no one knows for sure what causes this haze, but\none explanation credits it to tiny particles of moisture rising from the\nheavily-soaked vegetation.\n\nThe park is half in Tennessee and half in North Carolina. The high,\nsharp backbone of the Smokies cuts the park in two, and along this\nbackbone runs the state line. A horse trail follows this backbone the\nlength of the Park, but there is no motor road up there.\n\nA fine macadam highway crosses the Park, from Gatlinburg to Cherokee, on\nthe Carolina side. And a few gravel roads stab short distances into the\nhills from several entrances.\n\nAside from that, the public must take to foot or horseback to see the\nvast, beckoning interior of the Park. And since taking to foot is one of\nlife\u2019s accomplishments which I am most prodigious at, to coin a phrase,\nwe shall take to foot in a Herculean way about tomorrow.\n\n\n\n\n         MT. LE CONTE LODGE, Great Smokies Park, Oct. 25, 1940\u2014\n\n\nWhen I go to see a National Park, I like to walk in it.\n\nI don\u2019t want to mope along with a tourist party behind a naturalist, and\nI don\u2019t want to ride no damned horse. I just want to get out all by\nmyself like a hermit and square off my shoulders and head uphill.\n\nThere is plenty of walking for a fellow like me in the Great Smokies. In\nfact there are 675 miles of trails that meander all over this vast park.\n\nBut the main trails patronized by tourists are the five different routes\nwhich lead up to the top of Mt. Le Conte, nearly 6600 feet high. Many\npeople make it up and back in one day. But others, like myself add 95\nper cent to the pleasure by staying on top all night.\n\nPeople had told me the Alum Cave trail was the prettiest and most\nspectacular. So, the day before starting, I went over to Park\nHeadquarters to inquire and get my bearings.\n\nI wound up talking to Assistant Chief Ranger Harold Edwards. He wears a\nuniform and has a desk and lots of papers on it, so I believed every\nword he said.\n\nHe said it would take me five hours to climb the Alum Cave trail. He\nsaid it would be the longest five and a half miles I ever walked. He\nsaid it was very steep, and footing irregular.\n\nWell, it is possible I misunderstood Ranger Edwards, but I doubt it.\nAlso it is possible that I\u2019m a better man than I thought. But that seems\nsomewhat fantastic, since I think I\u2019m practically perfect to start with.\nSo I can only deduce that Ranger Edwards, in spite of being a nice\nfellow, simply has days when he isn\u2019t all there.\n\nFor, instead of five hours, I was on top of Mt. Le Conte in two hours\nand 50 minutes. And since I had prepared myself for a terrible ordeal,\nit seemed like the shortest five and a half miles I ever walked. It was,\nin fact, smooth and nice all the way up.\n\nPoor Mr. Edwards. I guess he meant well, but he just didn\u2019t realize he\nwas talking with one of the mountain-climbingest goats this side of\nTibet.\n\n\n                             BACK TO SLEEP\n\nIn preparation for this historic stroll I awoke at 7 a.m., yawned a\ncouple of times, and went back to sleep for half an hour. Then I ate\nbreakfast, read the morning paper, got those old gray pants out of the\nback of the car and, as a final gesture, put them on.\n\nAlso I filled up the little chamois pack sack which That Girl made for\nmy gallant walk through the Rockies last year from the United States to\nCanada.\n\nIn this pack sack I put an extra sweater, four hankerchiefs (because I\nstill have a cold), an extra pair of socks, two Hershey bars, two\noranges, an old ham sandwich, and an extra pack of cigarettes, in case\nmy wind gave out.\n\nI did not take my sun glasses, nor a camera, nor a bottle of water, nor\na ten-pound toilet kit, nor my new tuxedo, since past experience as an\nAlpinist has shown that such things are all a lot of nonsense.\n\nIt was 9:20 a.m. when I stepped out of Ranger Edwards\u2019 car, shook hands,\nand, without once looking back, plunged into the jungle. Exciting\nexperiences were not long in coming.\n\nI hadn\u2019t gone 200 yards when I came upon two couples standing in the\ntrail, talking. They didn\u2019t see me coming, so I had to walk around them.\nAs I did so one woman said, \u201cOh excuse me,\u201d and I said, \u201cThat\u2019s all\nright.\u201d\n\nFifty yards farther on I came upon a man with a cane, sitting against a\ntree. He said, \u201cAre those people still gabbing back there?\u201d and I said,\n\u201cYes,\u201d and he said, \u201cI thought so.\u201d\n\nWhen I had been walkin
