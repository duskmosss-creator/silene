g an hour and a half, I met two young men coming\ndown the trail like rockets. We stopped and smoked a cigarette together.\nThey had walked clear to the top already this morning, and were well on\ntheir way back down, and it was now only 10:45. It was then I began to\nsmell a mouse in Mr. Edwards\u2019 sinister warnings about the trail.\n\n\u201cHow far along am I?\u201d I asked. It was my impression I was barely getting\nstarted.\n\n\u201cOh, you\u2019re half way there,\u201d they said.\n\n\u201cAnd the trail ahead, how is it?\u201d I asked.\n\n\u201cNo steeper than you\u2019ve come over,\u201d they said. By that time Mr. Edwards\u2019\nmouse smelled real bad. But I was glad, too, for if there\u2019s one thing I\nlike about a mountain trail it\u2019s for there not to be much more of it. I\nlunged on, and disappeared around a bend.\n\n\n                          DISTANCES DECEPTIVE\n\nAt 12 o\u2019clock sharp, I came around another bend and there ahead, across\na valley stood a sharp precipice. They had told me that right behind\nthis precipice lay the Le Conte Lodge.\n\nI stood a minute, and tried to judge how long it would take to get\nthere. Distances in the mountains are very deceptive. Out West you can\nsee a long way, hence an actual distance is much farther than it looks.\nI remember once, in the high Rockies, figuring it would take an hour to\nget to a certain ridge, but it actually took three hours.\n\nSo with this in mind, I estimated one hour to get to this precipice. And\nshiver these old timbers, if I wasn\u2019t there in 10 minutes. The climb was\nover, and I hadn\u2019t even eaten my sandwich.\n\nJust as I topped the ridge, I turned around in the direction of Park\nHeadquarters, and looked far down toward where Ranger Edwards was\nprobably nestling behind his desk, and I puckered up my mouth and said,\n\u201cFive hours Pvvvvvvtt.\u201d\n\n                            * * * * * * * *\n\nP. S.\u2014And now that I\u2019ve used up this whole column bragging on myself, I\nsuppose I\u2019ll have to get to work tomorrow and tell you what I saw on the\ntrip. Hope I can think of something good.\n\n\n\n\n         MT. LE CONTE LODGE, Great Smokies Park, Oct. 26, 1940\u2014\n\n\nThis Le Conte Lodge, they say, is the highest mountain lodge east of the\nRockies. It stands at 6400 feet. With one exception, it is the only\nplace within the boundaries of the Great Smokies National Park where you\ncan stay all night. And the only way to get up here is to walk or ride a\nhorse.\n\nThe Lodge is open about seven months of the year. In winter it gets to\n40 below up here, and the buildings lie deep in snow. The hottest they\nremember it being in summertime is 68, and the people who work here get\nso used to cool summers that they almost die when they go down to the\nvalley heat of Gatlinburg, a mile below.\n\nThe lodge can put up 44 people. They charge $4 a day for room and two\nmeals. In the three mid-summer months the place is full every night. But\nright now there aren\u2019t so many. Unless somebody shows up late, I will be\nthe lone guest tonight.\n\nIn the old days up here, all the beds were of balsam boughs. City\nfellers who walked up the mountain could go back home and tell of\nsleeping on a bed of brush and limbs.\n\nBut now this is a National Park, and you can\u2019t even cut a twig from a\ntree. So visitors have to be content with nice modern mattresses and\nHudson\u2019s Bay blankets.\n\nSome amazing people have walked into Le Conte Lodge. One 94-year-old man\nclimbed the mountain on foot. An 83-year-old woman came up under her own\nsteam. And another man past 80 walked up alone, got caught by darkness\nwithin 200 yards of the Lodge but didn\u2019t know where he was, so lay down\non the ground and slept all night. He walked on in after daylight,\nfeeling fine.\n\n\n                            BEARS DON\u2019T HIDE\n\nBut let me tell you about my walk up the mountain. On the Alum Cave\ntrail, by which I came, there is no place where you walk along an actual\nprecipice that drops off straight down for thousands of feet. But I can\nsay that if you are up here, and should suddenly find yourself in\ndesperate need of a pr"}, {"id": "gutenberg-3126", "title": "On Horseback", "category": "Travel", "path": "texts/3126.txt", "type": "TEXT", "local": "content/texts/3126.txt", "content": "The Project Gutenberg eBook of On Horseback\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: On Horseback\n\nAuthor: Charles Dudley Warner\n\n\n        \nRelease date: October 10, 2004 [eBook #3126]\n                Most recently updated: January 8, 2021\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/3126\n\nCredits: Produced by David Widger\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK ON HORSEBACK ***\n\n\n\nProduced by David Widger\n\n\n\n\n\nON HORSEBACK\n\nBy Charles Dudley Warner\n\n\n\n\nI\n\n\u201cThe way to mount a horse\u201d--said the Professor.\n\n\u201cIf you have no ladder--put in the Friend of Humanity.\u201d\n\nThe Professor had ridden through the war for the Union on the right\nside, enjoying a much better view of it than if he had walked, and knew\nas much about a horse as a person ought to know for the sake of his\ncharacter. The man who can recite the tales of the Canterbury Pilgrims,\non horseback, giving the contemporary pronunciation, never missing an\naccent by reason of the trot, and at the same time witch North Carolina\nand a strip of East Tennessee with his noble horsemanship, is a kind of\nLiterary Centaur of whose double instruction any Friend of Humanity may\nbe glad to avail himself.\n\n\u201cThe way to mount a horse is to grasp the mane with the left hand\nholding the bridle-rein, put your left foot in the stirrup, with the\nright hand on the back of the saddle, and---\u201d\n\nJust then the horse stepped quickly around on his hind feet, and looked\nthe Professor in the face. The Superintendents of Affairs, who occupy\nthe flagging in front of the hotel, seated in cane-bottomed chairs\ntilted back, smiled. These useful persons appear to have a life-lease\nof this portion of the city pavement, and pretty effectually block it up\nnearly all day and evening. When a lady wishes to make her way through\nthe blockade, it is the habit of these observers of life to rise and\nmake room, touching their hats, while she picks her way through, and\ngoes down the street with a pretty consciousness of the flutter she\nhas caused. The war has not changed the Southern habit of sitting\nout-of-doors, but has added a new element of street picturesqueness in\ngroups of colored people lounging about the corners. There appears to be\nmore leisure than ever.\n\nThe scene of this little lesson in horsemanship was the old town of\nAbingdon, in southwest Virginia, on the Virginia and East Tennessee\nrailway; a town of ancient respectability, which gave birth to the\nJohnstons and Floyds and other notable people; a town, that still\npreserves the flavor of excellent tobacco and, something of the\neasy-going habits of the days of slavery, and is a sort of educational\ncenter, where the young ladies of the region add the final graces of\nintellectual life in moral philosophy and the use of the globes to their\nnatural gifts. The mansion of the late and left Floyd is now a seminary,\nand not far from it is the Stonewall Jackson Institute, in the midst\nof a grove of splendid oaks, whose stately boles and wide-spreading\nbranches give a dignity to educational life. The distinction of the\nregion is its superb oak-trees. As it was vacation in these institutions\nof learning, the travelers did not see any of the vines that\ntraditionally cling to the oak.\n\nThe Professor and the Friend of Humanity were about starting on a\njourney, across country southward, through regions about which the\npeople of Abingdon could give little useful information. If the\ntravelers had known the capacities and resources of the country, they\nwould not have started without a supply train, or the establishment\nof bases of provisions in advance. But, as the Professor remarked,\nknowledge is something that one acquires when he has no use for it. The\nhorses were saddled; the riders were equipped with flannel shirts and\nleather leggings; the saddle-bags were stuffed with clean linen, and\nnovels, and sonnets of Shakespeare, and other baggage, it would have\nbeen well if they had been stuffed with hard-tack, for in real life meat\nis more than raiment.\n\nThe hotel, in front of which there is cultivated so much of what the\nGermans call sitzfleisch, is a fair type of the majority of Southern\nhotels, and differs from the same class in the North in being left a\nlittle more to run itself. The only information we obtained about it was\nfrom its porter at the station, who replied to the question, \u201cIs it\nthe best?\u201d \u201cWe warrant you perfect satisfaction in every respect.\u201d\n This seems to be only a formula of expression, for we found that\nthe statement was highly colored. It was left to our imagination to\nconjecture how the big chambers of the old house, with their gaping\nfireplaces, might have looked when furnished and filled with gay\ncompany, and we got what satisfaction we could out of a bygone bustle\nand mint-julep hilarity. In our struggles with the porter to obtain the\nlittle items of soap, water, and towels, we were convinced that we had\narrived too late, and that for perfect satisfaction we should have been\nhere before the war. It was not always as now. In colonial days the\naccommodations and prices at inns were regulated by law. In the old\nrecords in the court-house we read that if we had been here in 1777, we\ncould have had a gallon of good rum for sixteen shillings; a quart bowl\nof rum toddy made with loaf sugar for two shillings, or with brown sugar\nfor one shilling and sixpence. In 1779 prices had risen. Good rum sold\nfor four pounds a gallon. It was ordered that a warm dinner should cost\ntwelve shillings, a cold dinner nine shillings, and a good breakfast\ntwelve shillings. But the item that pleased us most, and made us regret\nour late advent, was that for two shillings we could have had a \u201cgood\nlodging, with clean sheets.\u201d The colonists were fastidious people.\n\nAbingdon, prettily situated on rolling hills, and a couple of thousand\nfeet above the sea, with views of mountain peaks to the south, is a\ncheerful and not too exciting place for a brief sojourn, and hospitable\nand helpful to the stranger. We had dined--so much, at least, the public\nwould expect of us--with a descendant of Pocahontas; we had assisted on\nSunday morning at the dedication of a new brick Methodist church, the\nfinest edifice in the region--a dedication that took a long time, since\nthe bishop would not proceed with it until money enough was raised in\nopen meeting to pay the balance due on it: a religious act, though it\ndid give a business aspect to the place at the time; and we had been the\nlight spots in the evening service at the most aristocratic church of\ncolor. The irresponsibility of this amiable race was exhibited in the\ntardiness with which they assembled: at the appointed time nobody was\nthere except the sexton; it was three quarters of an hour before the\ncongregation began to saunter in, and the sermon was nearly over before\nthe pews were at all filled. Perhaps the sermon was not new, but it was\nfervid, and at times the able preacher roared so that articulate sounds\nwere lost in the general effect. It was precisely these passages of\ncataracts of sound and hard breathing which excited the liveliest\nresponses,--\u201cYes, Lord,\u201d and \u201cGlory to God.\u201d Most of these responses\ncame from the \u201cAmen corner.\u201d The sermon contained the usual vivid\ndescription of the last judgment--ah, and I fancied that the\ncongregation did not get the ordinary satisfaction out of it. Fashion\nhad entered the fold, and the singing was mostly executed by a choir in\nthe dusky gallery, who thinly and harshly warbled the emotional hymns.\nIt occupied the minister a long time to give out the notices of the\nweek, and there was not an evening or afternoon that had not its\nmeetings, its literary or social gathering, its picnic or fair for the\nbenefit of the church, its Dorcas society, or some occasion of religious\nsociability. The raising of funds appeared to be the burden on the\npreacher's mind. Two collections were taken up. At the first, the boxes\nappeared to get no supply except from the two white trash present. But\nthe second was more successful. After the sermon was over, an elder\ntook his place at a table within the rails, and the real business of the\nevening began. Somebody in the Amen corner struck up a tune that had\nno end, but a mighty power of setting the congregation in motion. The\nleader had a voice like the pleasant droning of a bag-pipe, and the\nfaculty of emitting a continuous note like that instrument, without\nstopping to breathe. It went on and on like a Bach fugue, winding and\nwhining its way, turning the corners of the lines of the catch without a\nbreak. The effect was soon visible in the emotional crowd: feet began\nto move in a regular cadence and voices to join in, with spurts of\nejaculation; and soon, with an air of martyrdom, the members began\nto leave their seats and pass before the table and deposit their\ncontributions. It was a cent contribution, and we found it very\ndifficult, under the contagious influence of the hum from the Amen\ncorner, not to rise and go forward and deposit a cent. If anything could\nextract the pennies from a reluctant worldling, it would be the buzzing\nof this tune. It went on and on, until the house appeared to be drained\ndry of its cash; and we inferred by the stopping of the melody that\nthe preacher's salary was secure for the time being. On inquiring,\nwe ascertained that the pecuniary flood that evening had risen to the\nheight of a dollar and sixty cents.\n\nAll was ready for the start. It should have been early in the morning,\nbut it was not; for Virginia is not only one of the blessed regions\nwhere one can get a late breakfast, but where it is almost impossible to\nget an early one. At ten A. M. the two horsemen rode away out of sight\nof the Abingdon spectators, down the eastern turnpike. The day was warm,\nbut the air was full of vitality and the spirit of adventure. It was\nthe 22d of July. The horses were not ambitious, but went on at an easy\nfox-trot that permits observation and encourages conversation. It\nhad been stipulated that the horses should be good walkers, the one\nessential thing in a horseback journey. Few horses, even in a country\nwhere riding is general, are trained to walk fast. We hear much of\nhorses that can walk five miles an hour, but they are as rare as white\nelephants. Our horses were only fair walkers. We realized how necessary\nthis accomplishment is, for between the Tennessee line and Asheville,\nNorth Carolina, there is scarcely a mile of trotting-ground.\n\nWe soon turned southward and descended into the Holston River Valley.\nBeyond lay the Tennessee hills and conspicuous White-Top Mountain (5530\nfeet), which has a good deal of local celebrity (standing where the\nStates of Virginia, Tennessee, and North Carolina corner), and had been\npointed out to us at Abingdon. We had been urged, personally and\nby letter, to ascend this mountain, without fail. People recommend\nmountains to their friends as they do patent medicines. As we leisurely\njogged along we discussed this, and endeavored to arrive at some rule of\nconduct for the journey. The Professor expressed at once a feeling about\nmountain-climbing that amounted to hostility,--he would go nowhere that\nhe could not ride. Climbing was the most unsatisfactory use to which a\nmountain could be put. As to White-Top, it was a small mountain, and\nnot worth ascending. The Friend of Humanity, who believes in\nmountain-climbing as a theory, and for other people, and knows the value\nof being able to say, without detection, that he has ascended any high\nmountain about which he is questioned,--since this question is the first\none asked about an exploration in a new country,--saw that he should\nhave to use a good deal of diplomacy to get the Professor over any\nconsiderable elevation on the trip. And he had to confess also that a\nview from a mountain is never so satisfactory as a view of a mountain,\nfrom a moderate height. The Professor, however, did not argue the matter\non any such reasonable ground, but took his stand on his right as a\nman not to ascend a mountain. With this appeal to first principles,--a\nposition that could not be confuted on account of its vagueness\n(although it might probably be demonstrated that in society man has no\nsuch right), there was no way of agreement except by a compromise. It\nwas accordingly agreed that no mountain under six thousand feet is worth\nascending; that disposed of White-Top. It was further agreed that any\nmountain that is over six thousand feet high is too high to ascend on\nfoot.\n\nWith this amicable adjustment we forded the Holston, crossing it twice\nwithin a few miles. This upper branch of the Tennessee is a noble\nstream, broad, with a rocky bed and a swift current. Fording it is\nticklish business except at comparatively low water, and as it\nis subject to sudden rises, there must be times when it seriously\ninterrupts travel. This whole region, full of swift streams, is without\na bridge, and, as a consequence, getting over rivers and brooks and\nthe dangers of ferries occupy a prominent place in the thoughts of\nthe inhabitants. The life necessarily had the \u201cfrontier\u201d quality all\nthrough, for there can be little solid advance in civilization in the\nuncertainties of a bridgeless condition. An open, pleasant valley, the\nHolston, but cultivation is more and more negligent and houses are few\nand poorer as we advance.\n\nWe had left behind the hotels of \u201cperfect satisfaction,\u201d and expected\nto live on the country, trusting to the infrequent but remunerated\nhospitality of the widely scattered inhabitants. We were to dine at\nRamsey's. Ramsey's had been recommended to us as a royal place of\nentertainment the best in all that region; and as the sun grew hot in\nthe sandy valley, and the weariness of noon fell upon us, we magnified\nRamsey's in our imagination,--the nobility of its situation, its\ncuisine, its inviting restfulness,--and half decided to pass the night\nthere in the true abandon of plantation life. Long before we reached\nit, the Holston River which we followed had become the Laurel, a most\nlovely, rocky, winding stream, which we forded continually, for the\nvalley became too narrow much of the way to accommodate a road and\na river. Eagerly as we were looking out for it, we passed the great\nRamsey's without knowing it, for it was the first of a little settlement\nof two houses and a saw-mill and barn. It was a neat log house of two\nlower rooms and a summer kitchen, quite the best of the class that we\nsaw, and the pleasant mistress of it made us welcome. Across the road\nand close, to the Laurel was the spring-house, the invariable adjunct\nto every we"}, {"id": "gutenberg-59522", "title": "Biltmore House and Gardens", "category": "History", "path": "texts/59522.txt", "type": "TEXT", "local": "content/texts/59522.txt", "content": "The Project Gutenberg eBook of Biltmore House and Gardens\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Biltmore House and Gardens\n\nAuthor: Anonymous\n\n\n        \nRelease date: May 16, 2019 [eBook #59522]\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/59522\n\nCredits: Produced by Stephen Hutcheson, Lisa Corcoran and the Online\n        Distributed Proofreading Team at http://www.pgdp.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK BILTMORE HOUSE AND GARDENS ***\n\n\n\n\nProduced by Stephen Hutcheson, Lisa Corcoran and the Online\nDistributed Proofreading Team at http://www.pgdp.net\n\n\n\n\n\n\n\n\n\n                      _Biltmore House and Gardens_\n\n\n                            BILTMORE ESTATE\n\n                           Biltmore-Asheville\n                             North Carolina\n\n                            OPEN TO VISITORS\n\n    [Illustration: _Biltmore House From The Esplanade_]\n\n    [Illustration: Decorative capital A]\n\nApproached from the Biltmore Lodge Gate of Biltmore Estate, along a\nthree-mile drive of paved roads which wind their way through plantations\nof flowering shrubs and forests of pine, hemlock and hardwood, Biltmore\nHouse, for nearly half a century unique among the great country houses\nof America, comes into view with almost startling suddenness. A sharp\nturn through the wrought iron gates of the north entrance gives one the\nfirst view of the magnificent mansion completed by George W. Vanderbilt\nin 1895.\n\n    [Illustration: _Banquet Hall and Its Triple Fireplace_]\n\nFollowing in many details the lines of French Renaissance chateaux,\nparticularly those of Blois and Chambord, Biltmore House was designed by\nRichard M. Hunt, of New York. The landscape setting of the mansion and\nthe estate was planned by Frederick Law Olmsted, designer of Central\nPark, New York, and executed under the direction of C. D. Beadle, for\nmore than sixty years Superintendent of the Estate. By many, the great\nestate surrounding the mansion is believed to be the finest example of\nlandscape design in America.\n\nThe visitor can profitably study the exterior of the mansion before\npassing through the main portal. The structure has a frontage of 780\nfeet. The breadth of the house, from the main door to the west front, is\n150 feet. The facade rises in three distinct levels, graduated from\nportals to finials. The characteristic French peaked roof, with its\ndormer windows and lofty chimneys, relieves any tendency toward\nseverity. The walls are of hand-tooled Indiana limestone; the roof is of\nslate.\n\nBiltmore House, begun in 1890, was completed and opened in 1895 after\nfive years of intensive construction. Special railroad tracks were laid\nfrom what is now Biltmore station to the site\u2014three miles away\u2014for the\nconveyance of the great mass of construction material required. Hundreds\nof skilled artisans from various parts of this country and Europe worked\nunremittingly, while other hundreds of laborers from the mountain\nsections of North Carolina were given steady employment during the\nperiod of construction.\n\nThe visitor gains the first impression of the mansion\u2019s magnitude when\npassing through the main entrance door, flanked by sixteenth century\nlions of Italian marble, into the great hall which gives access to the\nmain rooms. The self-supporting arches surrounding the Palm Court are\nceiled with tiles especially made by the celebrated artist and\narchitect, Rafael Guastavino, while the arches and dome of the broad\ncircular stairway which spirals to the topmost floor from the left side\nof the hall are of Indiana limestone. Facing the entrance door from the\nrear of the hall is a ceremonial furnishing of Cardinal Richelieu,\nshowing the Cardinal\u2019s coat-of-arms, motto and hat; it is one of a pair,\nthe other is hung on the wall of the second-floor corridor. The grand\nstaircase, modeled after that of the Chateau Blois, winds its way around\nthe massive wrought iron chandelier which extends downward from the roof\nto the Entrance Hall ceiling, and bears a light cluster for each\nlanding.\n\nWhile visitors are free to choose their own itinerary, the tour of the\nmansion usually begins at the Court of Palms, adjoining the Entrance\nHall. This court is a sunken area, encircled with marble and, in almost\nevery season, adorned with masses of flowers from the gardens and\ngreenhouses. The central fountain is surmounted by a statue of a boy and\nswan, the work of Karl Bitter, the Austro-American sculptor. On the\nwalls are copies of the Parthenon Reliefs, now in the British Museum.\n\nFrom the Court of Palms the visitor enters the Oak Drawing Room,\npanelled in Norwegian oak. Most of the engravings hanging here are after\npaintings by Landseer. Heads of deer, buffalo, moose, and bear also\nadorn the walls. The three bronzes over the fireplace are by Barye,\nwhile on the bookcase at the left are four Chinese Celadon vases. The\nSpanish table in the center is of late eighteenth century origin, as is\nthe writing desk facing the entrance.\n\nFrom the Oak Drawing Room one enters the great Banquet Hall, one of the\nchief centers of attraction. Copied in large measure from an old Norman\nbanquet hall, this room is 72 feet long; its ceiling reaches a height of\n75 feet. At one end a triple fireplace, extending almost across the\nentire width of the room, is surmounted by a frieze by Bitter, \u201cThe\nReturn From The Chase.\u201d High above the frieze are grouped the flags of\nthe great powers of Europe at the time Columbus discovered America.\n\nThe outstanding objects of interest in the Banquet Hall are five\nsixteenth century tapestries depicting the story of Vulcan and the loves\nof Venus and Mars. It is the unconfirmed legend that these tapestries,\nwoven of silk and gold, adorned the tent of the French King, Francis I,\non the occasion of his historic meeting with Henry VIII of England on\nthe Field of the Cloth of Gold. The various figures on the tapestries,\nwhich were made in Brussels after the cartoons of the Bolognese painter,\nPrimaticcio, stand out in striking relief. Particularly does one note\nthe beauty and naturalness of the four medallions, one at each corner.\n\nOn the walls are replicas of the flags of the thirteen original states,\nand the Biltmore Estate World War service flag, with its fifty-three\nstars\u2014three of them gold\u2014hangs proudly over the center arch. At the\nopposite end of the Banquet Hall from the fireplace, sets of shelves\ndisplay brass and copper pieces of Dutch, Spanish and French origin\nwhich are attributed to artisans of the seventeenth century. The large\npipes in the organ loft above are flanked by wood carved reliefs by Karl\nBitter, depicting scenes from Wagner\u2019s operas.\n\nFrom the Banquet Hall the visitor proceeds to the Dining Room, the walls\nof which are wainscotted in red marble, surmounted by tooled Spanish\nleather; the upholstery is of Genoese velvet in red and gold. On the\nright is the fireplace by Wedgwood. Portraits of members of the\nVanderbilt family hang from the walls. In this room are displayed\nbeautiful ivory carvings and lustre-ware.\n\nIn the Print Room are rare engravings by Earlom, McArdell, Turner,\nCousins, Ward and Cole. On the center pillar of the entrance is the\nremarkable engraving, \u201cThe Executioner,\u201d by Prince Rupert, after\nSpagnoletto; underneath it is \u201cThe Virgin and Child,\u201d engraved by\nTheodore Caspara Furstenbergh, after Correggio. The large reassembled\nengraving on the left wall shows the family pedigree of Maximilian the\nGreat, by Albrecht Durer (1515); the six engravings on either side of\nthis piece are also by Durer.\n\nA Spanish cabinet of the sixteenth century is placed on the left of the\nlarge Durer engraving; on the right a Dutch cabinet of the late\nseventeenth century. On the right of the entrance, in the center of the\nend wall, is an Italian ebony dresser of the sixteen-seventeenth\ncentury; between the windows are a number of bronze busts by Meunier.\n\nAn antique that attracts much interest, especially among students of\nhistory, is found in the right hand corner of this room, near the\nentrance\u2014the chess table and set of chessmen once owned by Napoleon\nBonaparte, and used by him during the six years of his imprisonment on\nthe island of St. Helena. Tradition has it that the emperor\u2019s heart was\nplaced in the drawer of this table, after being sealed in a silver box,\nfollowing the autopsy performed by Antommarchi. Doctor O\u2019Meara, a\nphysician placed in attendance on Napoleon by the British government,\nsays in his memoirs that Lady Holland, of England, presented the famous\nCorsican with a chess table, and it is probable that this is the table\nreferred to by O\u2019Meara.\n\nFrom the Print Room visitors enter the Tapestry Gallery. Covering almost\nthe entire 90-foot length of the walls are Flemish tapestries of the\nlate fifteenth century, depicting Prudence, Faith and Charity. On the\nleft of the first fireplace is a sofa in French tapestry of Henry III\nperiod, late sixteenth century; the six tapestry chairs in the center of\nthe gallery are Louis XIV. Four chairs and the sofa under the middle\ntapestry are of Louis XIV period.\n\n    [Illustration: _In The Tapestry Gallery_]\n\n    [Illustration: _The Grand Spiral Stairway_]\n\nIn the center is a large refectory table from an old English monastery,\nprobably removed from its original setting during the reign of Henry\nVIII. Twelve Dresden china figures of the Twelve Apostles, bearing\nimprint of the Imperial Arms of Austria, are believed to have come from\na private chapel of the Hapsburgs. Over the door into the Library is a\nportrait of George W. Vanderbilt by Sargent; on the left a Sargent\nportrait of his mother, Mrs. William H. Vanderbilt, and on the right a\nportrait of Mrs. Peter Goelet Gerry (formerly Mrs. George W. Vanderbilt)\nby Boldini.\n\n    [Illustration: _The Dining Room_]\n\nMoving into the Library the visitor\u2019s attention centers on the famous\nceiling painted by Tiepolo, the last outstanding artist of the Venetian\nschool, who died in 1770. The canvas, which covers the library ceiling,\nwas obtained by Mr. Vanderbilt from an old Italian palace, on his pledge\nthat the name of the former owner should never be revealed.\n\nThe unique library, panelled in Circassian walnut, contains more than\n20,000 volumes, among them rare works on art, architecture and landscape\ngardens. Over the fireplace hangs an Italian tapestry, of the late\nseventeenth century. Two white porcelain vases of eighteenth century,\nthree large Chinese goldfish bowls, credited to the Ming dynasty, and a\npiece of sixteenth century Spanish embroidery on the long table at the\nend of the room, are other rare objects of interest. The carved black\nmarble fireplace on the left is nine feet wide and six feet high; the\nfigures on the andirons are by Bitter.\n\nLeaving the Library one mounts the grand staircase to the second floor\nand enters the First Hall, a room 72 by 35 feet. Here are hung many\nvaluable paintings, among them Sargent\u2019s life-size portraits of Richard\nMorris Hunt and Frederick Law Olmsted, designers of the house and the\nestate respectively. Here also is seen a large Persian palace or temple\nrug, middle sixteenth century, 33 by 25 feet. The furniture here is\nVenetian, late eighteenth century. Another object of interest is a\nSpanish Wedding Vestment Chest. Above is an Italian mirror, nineteenth\ncentury.\n\nOpening from the hall is the Louis XVI Bedroom with furniture of that\nperiod. The South Bedroom, once occupied by Mr. Vanderbilt, commands\nfrom its windows views of rarely excelled scenic splendor. In this room\nthe carving and panelling are of walnut; the furniture is Spanish,\nItalian and Portuguese of the early eighteenth century. The bed, hung in\nred and gold, is Spanish.\n\nThe North Bedroom is upholstered in purple and gold Genoese velvet. The\nOak Sitting Room, between the North and South Bedrooms, contains several\nlarge and beautiful bronzes by Barye, Meunier and Mene. There also is a\nMaria di Medici settee bearing the private monogram of that tempestuous\nqueen, and on the wall are displayed Sargent\u2019s portraits of Mrs. Kissam\nand Mrs. Bacon.\n\nThe visitor emerging from the mansion looks down upon a grassy\nEsplanade, in the center of which are a fountain and pool, with\ndriveways on either side. Beyond the Esplanade is a magnificent\nstructure of stone, the \u201cRampe Douce,\u201d with its three turtle founts,\nerected to enable one, whether mounted or afoot, to reach the bridle\npaths and glades above and beyond. Below the level of the Library\nTerrace and the Esplanade, surrounded by boxwood and holly hedges, are\nthe Swimming Pool and Italian Garden. The holly hedge is studded at\nregular intervals with Italian sculptured urns. Here is the wall with\nivy from Kenilworth Castle, and a veritable forest of old Wistaria vine\ngreets the visitor in the Pergola. Here, as in almost every other part\nof the grounds adjacent to the mansion, are rare examples of beautiful\nstatuary procured by Mr. Vanderbilt on his travels abroad.\n\nBeyond the Library Terrace are the Italian Garden, the Shrub Garden, the\nWalled Garden, the Spring Garden and the Azalea Garden, in the aggregate\ncontaining about thirty-five acres of rare and beautiful plants and\nflowers in almost endless variety, which bloom in seasonal succession.\n\nThe greenhouses at the end of the Walled Garden are devoted to the\ncultivation of plants and flowers used in the adornment of the mansion.\nThe giant palms and ferns of many varieties present a truly tropical\nscene.\n\nAn estate of some 12,000 acres surrounds Biltmore House; formerly it\ncomprised more than 100,000 acres, but a large portion of the forest\narea was granted to the government by Mrs. Vanderbilt after Mr.\nVanderbilt\u2019s death, as the nucleus of Pisgah National Forest, and 1,500\nacres were allotted for development of the Biltmore Forest Country Club\nand the Town of Biltmore Forest. The estate, with its 17 miles of paved\nand macadam roads, and 120 miles of equestrian trails and earth roads,\ngives employment to more than 500 people, the greater number of these\nbeing engaged in the operation of the Biltmore Dairy Farms and kindred\nactivities. The Biltmore herd of some 1200 pure-bred Jerseys is one of\nthe largest, and is recognized as one of the finest, in the country.\n\nAs a result of the efforts on behalf of the Asheville Chamber of\nCommerce, Biltmore House was opened to the public March 15, 1930,\nsixteen years after Mr. Vanderbilt\u2019s death. Admission tickets are on\nsale at the Biltmore Estate office on the Plaza in Biltmore, and at the\nAsheville Chamber of Commerce.\n\n    [Illustration: _A Section of The Library_]\n\n\n\n\n                          Tran"}, {"id": "gutenberg-31367", "title": "The Training of a Forester", "category": "Forestry", "path": "texts/31367.txt", "type": "TEXT", "local": "content/texts/31367.txt", "content": "The Project Gutenberg eBook of The Training of a Forester\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: The Training of a Forester\n\nAuthor: Gifford Pinchot\n\n\n        \nRelease date: February 23, 2010 [eBook #31367]\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/31367\n\nCredits: Produced by Tom Roch, Barbara Kosker and the Online\n        Distributed Proofreading Team at http://www.pgdp.net (This\n        file was produced from images produced by Core Historical\n        Literature in Agriculture (CHLA), Cornell University)\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK THE TRAINING OF A FORESTER ***\n\n\n\n\nProduced by Tom Roch, Barbara Kosker and the Online\nDistributed Proofreading Team at http://www.pgdp.net (This\nfile was produced from images produced by Core Historical\nLiterature in Agriculture (CHLA), Cornell University)\n\n\n\n\n\n\n\n\n\nTHE TRAINING OF A FORESTER\n\n\n\n\n[Illustration: A FOREST RANGER LOOKING FOR FIRE FROM A NATIONAL FOREST\nLOOKOUT STATION _Page 32_]\n\n\n\n\n  THE TRAINING OF A FORESTER\n\n\n\n\n  BY\n\n  GIFFORD PINCHOT\n\n\n\n\n  WITH EIGHT ILLUSTRATIONS\n\n\n\n  [Illustration]\n\n\n\n  PHILADELPHIA & LONDON\n  J. B. LIPPINCOTT COMPANY\n  1914\n\n\n\n\n  COPYRIGHT, 1914, BY J. B. LIPPINCOTT COMPANY\n\n  PUBLISHED FEBRUARY, 1914\n\n\n\n  PRINTED BY J. B. LIPPINCOTT COMPANY\n  AT THE WASHINGTON SQUARE PRESS\n  PHILADELPHIA, U. S. A.\n\n\n\n\n  To\n\n  OVERTON W. PRICE\n  FRIEND AND FELLOW WORKER\n\n  TO WHOM IS DUE, MORE THAN TO ANY OTHER MAN, THE\n  HIGH EFFICIENCY OF THE UNITED STATES FOREST SERVICE\n\n\n\n\nPREFACE\n\n\nAt one time or another, the largest question before every young man is,\n\"What shall I do with my life?\" Among the possible openings, which best\nsuits his ambition, his tastes, and his capacities? Along what line\nshall he undertake to make a successful career? The search for a life\nwork and the choice of one is surely as important business as can occupy\na boy verging into manhood. It is to help in the decision of those who\nare considering forestry as a profession that this little book has been\nwritten.\n\nTo the young man who is attracted to forestry and begins to consider it\nas a possible profession, certain questions present themselves. What is\nforestry? If he takes it up, what will his work be, and where? Does it\nin fact offer the satisfying type of outdoor life which it appears to\noffer? What chance does it present for a successful career, for a career\nof genuine usefulness, and what is the chance to make a living? Is he\nfitted for it in character, mind, and body? If so, what training does he\nneed? These questions deserve an answer.\n\nTo the men whom it really suits, forestry offers a career more\nattractive, it may be said in all fairness, than any other career\nwhatsoever. I doubt if any other profession can show a membership so\nuniformly and enthusiastically in love with the work. The men who have\ntaken it up, practised it, and left it for other work are few. But to\nthe man not fully adapted for it, forestry must be punishment, pure and\nsimple. Those who have begun the study of forestry, and then have\nlearned that it was not for them, have doubtless been more in number\nthan those who have followed it through.\n\nI urge no man to make forestry his profession, but rather to keep away\nfrom it if he can. In forestry a man is either altogether at home or\nvery much out of place. Unless he has a compelling love for the\nForester's life and the Forester's work, let him keep out of it.\n\n  G. P.\n\n\n\n\nCONTENTS\n\n\n                                                                 PAGE\n\n  WHAT IS A FOREST?                                                13\n\n  THE FORESTER'S KNOWLEDGE                                         18\n\n  THE FOREST AND THE NATION                                        19\n\n  THE FORESTER'S POINT OF VIEW                                     23\n\n  THE ESTABLISHMENT OF FORESTRY                                    27\n\n  THE WORK OF A FORESTER                                           30\n\n  THE FOREST SERVICE                                               30\n\n  THE FOREST SUPERVISOR                                            46\n\n  THE TRAINED FORESTER                                             50\n\n  PERSONAL EQUIPMENT                                               63\n\n  STATE FOREST WORK                                                84\n\n  THE FOREST SERVICE IN WASHINGTON                                 89\n\n  PRIVATE FORESTRY                                                106\n\n  FOREST SCHOOLS                                                  114\n\n  THE OPPORTUNITY                                                 116\n\n  TRAINING                                                        123\n\n\n\n\nILLUSTRATIONS\n\n\n                                                                 PAGE\n\n  A FOREST RANGER LOOKING FOR FIRE FROM A NATIONAL\n  FOREST LOOKOUT STATION                                _Frontispiece_\n\n  STRINGING A FOREST TELEPHONE LINE                                32\n\n  FOREST RANGERS SCALING TIMBER                                    43\n\n  WESTERN YELLOW PINE SEED COLLECTED BY THE FOREST\n  SERVICE FOR PLANTING UP DENUDED LANDS                            47\n\n  A FOREST EXAMINER RUNNING A COMPASS LINE                         59\n\n  BRUSH PILING IN A NATIONAL FOREST TIMBER SALE                    95\n\n  FOREST RANGERS GETTING INSTRUCTION IN METHODS OF\n  WORK FROM A DISTRICT FOREST OFFICER                             105\n\n  FOREST SERVICE MEN MAKING FRESH MEASUREMENTS IN\n  THE MISSOURI SWAMPS                                             136\n\n\n\n\nTHE TRAINING OF A FORESTER\n\n\n\n\nWHAT IS A FOREST?\n\n\nFirst, What is forestry? Forestry is the knowledge of the forest. In\nparticular, it is the art of handling the forest so that it will render\nwhatever service is required of it without being impoverished or\ndestroyed. For example, a forest may be handled so as to produce saw\nlogs, telegraph poles, barrel hoops, firewood, tan bark, or turpentine.\nThe main purpose of its treatment may be to prevent the washing of soil,\nto regulate the flow of streams, to support cattle or sheep, or it may\nbe handled so as to supply a wide range and combination of uses.\nForestry is the art of producing from the forest whatever it can yield\nfor the service of man.\n\nBefore we can understand forestry, certain facts about the forest itself\nmust be kept in mind. A forest is not a mere collection of individual\ntrees, just as a city is not a mere collection of unrelated men and\nwomen, or a Nation like ours merely a certain number of independent\nracial groups. A forest, like a city, is a complex community with a life\nof its own. It has a soil and an atmosphere of its own, chemically and\nphysically different from any other, with plants and shrubs as well as\ntrees which are peculiar to it. It has a resident population of insects\nand higher animals entirely distinct from that outside. Most important\nof all, from the Forester's point of view, the members of the forest\nlive in an exact and intricate system of competition and mutual\nassistance, of help or harm, which extends to all the inhabitants of\nthis complicated city of trees.\n\nThe trees in a forest are all helped by mutually protecting each other\nagainst high winds, and by producing a richer and moister soil than\nwould be possible if the trees stood singly and apart. They compete\namong themselves by their roots for moisture in the soil, and for light\nand space by the growth of their crowns in height and breadth. Perhaps\nthe strongest weapon which trees have against each other is growth in\nheight. In certain species intolerant of shade, the tree which is\novertopped has lost the race for good. The number of young trees which\ndestroy each other in this fierce struggle for existence is prodigious,\nso that often a few score per acre are all that survive to middle or old\nage out of many tens of thousands of seedlings which entered the race of\nlife on approximately even terms.\n\nNot only has a forest a character of its own, which arises from the fact\nthat it is a community of trees, but each species of tree has peculiar\ncharacteristics and habits also. Just as in New York City, for example,\nthe French, the Germans, the Italians, the Hungarians, and the Chinese\neach have quarters of their own, and in those quarters live in\naccordance with habits which distinguish each race from all the others,\nso the different species of pines and hemlocks, oaks and maples prefer\nand are found in certain definite types of locality, and live in\naccordance with definite racial habits which are as general and\nunfailing as the racial characteristics which distinguish, for example,\nthe Italians from the Germans, or the Swedes from the Chinese.\n\nThe most important of these characteristics of race or species are those\nwhich are concerned with the relation of each to light, heat, and\nmoisture. Thus, a river birch will die if it has only as much water as\nwill suffice to keep a post oak in the best condition, and the warm\nclimate in which the balsam fir would perish is just suited to the\nrequirements of a long leaf pine or a magnolia.\n\nThe tolerance of a tree for shade may vary greatly at different times of\nits life, but a white pine always requires more light than a hemlock,\nand a beech throughout its life will flourish with less sunshine or\nreflected light than, for example, an oak or a tulip tree.\n\nTrees are limited in their distribution also by their adaptability, in\nwhich they vary greatly. Thus a bald cypress will grow both in wetter\nand in dryer land than an oak; a red cedar will flourish from Florida to\nthe Canadian line, while other species, like the Eastern larch, the\nWestern mountain hemlock, or the big trees of California, are confined\nin their native localities within extremely narrow limits.\n\n\n\n\nTHE FORESTER'S KNOWLEDGE\n\n\nThe trained Forester must know the forest as a doctor knows the human\nmachine. First of all, he must be able to distinguish the different\ntrees of which the forest is composed, for that is like learning to\nread. He must know the way they are made and the way they grow; but far\nmore important than all else, he must base his knowledge upon that part\nof forestry which is called Silvics, the knowledge of the relation of\ntrees to light, heat, and moisture, to the soil, and to each other.\n\nThe well-trained Forester must also know the forest shrubs and at least\nthe more important smaller forest plants, something of the insect and\nanimal life of his domain, and the birds and fish. He must have a good\nworking knowledge of rocks, soils, and streams, and of the methods of\nmaking roads, trails, and bridges. He should be an expert in woodcraft,\nable to travel the forest safely and surely by day or by night. It is\nessential that he should have a knowledge of the theory and the practice\nof lumbering, and he should know something about lumber markets and the\nvalue of lumber, about surveying and map making, and many other matters\nwhich are considered more at length in the Chapter on Training. There\nare as yet in America comparatively few men who have acquired even\nfairly well the more important knowledge which should be included in the\ntraining of a Forester.\n\n\n\n\nTHE FOREST AND THE NATION\n\n\nThe position of the forest in the housekeeping of any nation is unlike\nthat of any other great natural resource, for the forest not only\nfurnishes wood, without which civilization as we know it would be\nimpossible, but serves also to protect or make valuable many of the\nother things without which we could not get on. Thus the forest cover\nprotects the soil from the effects of wind, and holds it in place. For\nlack of it hundreds of thousands of square miles have been converted by\nthe winds from moderately fertile, productive land to arid drifting\nsands. Narrow strips of forest planted as windbreaks make agriculture\npossible in certain regions by preventing destruction of crops by\nmoisture-stealing dry winds which so afflict the central portions of our\ncountry.\n\nWithout the forests the great bulk of our mining for coal, metals, and\nthe precious minerals would be either impossible or vastly more\nexpensive than it is at present, because the galleries of mines are\npropped with wood, and so protected against caving in. So far, no\nsatisfactory substitute for the wooden railroad tie has been devised;\nand our whole system of land transportation is directly dependent for\nits existence upon the forest, which supplies more than one hundred and\ntwenty million new railroad ties every year in the United States alone.\n\nThe forest regulates and protects the flow of streams. Its effect is to\nreduce the height of floods and to moderate extremes of low water. The\nofficial measurements of the United States Geological Survey have\nfinally settled this long-disputed question. By protecting mountain\nslopes against excessive soil wash, it protects also the lowlands upon\nwhich this wash would otherwise be deposited and the rivers whose\nchannels it would clog. It is well within the truth to say that the\nutility of any system of rivers for transportation, for irrigation, for\nwaterpower, and for domestic supply depends in great part upon the\nprotection which forests offer to the headwaters of the streams, and\nthat without such protection none of these uses can be expected long to\nendure.\n\nOf the two basic materials of our civilization, iron and wood, the\nforest supplies one. The dominant place of the forest in our national\neconomy is well illustrated by the fact that no article whatsoever,\nwhether of use or ornament, whether it be for food, shelter, clothing,\nconvenience, protection, or decoration, can be produced and delivered to\nthe user, as industry is now organized, without the help of the forest\nin supplying wood. An examination of the history of any article,\nincluding the production of the raw material, and its manufacture,\ntransportation, and distribution, will at once make this point clear.\n\nThe forest is a national necessity. Without the material, the\nprotection, and the assistance it supplies, no nation can long succeed.\nMany regions of the old world, such as Palestine, Greece, Northern\nAfrica, and Central India, offer in themselves the most impressive\nobject lessons of the effect upon national prosperity and national\ncharacter of the neglect of the forest and its consequent destruction.\n\n\n\n\nTHE FORESTER'S POINT OF VIEW\n\n\nThe central idea of the Forester, in handling the forest, is to promote\nand perpetuate its greatest use to men. His purpose is to make it serve\nthe greatest good of the greatest number for the longest time. Before\nthe members of any other profession dealing wi"}, {"id": "gutenberg-72365", "title": "At Home in the Smokies", "category": "History", "path": "texts/72365.txt", "type": "TEXT", "local": "content/texts/72365.txt", "content": "The Project Gutenberg eBook of At home in the Smokies\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: At home in the Smokies\n        a history handbook for Great Smoky Mountains National Park, North Carolina and Tennessee\n\nCreator: United States. National Park Service\n\nAuthor: Wilma Dykeman\n        James Stokely\n\n\n        \nRelease date: December 10, 2023 [eBook #72365]\n\nLanguage: English\n\nOriginal publication: Washington DC: National Park Service, 1984\n\nOther information and formats: www.gutenberg.org/ebooks/72365\n\nCredits: Carla Foust, Steve Mattern, Thiers Halliwell and the Online Distributed Proofreading Team at https://www.pgdp.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK AT HOME IN THE SMOKIES ***\n\n\n\n[Illustration:\n\n  At Home\n  In the Smokies\n]\n\n\n\n\nHandbook 125\n\n\n\n\n  At Home\n  In the Smokies\n\n  A History Handbook for\n  Great Smoky Mountains National Park\n  North Carolina and Tennessee\n\n  Produced by the\n  Division of Publications\n  National Park Service\n\n  U.S. Department of the Interior\n  Washington, D.C. 1984\n\n\n\n\n_Using This Handbook_\n\n\nThis theme handbook, published in this new edition on the 50th\nanniversary of Great Smoky Mountains National Park, tells the story of\nthe people who settled and lived in the mountains along the Tennessee\nand North Carolina border. Part 1 gives a brief introduction to the\npark and its historical sites. In Part 2, Wilma Dykeman and Jim Stokely\npresent the history of the region from the early Cherokee days to\nthe establishment of the park in 1934 and the renewed interest in\nthe past in the 1970s; this text was first published by the National\nPark Service in 1978. Part 3 gives a brief description of the major\nhistorical buildings you can see in the park. For general information\nabout the park and its wildlife, see Handbook 112.\n\n\nNational Park Handbooks, compact introductions to the great natural\nand historic places administered by the National Park Service, are\npublished to support the National Park Service\u2019s management programs at\nthe parks and to promote understanding and enjoyment of the parks. This\nis Handbook 125.\n\n\n_Library of Congress Cataloging in Publication Data_\n\nMain entry under title: At home in the Smokies. (National park\nhandbook; 125)\n\nRev. ed. of: Highland homeland/Wilma Dykeman and Jim Stokely. 1978.\nIncludes index.\n\nSupt. of Docs, no.: I 29.9/5:125\n\n1. Great Smoky Mountains (N.C. and Tenn.)--Social life and customs.\n2. Great Smoky Mountains (N.C. and Tenn.)--History. 3. Great Smoky\nMountains National Park (N.C. and Tenn.)--Guide-books. 4. Cherokee\nIndians--History.\n\nI. Dykeman, Wilma. Highland homeland. II. United States. National\nPark Service. Division of Publications. III. Series: Handbook (United\nStates. National Park Service. Division of Publications); 125.\n\n  F443.G7A8      1984      976.8\u201989      84-600108\n\nISBN 0-912627-22-0\n\n\n\n\n  =Part 1=      =Recapturing the Past=                  =4=\n                Smoky Mountain Heritage                  7\n\n  =Part 2=      =Highland Homeland=                    =12=\n                _By Wilma Dykeman and Jim Stokely_\n\n                Homecoming                              17\n                  _Rail Fences_                         30\n                Land of the Cherokees                   35\n                The Pioneers Arrive                     49\n                  _Rifle Making_                        60\n                A Band of Cherokees Holds On            63\n                From Pioneer to Mountaineer             73\n                  _Spinning and Weaving_                94\n                The Sawmills Move In                    97\n                Birth of a Park                        107\n                The Past Becomes Present               121\n                  _Handicrafts_                        132\n                Coming Home                            137\n\n  =Part 3=      =Guide and Adviser=                   =146=\n                Traveling in the Smokies               148\n                Oconaluftee                            150\n                Cades Cove                             152\n                Other Historic Sites in the Park       154\n                Related Nearby Sites                   156\n                Armchair Explorations                  157\n\n                Index          158\n\n\n\n\n[Illustration:\n\n  Part 1\n\n  Recapturing the Past\n]\n\n[Illustration:\n\n  Joseph S. Hall\n\n _Aden Carver of Oconaluftee was a carpenter, stone mason, millwright,\n deacon, and preacher. He was more versatile than some men but\n representative of many who worked hard and enjoyed their lives in the\n Smokies._\n]\n\n\n\n\nSmoky Mountain Heritage\n\n\nSeemingly endless ridges, forests, mountain streams, waterfalls, and\nwildlife attract hundreds of thousands of travelers each year to Great\nSmoky Mountains National Park on the Tennessee-North Carolina border.\nMany are drawn by a long procession of wildflowers and shrubs bursting\ninto bloom in the spring and by the colorful foliage of the hardwoods\nin the fall. Thousands hike the park\u2019s many trails, which range from\nshort spurs to the 110 kilometers (70 miles) of the Appalachian Trail\nthat runs through the park. Also attracting wide interest are the\npark\u2019s historical sites and the lifeways of the mountain people. They\nare pleasant surprises in the midst of all of nature\u2019s richness. They\nare physical ties with our ancestors, many of whom traveled from\ntheir homelands across the sea to build new homes in the relatively\nunexplored continent of North America.\n\nThe National Park Service has preserved some of the historic\nstructures in Great Smoky Mountains National Park so that we, and\nfuture generations, can better understand how our forefathers lived.\nBy walking through and closely examining their finely crafted--and\ncrudely crafted--log houses, barns, and other farm buildings we gain\na new respect for their diligence and perseverance. The hours spent\nhewing massive beams, preserving foods for winter use, and making\nclothes from scratch are nearly incomprehensible in our age of machines\nand computers. The mountainous terrain demanded hard work, and the\nisolation fostered a zealous independence. The land truly molded a\nresourcefulness and hardiness in the Smokies character.\n\nThe story of these mountain people and communities is told in Part 2\nof this handbook by Wilma Dykeman and Jim Stokely, who can look out on\nthe expanse of the Great Smokies from their family home in Newport,\nTennessee. Their engaging story of the Smokies is illustrated with\nhistoric photographs that largely come from the park\u2019s files. Although\nthe identities of many of the photographers are unknown (see page 160),\nwe are no less indebted to them. They have helped to preserve the\nhistory and folkways of the Great Smokies people, who played a part in\nmolding and defining our national character.\n\n[Illustration]\n\n[Illustration]\n\n[Illustration:\n\n  Charles S. Grossman\n\n _In the old days, housekeeping in the Smokies allowed few if any\n frills. Aunt Rhodie Abbott, and most other women, worked as hard as\n any man as they went about their daily chores keeping their families\n fed and clothed._\n]\n\n\n\n\n[Illustration:\n\n  Part 2\n\n  Highland Homeland\n]\n\n[Illustration]\n\n[Illustration:\n\n _A home in the Smokies usually meant a simple log house nestled in the\n hills among the trees and amidst the haze._\n\n  National Park Service\n]\n\n\n\n\nHomecoming\n\n\nIt is summer now, a time for coming home. And on an August Sunday in\nthe mountain-green valley they call Cataloochee, the kinfolk arrive.\nThey come from 50 states to gather here, at a one-room white frame\nMethodist church by the banks of the Big \u201cCatalooch.\u201d The appearance of\ntheir shiny cars and bulky campers rolling along the paved Park Service\nroad suggests that they are tourists, too, a tiny part of the millions\nwho visit and enjoy the Great Smoky Mountains each year. Yet these\nparticular families represent something more. A few of them were raised\nhere; their ancestors lived and died here.\n\nThey are celebrating their annual Cataloochee homecoming. Other\nreunions, held on Sundays throughout the summer, bring together\none-time residents of almost every area in the park. Some of the places\ninstantly recall bits of history: Greenbrier, once a heavily populated\ncove and political nerve-center; Elkmont, where a blacksmith named\nHuskey set out one winter to cross the Smokies and was discovered\ndead in a bear trap the next spring; and Smokemont on the beautiful\nOconaluftee River, at one time the home of the Middle Cherokee and the\nvery heart of that Indian Nation.\n\nThese are special days, but they observe a universal experience as\nold as Homer\u2019s Ulysses, as new as the astronauts\u2019 return from the\nmoon: homecoming. It is an experience particularly significant in the\nGreat Smoky Mountains National Park. Here, at different times and in\ndifferent ways, people of various races and heritage have reluctantly\ngiven up hearth and farm so that today new generations can come to this\ngreen kingdom of some 209,000 hectares (517,000 acres) and rediscover a\nnatural homeland which is the heritage of all.\n\nBeginning on Canada\u2019s Gasp\u00e9 Peninsula as a limestone finger only 2.5\nkilometers (1.5 miles) wide, the Appalachian mountain system that\ndominates eastern America slants about 5,000 kilometers (3,000 miles)\nsouthwest across New England and the Atlantic and border states\ninto northern Georgia and Alabama, culminating in the grandeur and\ncomplexity of the Great Smoky Mountains. This range, which marks the\ndividing line between Tennessee and North Carolina, is high; its\n58-kilometer (36-mile) crest remains more than 1,500 meters (4,900\nfeet) above sea level. It is ancient--the Ocoee rocks here are\nestimated to be 500-600 million years old--and its tall peaks and\nplunging valleys have been sculpted by nature through the action of\nice and water during long, patient centuries. The odd and fantastic\ncourses of the rivers here indicate that they are older than the\nmountains. The Great Smokies are a land of moving waters; there is no\nnatural lake or pond in this area, but there are some 1,000 kilometers\n(620 miles) of streams with more than 70 species of fish. A generous\nrainfall, averaging as much as 229 centimeters (90 inches) per year in\nsome localities and 211 centimeters (83 inches) atop Clingmans Dome,\nnourishes a rich variety of plantlife: more than 100 species of trees,\n1,200 other flowering plants, 50 types of fern, 500 mosses and lichens,\nand 2,000 fungi. The mixed hardwood forest and virgin stands of balsam\nand spruce are the special glories of the Smokies.\n\nMany of the species of birds that make the Smokies their home do not\nhave to leave to migrate; by migrating vertically, from the valleys to\nthe mountaintops in summer and back down in winter, they can experience\nthe equivalent of a journey at sea level from Georgia to New England.\nAnimals large and small find this a congenial home, and two, the wild\nboar and the black bear, are especially interesting to visitors. The\nformer shuns people, but the latter is occasionally seen along trails\nand roadsides throughout the Smokies.\n\nWhen the Great Smoky Mountains were added to the National Park System\nin 1934, a unique mission was accomplished: more than 6,600 separate\ntracts of land had been purchased by the citizens of Tennessee\nand North Carolina and given to the people of the United States.\nPreviously, most national parks had been created from lands held by the\nFederal Government. The story of the Great Smokies is, therefore, most\nespecially and significantly, a story of people and their home. Part of\nthat story is captured in microcosm on an August Sunday in a secluded\nnortheastern corner of the park: Cataloochee.\n\nHistory is what the homecoming is about. The people of Cataloochee\nworship and sing and eat and celebrate because they are back. And being\nback, they remember. They walk up the narrow creeks, banked by thick\ntangles of rhododendron and dog-hobble, to the sites of old homesteads.\nThey watch their small children and grandchildren wade the water\nand trample the grass of once-familiar fields. They call themselves\nCaldwell, Palmer, Hannah, Woody, Bennett, Messer. For exactly a\ncentury--from the late 1830s and the coming of the first permanent\nwhite settlers to the later 1930s and the coming of the park--men\nand women with these names lived along Cataloochee Creek. But these\npioneers were not the first to inhabit a valley that they called by an\nIndian name.\n\n[Illustration:\n\n  Alan Rinehart\n\n _With their trusty mule and sourwood sled, Giles and Lenard Ownby haul\n wood for making shingles._\n]\n\nBy \u201cGad-a-lu-tsi,\u201d the Cherokees meant \u201cstanding up in ranks.\u201d As they\nlooked from Cove Creek Gap at the eastern end of the valley across\ntoward the Balsam Mountains, they used that term to describe the thin\nstand of timber at the top of the distant range. Later, the name became\n\u201cCataloochee,\u201d or the colloquial \u201cCatalooch,\u201d and it referred to the\nentire watershed of the central stream.\n\nThe Cherokees liked what they saw. They hunted and fished throughout\nthe area and established small villages along one of their main trails.\nThe Cataloochee Track, as it came to be known, ran from Cove Creek Gap\nat the eastern edge of the present-day park up over the Smokies and\ndown through what is now the Cosby section of eastern Tennessee. It\nconnected large Indian settlements along the upper French Broad River\nin North Carolina with the equally important Overhill Towns of the\nTennessee River.\n\nBy the early 1700s, Cataloochee formed a minor portion of the great\nCherokee Nation whose towns and villages extended from eastern\nTennessee and western North Carolina into northern Georgia. But as time\nwent on, and as the white settlements pushed westward from the wide\neastern front, the Cherokees lost dominion over this vast area. In\n1791, at the treaty of Holston, the Cherokees gave up Cataloochee along\nwith much of what is now East Tennessee. Five years later the state\nof North Carolina granted 71,210 hectares (176,000 acres), including\nall of Cataloochee, to John Gray Blount--brother to William Blount,\ngovernor of the Territory South of the Ohio River, as Tennessee was\nthen called. Blount kept the land for speculation, but it eventually\nsold for less than one cent per hectare. Now that the Cherokees had\nrelinquished the land, no one else seemed to want it. Even the famous\nMethodist Bishop Francis Asbury, first sent as a missionary to America\nin 1771, apparently wavered in his spirit when confronted with the\nCataloochee wilderness. In his journal in 1810 he lamented:\n\n\u201c_At Catah"}, {"id": "gutenberg-45634", "title": "Myths of the Cherokee", "category": "Cherokee", "path": "texts/45634.txt", "type": "TEXT", "local": "content/texts/45634.txt", "content": "The Project Gutenberg eBook of Myths of the Cherokee\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Myths of the Cherokee\n\nAuthor: James Mooney\n\n\n        \nRelease date: May 11, 2014 [eBook #45634]\n                Most recently updated: October 24, 2024\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/45634\n\nCredits: Produced by Jeroen Hellingman and the Online Distributed\n        Proofreading Team at http://www.pgdp.net/ for Project\n        Gutenberg (This file was produced from images generously\n        made available by The Internet Archive/American Libraries.)\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK MYTHS OF THE CHEROKEE ***\n\n                         MYTHS OF THE CHEROKEE\n\n                                   BY\n\n                              JAMES MOONEY\n\n oquois wampum belts                     354\n\n\n\n\n\n\n\nMYTHS OF THE CHEROKEE\n\nBy James Mooney\n\n\nI--INTRODUCTION\n\n\nThe myths given in this paper are part of a large body of material\ncollected among the Cherokee, chiefly in successive field seasons\nfrom 1887 to 1890, inclusive, and comprising more or less extensive\nnotes, together with original Cherokee manuscripts, relating to the\nhistory, archeology, geographic nomenclature, personal names, botany,\nmedicine, arts, home life, religion, songs, ceremonies, and language\nof the tribe. It is intended that this material shall appear from time\nto time in a series of papers which, when finally brought together,\nshall constitute a monograph upon the Cherokee Indians. This paper may\nbe considered the first of the series, all that has hitherto appeared\nbeing a short paper upon the sacred formulas of the tribe, published\nin the Seventh Annual Report of the Bureau in 1891 and containing a\nsynopsis of the Cherokee medico-religious theory, with twenty-eight\nspecimens selected from a body of about six hundred ritual formulas\nwritten down in the Cherokee language and alphabet by former doctors\nof the tribe and constituting altogether the largest body of aboriginal\nAmerican literature in existence.\n\nAlthough the Cherokee are probably the largest and most important\ntribe in the United States, having their own national government and\nnumbering at any time in their history from 20,000 to 25,000 persons,\nalmost nothing has yet been written of their history or general\nethnology, as compared with the literature of such northern tribes\nas the Delawares, the Iroquois, or the Ojibwa. The difference is due\nto historical reasons which need not be discussed here.\n\nIt might seem at first thought that the Cherokee, with their civilized\ncode of laws, their national press, their schools and seminaries,\nare so far advanced along the white man's road as to offer but little\ninducement for ethnologic study. This i         const searchInput = document.getElementById('searchInput');
        const tabs = document.querySelectorAll('.tab');
        const cardGrid = document.getElementById('cardGrid');
        const noResults = document.getElementById('noResults');

        let currentCategory = 'ALL';
        let searchQuery = '';

        function setFontSize(size) {
            document.documentElement.style.setProperty('--base-font-size', size);
            localStorage.setItem('appalachian_font_size', size);
        }

        const savedFontSize = localStorage.getItem('appalachian_font_size');
        if (savedFontSize) { setFontSize(savedFontSize); }

        // Scroll Position Saving
        window.addEventListener('scroll', () => {
            localStorage.setItem('appalachian_index_scroll', window.scrollY);
        });

        const savedScrollPos = localStorage.getItem('appalachian_index_scroll');
        if (savedScrollPos) {
            window.scrollTo({ top: parseInt(savedScrollPos), behavior: 'smooth' });
        }

        function getSnippet(content, query) {
            if (!query || !content) return '';
            const idx = content.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return '';

            const start = Math.max(0, idx - 40);
            const end = Math.min(content.length, idx + query.length + 60);
            let snippet = content.substring(start, end);

            const regex = new RegExp(`(${query})`, 'gi');
            snippet = snippet.replace(regex, '<mark>$1</mark>');

            return (start > 0 ? '...' : '') + snippet + (end < content.length ? '...' : '');
        }

        function renderCards() {
            cardGrid.innerHTML = '';
            let visibleCount = 0;

            searchData.forEach(item => {
                const matchesCategory = (currentCategory === 'ALL' || item.category === currentCategory);
                let matchesSearch = false;
                let snippetHTML = '';

                if (!searchQuery) {
                    matchesSearch = true;
                } else {
                    const titleMatch = item.title.toLowerCase().includes(searchQuery);
                    let bodyMatch = false;

                    if (item.content) {
                        const snippetText = getSnippet(item.content, searchQuery);
                        if (snippetText) {
                            bodyMatch = true;
                            snippetHTML = `<div class="snippet">${snippetText}</div>`;
                        }
                    }

                    matchesSearch = titleMatch || bodyMatch;
                }

                if (matchesSearch && matchesCategory) {
                    visibleCount++;
                    const card = document.createElement('div');
                    card.className = 'card';

                    let badgeClass = 'badge-text';
                    if (item.type === 'PDF') badgeClass = 'badge-pdf';
                    if (item.type === 'AUDIO') badgeClass = 'badge-audio';

                    let mediaContent = '';
                    if (item.type === 'AUDIO') {
                        mediaContent = `<audio controls preload="none" src="${item.path}"></audio>`;
                    } else if (item.type === 'PDF') {
                        mediaContent = `<a href="${item.path}" target="_blank" style="color: var(--secondary-color); font-weight: 600; font-size: 0.9rem; text-decoration: none;">📄 View PDF Document →</a>`;
                    } else {
                        mediaContent = `<a href="${item.path}" style="color: var(--primary-color); font-weight: 600; font-size: 0.9rem; text-decoration: none;">📖 Read Text Document →</a>`;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="card-title">${item.title}</div>
                            ${snippetHTML}
                            <div style="margin-top: 0.75rem;">${mediaContent}</div>
                        </div>
                        <div class="card-meta">
                            <span>Category: ${item.category}</span>
                            <span class="badge ${badgeClass}">${item.type}</span>
                        </div>
                    `;
                    cardGrid.appendChild(card);
                }
            });

            if (visibleCount === 0) {
                const noRes = document.createElement('div');
                noRes.className = 'no-results';
                noRes.style.display = 'block';
                noRes.textContent = 'No matching documents found.';
                cardGrid.appendChild(noRes);
            }
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderCards();
        });

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.getAttribute('data-category');
                renderCards();
            });
        });

        renderCards();
    </script>
