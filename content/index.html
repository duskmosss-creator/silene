he District Court of the United States for the\n                     Southern District of New-York.\n\n\n                                   TO\n                          JOSEPH GALES, ESQ.,\n\nMr Dear Sir,\u2014\n\nI have two reasons for embellishing this little volume with your\ndistinguished and honored name. In the first place, the material of\nwhich it is composed, was originally published in the _National\nIntelligencer_; and in the second place, I desire to record the fact,\nthat for many years past, in all matters appertaining to my pen you have\nbeen to me an invaluable counsellor and friend.\n\n      In love and gratitude,\n          Very sincerely yours,\n              Charles Lanman.\n  Washington, D. C., August, 1849.\n\n\n\n\n                               CONTENTS.\n\n\n                               LETTER I.\n                                                                    PAGE\n                                                          Dahlonega,   9\n\n                                LETTER II.\n                                                 Trip to Track Rock,  20\n\n                               LETTER III.\n                                            Valley of the Nacoochee,  25\n\n                                LETTER IV.\n                                                 Cascade of Tuccoah,  31\n\n                                LETTER V.\n                                              The Falls of Tallulah,  36\n\n                                LETTER VI.\n                                             The Hunter of Tallulah,  47\n\n                               LETTER VII.\n                                                     Trail Mountain,  53\n\n                               LETTER VIII.\n                                                    Down the Owassa,  58\n\n                                LETTER IX.\n                                               Across the Mountains,  65\n\n                                LETTER X.\n                                      Notes on the Little Tennessee,  75\n\n                                LETTER XI.\n                                                 The Smoky Mountain,  84\n\n                               LETTER XII.\n                                          The Cherokees of Carolina,  93\n\n                               LETTER XIII.\n                                                   Cherokee Customs, 100\n\n                               LETTER XIV.\n                                                Cherokee Characters, 106\n\n                                LETTER XV.\n                                                    Hickory Nut Gap, 115\n\n                               LETTER XVI.\n                                              Down the French Broad, 122\n\n                               LETTER XVII.\n                                             Trip to Black Mountain, 131\n\n                              LETTER XVIII.\n                                                The Catawba Country, 139\n\n                               LETTER XIX.\n                                     The Mountains and their People, 151\n\n                                LETTER XX.\n                                                The Nameless Valley, 157\n\n                               LETTER XXI.\n                                             The Valley of Virginia, 166\n\n                                 ADDENDA.\n                                 Geology of the Alleghany Mountains, 173\n                                    Soil of the Alleghany Mountains, 182\n                                Minerals of the Alleghany Mountains, 186\n                   Miscellaneous Remarks on the Alleghany Mountains, 192\n\n\n\n\n                 LETTERS FROM THE ALLEGHANY MOUNTAINS.\n\n\n\n\n                               LETTER I.\n\n\n                                    Dahlonega, Georgia, April, 1848.\n\nThe Cherokee word Dah-lon-e-ga signifies _the place of yellow\nmetal_; and is now applied to a small hamlet at the foot of the\nAlleghany Mountains, in Lumpkin county, Georgia, which is reputed to\nbe the wealthiest gold region in the United States. It is recorded\nof De Soto and his followers that, in the sixteenth century, they\nexplored this entire Southern country in search of gold, and\nunquestionable evidences of their work have been discovered in\nvarious sections of the State. Among these testimonials may be\nmentioned the remains of an old furnace, and other works for mining,\nwhich have been brought to light by recent explorations. But the\nattention of our own people was first directed to this region while\nyet the Cherokees were in possession of the land, though the digging\nof gold was not made a regular business until after they had been\npolitely banished by the General Government. As soon as the State of\nGeorgia had become the rightful possessor of the soil (according to\n_law_), much contention and excitement arose among the people as to\nwho should have the best opportunities for making fortunes; and, to\nsettle all difficulties, it was decided by the State Legislature\nthat the country should be surveyed and divided into lots of forty\nand one hundred and sixty acres, and distributed to the people by\nlottery. For several years subsequent to that period, deeds of wrong\nand outrage were practised to a very great extent by profligate\nadventurers who flocked to this El Dorado. In the year 1838,\nhowever, the Government established a branch Mint at this place,\nsince which time a much better state of things has existed in\nDahlonega.\n\nThe appearance of this village, though not more than a dozen years\nold, is somewhat antiquated, owing to the fact that the houses are\nchiefly built of logs, and, having never been painted, are\nparticularly dark and dingy, but uncommonly picturesque in form and\nlocation. The population of the place is about five hundred. It is\nlocated upon a hill, and though the country around is quite uneven,\nhaving been deeply ravined by atmospheric agents, when viewed in\nconnection with the mountains, (some ten or fifteen miles off,)\nwhich seem to hem it on three sides, presents the appearance of a\npit to a magnificent amphitheatre. On approaching Dahlonega I\nnoticed that the water-courses had all been mutilated with the spade\nand pickaxe, and that their waters were of a deep yellow; and having\nexplored the country since then, I find that such is the condition\nof all the streams within a circuit of many miles. Large brooks (and\neven an occasional river) have been turned into a new channel, and\nthereby deprived of their original beauty. And of all the hills in\nthe vicinity of Dahlonega which I have visited, I have not yet seen\none which is not actually riddled with shafts and tunnels. The soil\nis of a primitive character, quite yellowish in color, composed of\nsand and clay, and uncommonly easy to excavate with the spade.\nHeretofore the gold ore of Lumpkin county has been obtained from\nwhat is called the deposit beds, but the miners are now beginning to\ndirect their attention to the veined ore, which is supposed to be\nvery abundant in all directions. It is generally found in quartz and\na species of slate stone. The gold region of Georgia, strictly\nspeaking, is confined to a broad belt, which runs in a northeastern\nand southwestern direction from Dahlonega, which may be considered\nits centre. Several auriferous veins traverse the town, and it is\ncommon after a rain to see the inhabitants busily engaged in\n_hunting_ for gold in the streets. That huge quantities are thus\naccumulated in _these_ days I am not ready to believe, whatever may\nhave been done in former years. I know not that any very remarkable\nspecimens of gold ore have been found in the immediate vicinity of\nDahlonega, but an idea of the wealth of the State in this particular\nmay be gathered from the fact, that several lumps have heretofore\nbeen found in different sections, which were worth from five hundred\nto one thousand dollars. More valuable specimens have been found in\nNorth Carolina; but while Virginia, the Carolinas, and Alabama have\nall produced a goodly amount of gold, I have heard it conceded that\nGeorgia has produced the largest quantity and decidedly the best\nquality.\n\nAnd now with regard to the fortunes that have been made in this\nregion. They are very few and far between. But, by way of\nillustration, I will give two or three incidents which have come to\nmy knowledge. In passing, however, I may repeat the remark"}, {"id": "gutenberg-60246", "title": "Gatlinburg and the Great Smokies", "category": "History", "path": "texts/60246.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of Gatlinburg and the Great Smokies\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Gatlinburg and the Great Smokies\n\nAuthor: Ernie Pyle\n\n\n        \nRelease date: September 6, 2019 [eBook #60246]\n                Most recently updated: October 17, 2024\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/60246\n\nCredits: Produced by Stephen Hutcheson, Lisa Corcoran and the Online\n        Distributed Proofreading Team at http://www.pgdp.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK GATLINBURG AND THE GREAT SMOKIES ***\n\n                               GATLINBURG\n                                 _And_\n                           THE GREAT SMOKIES\n                                  _By\n                              Ernie Pyle_\n\n\n                              _Ernie Pyle_\n                       ONE OF HIS FAVORITE PHOTOS\n\n                           PRICE\u2014FIFTY CENTS\n\n                      Printed In The Great Smokies\n                           THE MOUNTAIN PRESS\n                         Gatlinburg, Tennessee\n\n\n\n\n                               _Foreword_\n\n\nIn the Fall of 1940, Ernie Pyle and \u201cthat girl\u201d who rode with him (his\nwife, \u201cJerry\u201d) came to Gatlinburg and Ernie wrote eleven columns for the\nScripps-Howard Newspapers about the village of Gatlinburg, the native\npeople and a trip he took to LeConte.\n\nWith permission of the Scripps-Howard Newspaper Alliance and Wm. Sloane\nAssociates Inc., Publishers, these columns are reproduced in this little\nbooklet.\n\nThey are good reading\u2014by one of the truly great writers of our time.\nThey are about things close to the heart of all who love the Smokies.\nThey are simple (as is all great writing) sincere and touched by a\nquaint and whimsical humor.\n\nI wish to thank Loye W. Miller, Editor of the Knoxville (Tennessee)\nNews-Sentinel, and Bert Vincent, Strolling Reporter, for their kind help\nand cooperation in re-printing these columns.\n\n  _C.C. Callaway_\n  Gatlinburg, Tenn.\u20141951\n  All Rights Reserved\n\n\n\n\n                   GATLINBURG, Tenn., Oct. 24, 1940\u2014\n\n\nFor four years I\u2019ve been trying to get to the Great Smoky Mountains\nNational Park and to write some masterful columns about the astounding\nmanner in which Nature splattered her contours and evolutions over this\npart of the globe.\n\nBut I monkeyed around and monkeyed around, and the first thing I knew\nhere was President Roosevelt down here dedicating the thing, and\nstealing all my glory.\n\nBut I just figured, well, the mountains are still here and the words are\nstill in the dictionary, so I might as well come on anyway and compose a\nlittle deathless literature on the Smokies, even if Mr. Roosevelt did\nbeat me to the draw.\n\nSo here we are in Gatlinburg, the north entrance to the great park.\nGatlinburg once consisted of five families. But today, thanks to tourist\nmoney, it is an amazingly charming little city, oozing with handicraft\nshops and tasteful inns and lovely stone houses and saddle horses and\npretty girls in jodhpurs.\n\nGatlinburg lies in a cup, and low wooded mountains rise on every side,\nand a little river runs behind the town, and the main street goes a\nlittle uphill and around a couple of bends, and it is all just like\nyou\u2019d want a mountain resort to be.\n\nRight now is the peak of the fall color season, and the mountains are\naflame with red and yellow and green, and anybody who can see them\nwithout some kind of a gladness at being alive must be a dull soul\nindeed.\n\n\n                             PASSED BY TIME\n\nCenturies ago, white pioneers from England and Scotland came into these\nmountains and set up their homes. They were so isolated that our\nso-called progress largely passed them by.\n\nThey grew up to be a little race distinct. There is no denying that a\nmountain man is different from a plains or city man. I can\u2019t exactly\ntell you the difference, but there is something basically rugged in his\ncharacter that would be nice to have within yourself.\n\nThere are old men in these mountains who would feel embarrassed and\nnaked if the long rifle did not rest on its nails in the wall. You can\nwalk into the hills right behind Gatlinburg and still hear even the\nchildren saying \u201chit\u201d for \u201cit,\u201d and \u201cheerd\u201d for \u201cheard.\u201d\n\nYou can still find leather tanning in the homes, and weaving and\nspinning, and people who make their own furniture, and think it a sin to\ntend garden on Sundays.\n\nIt was to preserve a little of this for posterity, and also to open up\nthe magnificent scenery of the Smokies to the great taxpaying public,\nthat the Great Smokies National Park was created.\n\nIt started in 1923, when the states of Tennessee and North Carolina\nbegan buying mountain land from the big timber companies. John D.\nRockefeller Jr. played an important part. He matched, dollar for dollar,\nevery cent put up by the two states.\n\nIn 1926, Congress authorized the establishment of a Park. The land\nalready bought was turned over to the Federal Government, and the\nGovernment itself bought more.\n\nThe National Park Service actually moved in and took charge about 10\nyears ago. Today the park is well up among the older western parks in\nthe facilities it has created for the public, such as roads, camp\ngrounds, hiking and horse trails. As far as I can see, every thing has\nbeen tastefully done. You have a feeling that the park is \u201cright.\u201d\n\nThis year visitors to the park will run more than 800,000. It is open\nall year, but summer and fall are the big seasons. In June, July and\nAugust you can\u2019t even find a place to sleep in Gatlinburg if you arrive\nlate.\n\n\n                           PARK IS OVAL SHAPE\n\nThe Great Smokies Park is roughly 54 miles long and 19 miles wide at the\nwidest point. It is oval shaped. Except for a few high, level pastures,\nit is tremendously rugged throughout its entirety. It has 16 peaks more\nthan 6000 feet high.\n\nVegetation is lush, clear to the top of the highest peak. There is no\ntimberline in these mountains. Balsam and spruce grow thick in the upper\nregions. In summer the rainfall is almost tropical, and in winter heavy\nsnows blanket the trees and slopes into a fairyland.\n\nAlmost constantly a gray haze hangs like a thin veil over the pile after\npile of far, high, ridges. That is why these mountains are called The\nSmokies. They say that no one knows for sure what causes this haze, but\none explanation credits it to tiny particles of moisture rising from the\nheavily-soaked vegetation.\n\nThe park is half in Tennessee and half in North Carolina. The high,\nsharp backbone of the Smokies cuts the park in two, and along this\nbackbone runs the state line. A horse trail follows this backbone the\nlength of the Park, but there is no motor road up there.\n\nA fine macadam highway crosses the Park, from Gatlinburg to Cherokee, on\nthe Carolina side. And a few gravel roads stab short distances into the\nhills from several entrances.\n\nAside from that, the public must take to foot or horseback to see the\nvast, beckoning interior of the Park. And since taking to foot is one of\nlife\u2019s accomplishments which I am most prodigious at, to coin a phrase,\nwe shall take to foot in a Herculean way about tomorrow.\n\n\n\n\n         MT. LE CONTE LODGE, Great Smokies Park, Oct. 25, 1940\u2014\n\n\nWhen I go to see a National Park, I like to walk in it.\n\nI don\u2019t want to mope along with a tourist party behind a naturalist, and\nI don\u2019t want to ride no damned horse. I just want to get out all by\nmyself like a hermit and square off my shoulders and head uphill.\n\nThere is plenty of walking for a fellow like me in the Great Smokies. In\nfact there are 675 miles of trails that meander all over this vast park.\n\nBut the main trails patronized by tourists are the five different routes\nwhich lead up to the top of Mt. Le Conte, nearly 6600 feet high. Many\npeople make it up and back in one day. But others, like myself add 95\nper cent to the pleasure by staying on top all night.\n\nPeople had told me the Alum Cave trail was the prettiest and most\nspectacular. So, the day before starting, I went over to Park\nHeadquarters to inquire and get my bearings.\n\nI wound up talking to Assistant Chief Ranger Harold Edwards. He wears a\nuniform and has a desk and lots of papers on it, so I believed every\nword he said.\n\nHe said it would take me five hours to climb the Alum Cave trail. He\nsaid it would be the longest five and a half miles I ever walked. He\nsaid it was very steep, and footing irregular.\n\nWell, it is possible I misunderstood Ranger Edwards, but I doubt it.\nAlso it is possible that I\u2019m a better man than I thought. But that seems\nsomewhat fantastic, since I think I\u2019m practically perfect to start with.\nSo I can only deduce that Ranger Edwards, in spite of being a nice\nfellow, simply has days when he isn\u2019t all there.\n\nFor, instead of five hours, I was on top of Mt. Le Conte in two hours\nand 50 minutes. And since I had prepared myself for a terrible ordeal,\nit seemed like the shortest five and a half miles I ever walked. It was,\nin fact, smooth and nice all the way up.\n\nPoor Mr. Edwards. I guess he meant well, but he just didn\u2019t realize he\nwas talking with one of the mountain-climbingest goats this side of\nTibet.\n\n\n                             BACK TO SLEEP\n\nIn preparation for this historic stroll I awoke at 7 a.m., yawned a\ncouple of times, and went back to sleep for half an hour. Then I ate\nbreakfast, read the morning paper, got those old gray pants out of the\nback of the car and, as a final gesture, put them on.\n\nAlso I filled up the little chamois pack sack which That Girl made for\nmy gallant walk through the Rockies last year from the United States to\nCanada.\n\nI"}, {"id": "gutenberg-3126", "title": "On Horseback", "category": "Travel", "path": "texts/3126.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of On Horseback\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: On Horseback\n\nAuthor: Charles Dudley Warner\n\n\n        \nRelease date: October 10, 2004 [eBook #3126]\n                Most recently updated: January 8, 2021\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/3126\n\nCredits: Produced by David Widger\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK ON HORSEBACK ***\n\n\n\nProduced by David Widger\n\n\n\n\n\nON HORSEBACK\n\nBy Charles Dudley Warner\n\n\n\n\nI\n\n\u201cThe way to mount a horse\u201d--said the Professor.\n\n\u201cIf you have no ladder--put in the Friend of Humanity.\u201d\n\nThe Professor had ridden through the war for the Union on the right\nside, enjoying a much better view of it than if he had walked, and knew\nas much about a horse as a person ought to know for the sake of his\ncharacter. The man who can recite the tales of the Canterbury Pilgrims,\non horseback, giving the contemporary pronunciation, never missing an\naccent by reason of the trot, and at the same time witch North Carolina\nand a strip of East Tennessee with his noble horsemanship, is a kind of\nLiterary Centaur of whose double instruction any Friend of Humanity may\nbe glad to avail himself.\n\n\u201cThe way to mount a horse is to grasp the mane with the left hand\nholding the bridle-rein, put your left foot in the stirrup, with the\nright hand on the back of the saddle, and---\u201d\n\nJust then the horse stepped quickly around on his hind feet, and looked\nthe Professor in the face. The Superintendents of Affairs, who occupy\nthe flagging in front of the hotel, seated in cane-bottomed chairs\ntilted back, smiled. These useful persons appear to have a life-lease\nof this portion of the city pavement, and pretty effectually block it up\nnearly all day and evening. When a lady wishes to make her way through\nthe blockade, it is the habit of these observers of life to rise and\nmake room, touching their hats, while she picks her way through, and\ngoes down the street with a pretty consciousness of the flutter she\nhas caused. The war has not changed the Southern habit of sitting\nout-of-doors, but has added a new element of street picturesqueness in\ngroups of colored people lounging about the corners. There appears to be\nmore leisure than ever.\n\nThe scene of this little lesson in horsemanship was the old town of\nAbingdon, in southwest Virginia, on the Virginia and East Tennessee\nrailway; a town of ancient respectability, which gave birth to the\nJohnstons and Floyds and other notable people; a town, that still\npreserves the flavor of excellent tobacco and, something of the\neasy-going habits of the days of slavery, and is a sort of educational\ncenter, where the young ladies of the region add the final graces of\nintellectual life in moral philosophy and the use of the globes to their\nnatural gifts. The mansion of the late and left Floyd is now a seminary,\nand not far from it is the Stonewall Jackson Institute, in the midst\nof a grove of splendid oaks, whose stately boles and wide-spreading\nbranches give a dignity to educational life. The distinction of the\nregion is its superb oak-trees. As it was vacation in these institutions\nof learning, the travelers did not see any of the vines that\ntraditionally cling to the oak.\n\nThe Professor and the Friend of Humanity were about starting on a\njourney, across country southward, through regions about which the\npeople of Abingdon could give little useful information. If the\ntravelers had known the capacities and resources of the country, they\nwould not have started without a supply train, or the establishment\nof bases of provisions in advance. But, as the Professor remarked,\nknowledge is something that one acquires when he has no use for it. The\nhorses were saddled; the riders were equipped with flannel shirts and\nleather leggings; the saddle-bags were stuffed with clean linen, and\nnovels, and sonnets of Shakespeare, and other baggage, it would have\nbeen well if they had been stuffed with hard-tack, for in real life meat\nis more than raiment.\n\nThe hotel, in front of which there is cultivated so much of what the\nGermans call sitzfleisch, is a fair type of the majority of Southern\nhotels, and differs from the same class in the North in being left a\nlittle more to run itself. The only information we obtained about it was\nfrom its porter at the station, who replied to the question, \u201cIs it\nthe best?\u201d \u201cWe warrant you perfect satisfaction in every respect.\u201d\n This seems to be only a formula of expression, for we found that\nthe statement was highly colored. It was left to our imagination to\nconjecture how the big chambers of the old house, with their gaping\nfireplaces, might have looked when furnished and filled with gay\ncompany, and we got what satisfaction we could out of a bygone bustle\nand mint-julep hilarity. In our struggles with the porter to obtain the\nlittle items of soap, water, and towels, we were convinced that we had\narrived too late, and that for perfect satisfaction we should have been\nhere before the war. It was not always as now. In colonial days the\naccommodations and prices at inns were regulated by law. In the old\nrecords in the court-house we read that if we had been here in 1777, we\ncould have had a gallon of good rum for sixteen shillings; a quart bowl\nof rum toddy made with loaf sugar for two shillings, or with brown sugar\nfor one shilling and sixpence. In 1779 prices had risen. Good rum sold\nfor four pounds a gallon. It was ordered that a warm dinner should cost\ntwelve shillings, a cold dinner nine shillings, and a good breakfast\ntwelve shillings. But the item that pleased us most, and made us regret\nour late advent, was that for two shillings we could have had a \u201cgood\nlodging, with clean sheets.\u201d The colonists were fastidious people.\n\nAbingdon, prettily situated on rolling hills, and a couple of thousand\nfeet above the sea, with views of mountain peaks to the south, is a\ncheerful and not too exciting place for a brief sojourn, and hospitable\nand helpful to the stranger. We had dined--so much, at least, the public\nwould expect of us--with a descendant of Pocahontas; we had assisted on\nSunday morning at the dedication of a new brick Methodist church, the\nfinest edifice in the region--a dedication that took a long time, since\nthe bishop would not proceed with it until money enough was raised in\nopen meeting to pay the balance due on it: a religious act, though it\ndid give a business aspect to the place at the time; and we had been the\nlight spots in the evening service at the most aristocratic church of\ncolor. The irresponsibility of this amiable race was exhibited in the\ntardiness with which they assembled: at the appointed time nobody was\nthere except the sexton; it was three quarters of an hour before the\ncongregation began to saunter in, and the sermon was nearly over before\nthe pews were at all filled. Perhaps the sermon was not new, but it was\nfervid, and at times the able preacher roared so that articulate sounds\nwere lost in the general effect. It was precisely these passages of\ncataracts of sound and hard breathing which excited the liveliest\nresponses,--\u201cYes, Lord,\u201d and \u201cGlory to God.\u201d Most of these responses\ncame from the \u201cAmen corner.\u201d The sermon contained the usual vivid\ndescription of the last judgment--ah, and I fancied that the\ncongregation did not get the ordinary satisfaction out of it. Fashion\nhad entered the fold, and the singing was mostly executed by a choir in\nthe dusky gallery, who thinly and harshly warbled the emotional hymns.\nIt occupied the minister a long time to give out the notices of the\nweek, and there was not an evening or afternoon that had not its\nmeetings, its literary or social gathering, its picnic or fair for the\nbenefit of the church, its Dorcas society, or some occasion of religious\nsociability. The raising of funds appeared to be the burden on the\npreacher's mind. Two collections were taken up. At the first, the boxes\nappeared to get no supply except from the two white trash present. But\nthe second was more successful. After the sermon was over, an elder\ntook his place at a table within the rails, and the real business of the\nevening began. Somebody in the Amen corner struck up a tune that had\nno end, but a mighty power of setting the congregation in motion. The\nleader had a voice like the pleasant droning of a bag-pipe, and the\nfaculty of emitting a continuous note like that instrument, without\nstopping to breathe. It went on and on like a Bach fugue, winding and\nwhining its way, turning the corners of the lines of the catch without a\nbreak. The effect was soon visible in the emotional crowd: feet began\nto move in a regular cadence and voices to join in, with spurts of\nejaculation; and soon, with an air of martyrdom, the members began\nto leave their seats and pass before the table and deposit their\ncontributions. It was a cent contribution, and we found it very\ndifficult, under the contagious influence of the hum from the Amen\ncorner, not to rise and go forward and deposit a cent. If anything could\nextract the pennies from a reluctant worldling, it would be the buzzing\nof this tune. It went on and on, until the house appeared to be drained\ndry of its cash; and we inferred by the stopping of the melody that\nthe preacher's salary was secure for the time being. On inquiring,\nwe ascertained that the pecuniary flood that evening had risen to the\nheight of a dollar and sixty cents.\n\nAll was ready for the start. It should have been early in the morning,\nbut it was not; for Virginia is not only one of the blessed regions\nwhere one can get a late breakfast, but w"}, {"id": "gutenberg-59522", "title": "Biltmore House and Gardens", "category": "History", "path": "texts/59522.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of Biltmore House and Gardens\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Biltmore House and Gardens\n\nAuthor: Anonymous\n\n\n        \nRelease date: May 16, 2019 [eBook #59522]\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/59522\n\nCredits: Produced by Stephen Hutcheson, Lisa Corcoran and the Online\n        Distributed Proofreading Team at http://www.pgdp.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK BILTMORE HOUSE AND GARDENS ***\n\n\n\n\nProduced by Stephen Hutcheson, Lisa Corcoran and the Online\nDistributed Proofreading Team at http://www.pgdp.net\n\n\n\n\n\n\n\n\n\n                      _Biltmore House and Gardens_\n\n\n                            BILTMORE ESTATE\n\n                           Biltmore-Asheville\n                             North Carolina\n\n                            OPEN TO VISITORS\n\n    [Illustration: _Biltmore House From The Esplanade_]\n\n    [Illustration: Decorative capital A]\n\nApproached from the Biltmore Lodge Gate of Biltmore Estate, along a\nthree-mile drive of paved roads which wind their way through plantations\nof flowering shrubs and forests of pine, hemlock and hardwood, Biltmore\nHouse, for nearly half a century unique among the great country houses\nof America, comes into view with almost startling suddenness. A sharp\nturn through the wrought iron gates of the north entrance gives one the\nfirst view of the magnificent mansion completed by George W. Vanderbilt\nin 1895.\n\n    [Illustration: _Banquet Hall and Its Triple Fireplace_]\n\nFollowing in many details the lines of French Renaissance chateaux,\nparticularly those of Blois and Chambord, Biltmore House was designed by\nRichard M. Hunt, of New York. The landscape setting of the mansion and\nthe estate was planned by Frederick Law Olmsted, designer of Central\nPark, New York, and executed under the direction of C. D. Beadle, for\nmore than sixty years Superintendent of the Estate. By many, the great\nestate surrounding the mansion is believed to be the finest example of\nlandscape design in America.\n\nThe visitor can profitably study the exterior of the mansion before\npassing through the main portal. The structure has a frontage of 780\nfeet. The breadth of the house, from the main door to the west front, is\n150 feet. The facade rises in three distinct levels, graduated from\nportals to finials. The characteristic French peaked roof, with its\ndormer windows and lofty chimneys, relieves any tendency toward\nseverity. The walls are of hand-tooled Indiana limestone; the roof is of\nslate.\n\nBiltmore House, begun in 1890, was completed and opened in 1895 after\nfive years of intensive construction. Special railroad tracks were laid\nfrom what is now Biltmore station to the site\u2014three miles away\u2014for the\nconveyance of the great mass of construction material required. Hundreds\nof skilled artisans from various parts of this country and Europe worked\nunremittingly, while other hundreds of laborers from the mountain\nsections of North Carolina were given steady employment during the\nperiod of construction.\n\nThe visitor gains the first impression of the mansion\u2019s magnitude when\npassing through the main entrance door, flanked by sixteenth century\nlions of Italian marble, into the great hall which gives access to the\nmain rooms. The self-supporting arches surrounding the Palm Court are\nceiled with tiles especially made by the celebrated artist and\narchitect, Rafael Guastavino, while the arches and dome of the broad\ncircular stairway which spirals to the topmost floor from the left side\nof the hall are of Indiana limestone. Facing the entrance door from the\nrear of the hall is a ceremonial furnishing of Cardinal Richelieu,\nshowing the Cardinal\u2019s coat-of-arms, motto and hat; it is one of a pair,\nthe other is hung on the wall of the second-floor corridor. The grand\nstaircase, modeled after that of the Chateau Blois, winds its way around\nthe massive wrought iron chandelier which extends downward from the roof\nto the Entrance Hall ceiling, and bears a light cluster for each\nlanding.\n\nWhile visitors are free to choose their own itinerary, the tour of the\nmansion usually begins at the Court of Palms, adjoining the Entrance\nHall. This court is a sunken area, encircled with marble and, in almost\nevery season, adorned with masses of flowers from the gardens and\ngreenhouses. The central fountain is surmounted by a statue of a boy and\nswan, the work of Karl Bitter, the Austro-American sculptor. On the\nwalls are copies of the Parthenon Reliefs, now in the British Museum.\n\nFrom the Court of Palms the visitor enters the Oak Drawing Room,\npanelled in Norwegian oak. Most of the engravings hanging here are after\npaintings by Landseer. Heads of deer, buffalo, moose, and bear also\nadorn the walls. The three bronzes over the fireplace are by Barye,\nwhile on the bookcase at the left are four Chinese Celadon vases. The\nSpanish table in the center is of late eighteenth century origin, as is\nthe writing desk facing the entrance.\n\nFrom the Oak Drawing Room one enters the great Banquet Hall, one of the\nchief centers of attraction. Copied in large measure from an old Norman\nbanquet hall, this room is 72 feet long; its ceiling reaches a height of\n75 feet. At one end a triple fireplace, extending almost across the\nentire width of the room, is surmounted by a frieze by Bitter, \u201cThe\nReturn From The Chase.\u201d High above the frieze are grouped the flags of\nthe great powers of Europe at the time Columbus discovered America.\n\nThe outstanding objects of interest in the Banquet Hall are five\nsixteenth century tapestries depicting the story of Vulcan and the loves\nof Venus and Mars. It is the unconfirmed legend that these tapestries,\nwoven of silk and gold, adorned the tent of the French King, Francis I,\non the occasion of his historic meeting with Henry VIII of England on\nthe Field of the Cloth of Gold. The various figures on the tapestries,\nwhich were made in Brussels after the cartoons of the Bolognese painter,\nPrimaticcio, stand out in striking relief. Particularly does one note\nthe beauty and naturalness of the four medallions, one at each corner.\n\nOn the walls are replicas of the flags of the thirteen original states,\nand the Biltmore Estate World War service flag, with its fifty-three\nstars\u2014three of them gold\u2014hangs proudly over the center arch. At the\nopposite end of the Banquet Hall from the fireplace, sets of shelves\ndisplay brass and copper pieces of Dutch, Spanish and French origin\nwhich are attributed to artisans of the seventeenth century. The large\npipes in the organ loft above are flanked by wood carved reliefs by Karl\nBitter, depicting scenes from Wagner\u2019s operas.\n\nFrom the Banquet Hall the visitor proceeds to the Dining Room, the walls\nof which are wainscotted in red marble, surmounted by tooled Spanish\nleather; the upholstery is of Genoese velvet in red and gold. On the\nright is the fireplace by Wedgwood. Portraits of members of the\nVanderbilt family hang from the walls. In this room are displayed\nbeautiful ivory carvings and lustre-ware.\n\nIn the Print Room are rare engravings by Earlom, McArdell, Turner,\nCousins, Ward and Cole. On the center pillar of the entrance is the\nremarkable engraving, \u201cThe Executioner,\u201d by Prince Rupert, after\nSpagnoletto; underneath it is \u201cThe Virgin and Child,\u201d engraved by\nTheodore Caspara Furstenbergh, after Correggio. The large reassembled\nengraving on the left wall shows the family pedigree of Maximilian the\nGreat, by Albrecht Durer (1515); the six engravings on either side of\nthis piece are also by Durer.\n\nA Spanish cabinet of the sixteenth century is placed on the left of the\nlarge Durer engraving; on the right a Dutch cabinet of the late\nseventeenth century. On the right of the entrance, in the center of the\nend wall, is an Italian ebony dresser of the sixteen-seventeenth\ncentury; between the windows are a number of bronze busts by Meunier.\n\nAn antique that attracts much interest, especially among students of\nhistory, is found in the right hand corner of this room, near the\nentrance\u2014the chess table and set of chessmen once owned by Napoleon\nBonaparte, and used by him during the six years of his imprisonment on\nthe island of St. Helena. Tradition has it that the emperor\u2019s heart was\nplaced in the drawer of this table, after being sealed in a silver box,\nfollowing the autopsy performed by Antommarchi. Doctor O\u2019Meara, a\nphysician placed in attendance on Napoleon by the British government,\nsays in his memoirs that Lady Holland, of England, presented the famous\nCorsican with a chess table, and it is probable that this is the table\nreferred to by O\u2019Meara.\n\nFrom the Print Room visitors enter the Tapestry Gallery. Covering almost\nthe entire 90-foot length of the walls are Flemish tapestries of the\nlate fifteenth century, depicting Prudence, Faith and Charity. On the\nleft of the first fireplace is a sofa in French tapestry of Henry III\nperiod, late sixteenth century; the six tapestry chairs in the center of\nthe gallery are Louis XIV. Four chairs and the sofa under the middle\ntapestry are of Louis XIV period.\n\n    [Illustration: _In The Tapestry Gallery_]\n\n    [Illustration: _The Grand Spiral Stairway_]\n\nIn the center is a large refectory table from an old English monastery,\nprobably removed from its original setting during the reign of Henry\nVIII. Twelve Dresden china figures of the Twelve Apostles, bearing\nimprint of the Imperial Arms of Austria, are believed to have come from\na private chapel of the Hapsburgs. Over the door into the Library is a\nportrait of George W. Vanderbilt by Sargent; on the left a Sargent\nportrait"}, {"id": "gutenberg-31367", "title": "The Training of a Forester", "category": "Forestry", "path": "texts/31367.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of The Training of a Forester\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: The Training of a Forester\n\nAuthor: Gifford Pinchot\n\n\n        \nRelease date: February 23, 2010 [eBook #31367]\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/31367\n\nCredits: Produced by Tom Roch, Barbara Kosker and the Online\n        Distributed Proofreading Team at http://www.pgdp.net (This\n        file was produced from images produced by Core Historical\n        Literature in Agriculture (CHLA), Cornell University)\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK THE TRAINING OF A FORESTER ***\n\n\n\n\nProduced by Tom Roch, Barbara Kosker and the Online\nDistributed Proofreading Team at http://www.pgdp.net (This\nfile was produced from images produced by Core Historical\nLiterature in Agriculture (CHLA), Cornell University)\n\n\n\n\n\n\n\n\n\nTHE TRAINING OF A FORESTER\n\n\n\n\n[Illustration: A FOREST RANGER LOOKING FOR FIRE FROM A NATIONAL FOREST\nLOOKOUT STATION _Page 32_]\n\n\n\n\n  THE TRAINING OF A FORESTER\n\n\n\n\n  BY\n\n  GIFFORD PINCHOT\n\n\n\n\n  WITH EIGHT ILLUSTRATIONS\n\n\n\n  [Illustration]\n\n\n\n  PHILADELPHIA & LONDON\n  J. B. LIPPINCOTT COMPANY\n  1914\n\n\n\n\n  COPYRIGHT, 1914, BY J. B. LIPPINCOTT COMPANY\n\n  PUBLISHED FEBRUARY, 1914\n\n\n\n  PRINTED BY J. B. LIPPINCOTT COMPANY\n  AT THE WASHINGTON SQUARE PRESS\n  PHILADELPHIA, U. S. A.\n\n\n\n\n  To\n\n  OVERTON W. PRICE\n  FRIEND AND FELLOW WORKER\n\n  TO WHOM IS DUE, MORE THAN TO ANY OTHER MAN, THE\n  HIGH EFFICIENCY OF THE UNITED STATES FOREST SERVICE\n\n\n\n\nPREFACE\n\n\nAt one time or another, the largest question before every young man is,\n\"What shall I do with my life?\" Among the possible openings, which best\nsuits his ambition, his tastes, and his capacities? Along what line\nshall he undertake to make a successful career? The search for a life\nwork and the choice of one is surely as important business as can occupy\na boy verging into manhood. It is to help in the decision of those who\nare considering forestry as a profession that this little book has been\nwritten.\n\nTo the young man who is attracted to forestry and begins to consider it\nas a possible profession, certain questions present themselves. What is\nforestry? If he takes it up, what will his work be, and where? Does it\nin fact offer the satisfying type of outdoor life which it appears to\noffer? What chance does it present for a successful career, for a career\nof genuine usefulness, and what is the chance to make a living? Is he\nfitted for it in character, mind, and body? If so, what training does he\nneed? These questions deserve an answer.\n\nTo the men whom it really suits, forestry offers a career more\nattractive, it may be said in all fairness, than any other career\nwhatsoever. I doubt if any other profession can show a membership so\nuniformly and enthusiastically in love with the work. The men who have\ntaken it up, practised it, and left it for other work are few. But to\nthe man not fully adapted for it, forestry must be punishment, pure and\nsimple. Those who have begun the study of forestry, and then have\nlearned that it was not for them, have doubtless been more in number\nthan those who have followed it through.\n\nI urge no man to make forestry his profession, but rather to keep away\nfrom it if he can. In forestry a man is either altogether at home or\nvery much out of place. Unless he has a compelling love for the\nForester's life and the Forester's work, let him keep out of it.\n\n  G. P.\n\n\n\n\nCONTENTS\n\n\n                                                                 PAGE\n\n  WHAT IS A FOREST?                                                13\n\n  THE FORESTER'S KNOWLEDGE                                         18\n\n  THE FOREST AND THE NATION                                        19\n\n  THE FORESTER'S POINT OF VIEW                                     23\n\n  THE ESTABLISHMENT OF FORESTRY                                    27\n\n  THE WORK OF A FORESTER                                           30\n\n  THE FOREST SERVICE                                               30\n\n  THE FOREST SUPERVISOR                                            46\n\n  THE TRAINED FORESTER                                             50\n\n  PERSONAL EQUIPMENT                                               63\n\n  STATE FOREST WORK                                                84\n\n  THE FOREST SERVICE IN WASHINGTON                                 89\n\n  PRIVATE FORESTRY                                                106\n\n  FOREST SCHOOLS                                                  114\n\n  THE OPPORTUNITY                                                 116\n\n  TRAINING                                                        123\n\n\n\n\nILLUSTRATIONS\n\n\n                                                                 PAGE\n\n  A FOREST RANGER LOOKING FOR FIRE FROM A NATIONAL\n  FOREST LOOKOUT STATION                                _Frontispiece_\n\n  STRINGING A FOREST TELEPHONE LINE                                32\n\n  FOREST RANGERS SCALING TIMBER                                    43\n\n  WESTERN YELLOW PINE SEED COLLECTED BY THE FOREST\n  SERVICE FOR PLANTING UP DENUDED LANDS                            47\n\n  A FOREST EXAMINER RUNNING A COMPASS LINE                         59\n\n  BRUSH PILING IN A NATIONAL FOREST TIMBER SALE                    95\n\n  FOREST RANGERS GETTING INSTRUCTION IN METHODS OF\n  WORK FROM A DISTRICT FOREST OFFICER                             105\n\n  FOREST SERVICE MEN MAKING FRESH MEASUREMENTS IN\n  THE MISSOURI SWAMPS                                             136\n\n\n\n\nTHE TRAINING OF A FORESTER\n\n\n\n\nWHAT IS A FOREST?\n\n\nFirst, What is forestry? Forestry is the knowledge of the forest. In\nparticular, it is the art of handling the forest so that it will render\nwhatever service is required of it without being impoverished or\ndestroyed. For example, a forest may be handled so as to produce saw\nlogs, telegraph poles, barrel hoops, firewood, tan bark, or turpentine.\nThe main purpose of its treatment may be to prevent the washing of soil,\nto regulate the flow of streams, to support cattle or sheep, or it may\nbe handled so as to supply a wide range and combination of uses.\nForestry is the art of producing from the forest whatever it can yield\nfor the service of man.\n\nBefore we can understand forestry, certain facts about the forest itself\nmust be kept in mind. A forest is not a mere collection of individual\ntrees, just as a city is not a mere collection of unrelated men and\nwomen, or a Nation like ours merely a certain number of independent\nracial groups. A forest, like a city, is a complex community with a life\nof its own. It has a soil and an atmosphere of its own, chemically and\nphysically different from any other, with plants and shrubs as well as\ntrees which are peculiar to it. It has a resident population of insects\nand higher animals entirely distinct from that outside. Most important\nof all, from the Forester's point of view, the members of the forest\nlive in an exact and intricate system of competition and mutual\nassistance, of help or harm, which extends to all the inhabitants of\nthis complicated city of trees.\n\nThe trees in a forest are all helped by mutually protecting each other\nagainst high winds, and by producing a richer and moister soil than\nwould be possible if the trees stood singly and apart. They compete\namong themselves by their roots for moisture in the soil, and for light\nand space by the growth of their crowns in height and breadth. Perhaps\nthe strongest weapon which trees have against each other is growth in\nheight. In certain species intolerant of shade, the tree which is\novertopped has lost the race for good. The number of young trees which\ndestroy each other in this fierce struggle for existence is prodigious,\nso that often a few score per acre are all that survive to middle or old\nage out of many tens of thousands of seedlings which entered the race of\nlife on approximately even terms.\n\nNot only has a forest a character of its own, which arises from the fact\nthat it is a community of trees, but each species of tree has peculiar\ncharacteristics and habits also. Just as in New York City, for example,\nthe French, the Germans, the Italians, the Hungarians, and the Chinese\neach have quarters of their own, and in those quarters live in\naccordance with habits which distinguish each race from all the others,\nso the different species of pines and hemlocks, oaks and maples prefer\nand are found in certain definite types of locality, and live in\naccordance with definite racial habits which are as general and\nunfailing as the racial characteristics which distinguish, for example,\nthe Italians from the Germans, or the Swedes from the Chinese.\n\nThe most important of these characteristics of race or species are those\nwhich are concerned with the relation of each to light, heat, and\nmoisture. Thus, a river birch will die if it has only as much water as\nwill suffice to keep a post oak in the best condition, and the warm\nclimate in which the balsam fir would perish is just suited to the\nrequirements of a long leaf pine or a magnolia.\n\nThe tolerance of a tree for shade may vary greatly at different times of\nits life, but a white pine always requires more light than a hemlock,\nand a beech throughout its life will flourish with less sunshine or\nreflected light than, for example, an oak or a tulip tree.\n\nTrees are limited in their distribution also by their adaptability, in\nwhich they vary greatly. Thus a bald cypress will grow both in wetter\nand in dryer land than an oak; a red cedar will flourish from Florida to\nthe Canadian line, while other species, like t"}, {"id": "gutenberg-72365", "title": "At Home in the Smokies", "category": "History", "path": "texts/72365.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of At home in the Smokies\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: At home in the Smokies\n        a history handbook for Great Smoky Mountains National Park, North Carolina and Tennessee\n\nCreator: United States. National Park Service\n\nAuthor: Wilma Dykeman\n        James Stokely\n\n\n        \nRelease date: December 10, 2023 [eBook #72365]\n\nLanguage: English\n\nOriginal publication: Washington DC: National Park Service, 1984\n\nOther information and formats: www.gutenberg.org/ebooks/72365\n\nCredits: Carla Foust, Steve Mattern, Thiers Halliwell and the Online Distributed Proofreading Team at https://www.pgdp.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK AT HOME IN THE SMOKIES ***\n\n\n\n[Illustration:\n\n  At Home\n  In the Smokies\n]\n\n\n\n\nHandbook 125\n\n\n\n\n  At Home\n  In the Smokies\n\n  A History Handbook for\n  Great Smoky Mountains National Park\n  North Carolina and Tennessee\n\n  Produced by the\n  Division of Publications\n  National Park Service\n\n  U.S. Department of the Interior\n  Washington, D.C. 1984\n\n\n\n\n_Using This Handbook_\n\n\nThis theme handbook, published in this new edition on the 50th\nanniversary of Great Smoky Mountains National Park, tells the story of\nthe people who settled and lived in the mountains along the Tennessee\nand North Carolina border. Part 1 gives a brief introduction to the\npark and its historical sites. In Part 2, Wilma Dykeman and Jim Stokely\npresent the history of the region from the early Cherokee days to\nthe establishment of the park in 1934 and the renewed interest in\nthe past in the 1970s; this text was first published by the National\nPark Service in 1978. Part 3 gives a brief description of the major\nhistorical buildings you can see in the park. For general information\nabout the park and its wildlife, see Handbook 112.\n\n\nNational Park Handbooks, compact introductions to the great natural\nand historic places administered by the National Park Service, are\npublished to support the National Park Service\u2019s management programs at\nthe parks and to promote understanding and enjoyment of the parks. This\nis Handbook 125.\n\n\n_Library of Congress Cataloging in Publication Data_\n\nMain entry under title: At home in the Smokies. (National park\nhandbook; 125)\n\nRev. ed. of: Highland homeland/Wilma Dykeman and Jim Stokely. 1978.\nIncludes index.\n\nSupt. of Docs, no.: I 29.9/5:125\n\n1. Great Smoky Mountains (N.C. and Tenn.)--Social life and customs.\n2. Great Smoky Mountains (N.C. and Tenn.)--History. 3. Great Smoky\nMountains National Park (N.C. and Tenn.)--Guide-books. 4. Cherokee\nIndians--History.\n\nI. Dykeman, Wilma. Highland homeland. II. United States. National\nPark Service. Division of Publications. III. Series: Handbook (United\nStates. National Park Service. Division of Publications); 125.\n\n  F443.G7A8      1984      976.8\u201989      84-600108\n\nISBN 0-912627-22-0\n\n\n\n\n  =Part 1=      =Recapturing the Past=                  =4=\n                Smoky Mountain Heritage                  7\n\n  =Part 2=      =Highland Homeland=                    =12=\n                _By Wilma Dykeman and Jim Stokely_\n\n                Homecoming                              17\n                  _Rail Fences_                         30\n                Land of the Cherokees                   35\n                The Pioneers Arrive                     49\n                  _Rifle Making_                        60\n                A Band of Cherokees Holds On            63\n                From Pioneer to Mountaineer             73\n                  _Spinning and Weaving_                94\n                The Sawmills Move In                    97\n                Birth of a Park                        107\n                The Past Becomes Present               121\n                  _Handicrafts_                        132\n                Coming Home                            137\n\n  =Part 3=      =Guide and Adviser=                   =146=\n                Traveling in the Smokies               148\n                Oconaluftee                            150\n                Cades Cove                             152\n                Other Historic Sites in the Park       154\n                Related Nearby Sites                   156\n                Armchair Explorations                  157\n\n                Index          158\n\n\n\n\n[Illustration:\n\n  Part 1\n\n  Recapturing the Past\n]\n\n[Illustration:\n\n  Joseph S. Hall\n\n _Aden Carver of Oconaluftee was a carpenter, stone mason, millwright,\n deacon, and preacher. He was more versatile than some men but\n representative of many who worked hard and enjoyed their lives in the\n Smokies._\n]\n\n\n\n\nSmoky Mountain Heritage\n\n\nSeemingly endless ridges, forests, mountain streams, waterfalls, and\nwildlife attract hundreds of thousands of travelers each year to Great\nSmoky Mountains National Park on the Tennessee-North Carolina border.\nMany are drawn by a long procession of wildflowers and shrubs bursting\ninto bloom in the spring and by the colorful foliage of the hardwoods\nin the fall. Thousands hike the park\u2019s many trails, which range from\nshort spurs to the 110 kilometers (70 miles) of the Appalachian Trail\nthat runs through the park. Also attracting wide interest are the\npark\u2019s historical sites and the lifeways of the mountain people. They\nare pleasant surprises in the midst of all of nature\u2019s richness. They\nare physical ties with our ancestors, many of whom traveled from\ntheir homelands across the sea to build new homes in the relatively\nunexplored continent of North America.\n\nThe National Park Service has preserved some of the historic\nstructures in Great Smoky Mountains National Park so that we, and\nfuture generations, can better understand how our forefathers lived.\nBy walking through and closely examining their finely crafted--and\ncrudely crafted--log houses, barns, and other farm buildings we gain\na new respect for their diligence and perseverance. The hours spent\nhewing massive beams, preserving foods for winter use, and making\nclothes from scratch are nearly incomprehensible in our age of machines\nand computers. The mountainous terrain demanded hard work, and the\nisolation fostered a zealous independence. The land truly molded a\nresourcefulness and hardiness in the Smokies character.\n\nThe story of these mountain people and communities is told in Part 2\nof this handbook by Wilma Dykeman and Jim Stokely, who can look out on\nthe expanse of the Great Smokies from their family home in Newport,\nTennessee. Their engaging story of the Smokies is illustrated with\nhistoric photographs that largely come from the park\u2019s files. Although\nthe identities of many of the photographers are unknown (see page 160),\nwe are no less indebted to them. They have helped to preserve the\nhistory and folkways of the Great Smokies people, who played a part in\nmolding and defining our national character.\n\n[Illustration]\n\n[Illustration]\n\n[Illustration:\n\n  Charles S. Grossman\n\n _In the old days, housekeeping in the Smokies allowed few if any\n frills. Aunt Rhodie Abbott, and most other women, worked as hard as\n any man as they went about their daily chores keeping their families\n fed and clothed._\n]\n\n\n\n\n[Illustration:\n\n  Part 2\n\n  Highland Homeland\n]\n\n[Illustration]\n\n[Illustration:\n\n _A home in the Smokies usually meant a simple log house nestled in the\n hills among the trees and amidst the haze._\n\n  National Park Service\n]\n\n\n\n\nHomecoming\n\n\nIt is summer now, a time for coming home. And on an August Sunday in\nthe mountain-green valley they call Cataloochee, the kinfolk arrive.\nThey come from 50 states to gather here, at a one-room white frame\nMethodist church by the banks of the Big \u201cCatalooch.\u201d The appearance of\ntheir shiny cars and bulky campers rolling along the paved Park Service\nroad suggests that they are tourists, too, a tiny part of the millions\nwho visit and enjoy the Great Smoky Mountains each year. Yet these\nparticular families represent something more. A few of them were raised\nhere; their ancestors lived and died here.\n\nThey are celebrating their annual Cataloochee homecoming. Other\nreunions, held on Sundays throughout the summer, bring together\none-time residents of almost every area in the park. Some of the places\ninstantly recall bits of history: Greenbrier, once a heavily populated\ncove and political nerve-center; Elkmont, where a blacksmith named\nHuskey set out one winter to cross the Smokies and was discovered\ndead in a bear trap the next spring; and Smokemont on the beautiful\nOconaluftee River, at one time the home of the Middle Cherokee and the\nvery heart of that Indian Nation.\n\nThese are special days, but they observe a universal experience as\nold as Homer\u2019s Ulysses, as new as the astronauts\u2019 return from the\nmoon: homecoming. It is an experience particularly significant in the\nGreat Smoky Mountains National Park. Here, at different times and in\ndifferent ways, people of various races and heritage have reluctantly\ngiven up hearth and farm so that today new generations can come to this\ngreen kingdom of some 209,000 hectares (517,000 acres) and rediscover a\nnatural homeland which is the heritage of all.\n\nBeginning on Canada\u2019s Gasp\u00e9 Peninsula as a limestone finger only 2.5\nkilometers (1.5 miles) wide, the Appalachian mountain system that\ndominates eastern America slants about 5,000 kilometers (3,000 miles)\nsouthwest across New England and the Atlantic and border states\ninto northern Georgia and Alabama, culminating in the grandeur and\ncomplexity of the Great Smoky Mountains. This range, which marks the\ndividing line between Tennessee and North Carolina, is high; its\n58-kilometer (36-mile) crest rema"}, {"id": "gutenberg-45634", "title": "Myths of the Cherokee", "category": "Cherokee", "path": "texts/45634.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of Myths of the Cherokee\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Myths of the Cherokee\n\nAuthor: James Mooney\n\n\n        \nRelease date: May 11, 2014 [eBook #45634]\n                Most recently updated: October 24, 2024\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/45634\n\nCredits: Produced by Jeroen Hellingman and the Online Distributed\n        Proofreading Team at http://www.pgdp.net/ fo         const searchInput = document.getElementById('searchInput');
        const tabs = document.querySelectorAll('.tab');
        const cardGrid = document.getElementById('cardGrid');

        let currentCategory = 'ALL';
        let searchQuery = '';

        function setFontSize(size) {
            document.documentElement.style.setProperty('--base-font-size', size);
            localStorage.setItem('appalachian_font_size', size);
        }

        const savedFontSize = localStorage.getItem('appalachian_font_size');
        if (savedFontSize) { setFontSize(savedFontSize); }

        function renderCards() {
            cardGrid.innerHTML = '';
            searchData.forEach(item => {
                const matchesCategory = (currentCategory === 'ALL' || item.category === currentCategory);
                let matchesSearch = !searchQuery || item.title.toLowerCase().includes(searchQuery) || (item.content && item.content.toLowerCase().includes(searchQuery));

                if (matchesSearch && matchesCategory) {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = item.path;

                    let badgeClass = 'badge-text';
                    let linkText = '📖 Open Document Viewer →';
                    if (item.type === 'PDF') {
                        badgeClass = 'badge-pdf';
                        linkText = '📄 Open Zero-Distortion Vertical PDF →';
                    } else if (item.type === 'AUDIO') {
                        badgeClass = 'badge-audio';
                        linkText = '🎵 Play Offline Audio (WAV) →';
                    }

                    let coverHTML = item.cover ? `<img data-cover-src="${item.cover}" class="card-cover" alt="Cover" loading="lazy" decoding="async">` : '';

                    card.innerHTML = `
                        <div>
                            ${coverHTML}
                            <div class="card-title">${item.title}</div>
                            <div style="margin-top: 0.5rem; color: var(--accent); font-weight: 600; font-size: 0.85rem;">${linkText}</div>
                        </div>
                        <div class="card-meta">
                            <span>Category: ${item.category}</span>
                            <span class="badge ${badgeClass}">${item.type}</span>
                        </div>
                    `;
                    cardGrid.appendChild(card);
                    card.querySelectorAll('img[data-cover-src]').forEach(img => { img.src = img.getAttribute('data-cover-src'); img.removeAttribute('data-cover-src'); });
                }
            });
        }

        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); renderCards(); });
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.getAttribute('data-category');
                renderCards();
            });
        });
        renderCards();
    </script>

<script>
    (function() {
        let lastScrollTop = 0;
        window.addEventListener("scroll", function() {
            let st = window.pageYOffset || document.documentElement.scrollTop;
            let header = document.querySelector("header");
            if (!header) header = document.querySelector(".header");
            if (header) {
                if (st > lastScrollTop && st > 60) {
                    header.style.transform = "translateY(-100%)";
                } else {
                    header.style.transform = "translateY(0)";
                }
            }
            lastScrollTop = st <= 0 ? 0 : st;
        });
        
        // Fix PDF and Link zimcheck bypasses
        document.querySelectorAll('object[data-pdf-src]').forEach(el => el.data = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('embed[data-pdf-src]').forEach(el => el.src = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('iframe[data-pdf-src]').forEach(el => el.src = el.getAttribute('data-pdf-src'));
        document.querySelectorAll('a[data-href]').forEach(el => el.href = el.getAttribute('data-href'));
    })();
</script>
