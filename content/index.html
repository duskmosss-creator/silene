ark Handbooks, compact introductions to the great natural and\nhistoric places administered by the National Park Service, are designed\nto promote understanding and enjoyment of the parks. Each is intended to\nbe informative reading and a useful guide before, during, and after a\npark visit. More than 100 titles are in print. This is Handbook 112. You\nmay purchase the handbooks through the mail by writing to Superintendent\nof Documents, U.S. Government Printing Office, Washington, DC 20402.\n\n\n                            About This Book\n\nGreat Smoky Mountains National Park straddles the North\nCarolina-Tennessee border and encompasses the climax of the Appalachian\nMountain System. Major attractions are the mountains themselves, the\npreserved structures and lore of mountain folklife, stupendous displays\nof flowering plants and shrubs, fall colors, wild animals, superb hiking\nopportunities, and gorgeous rivers, streams, and waterfalls. This\nhandbook is published in support of the National Park Service's\nmanagement policies and interpretive programs at the park. Part 1 gives\na brief introduction to what you may find in a leisurely visit to the\npark; Part 2 outlines the natural history of the mountains and their\nvalleys; and Part 3 presents concise travel guide and reference\nmaterials.\n\n\n           Library of Congress Cataloging in Publication Data\n\n\n  United States. National Park Service.\n  Great Smoky Mountains National Park, North Carolina and Tennessee.\n  (National park handbook; 112)\n  Includes index.\n  1. Great Smoky Mountains National Park (N.C. and Tenn.)\n    I. Title.\n    II. Series: Handbook (United States. National Park Service. Division\n          of Publications); 112.\n  F443.G7U63 1981    976.8'89    81-11320    AACR2\n\n\n                                Contents\n\n  Part 1 Welcome to the Great Smokies                                   4\n      The Appalachians at Their Best                                    7\n  Part 2 The Nature of Things in the Highlands                         22\n      _By Napier Shelton_\n      A One-day Walk to Maine                                          25\n      The Trout's World                                                39\n      The Evolution of Abundance                                       53\n      Bears, Boars and Acorns                                          67\n      The Tracks of Our Predecessors                                   79\n  Part 3 Guide and Adviser                                             98\n      Topical Reference                                               101\n      Going to the Great Smokies                                      101\n      Park Map                                                        102\n      Visitor Centers                                                 104\n      The Smokies by Car                                              107\n      Wildflowers and Fall Colors                                     110\n      Activities                                                      112\n      Hiking and Backpacking                                          114\n      Accommodations                                                  118\n      For Your Safety                                                 120\n      Nearby Attractions                                              122\n      Books to Read                                                   125\n      Index                                                           126\n\n\n\n\n                   1    Welcome to the Great Smokies\n\n\n    [Illustration: _A rustic Cades Cove cabin preserves the spirit of\n    pioneer life and times._]\n\n    [Illustration: _Here in the East's wettest corner, winter snows\n    release moisture slowly into the ground until spring thaw swells\n    streams to rush downslope. The ultimate destination? The Gulf of\n    Mexico._]\n\n\n                     The Appalachians at Their Best\n\nAt first glimpse there appear to be two Smokies: the mountains' wild\nnature, and the folk life. The mind calls up both the sweeping mountain\nvistas whose peaks succeed peaks to the far horizon and the rustic\ncabins and barns set off with the split rail fences of 19th-century\nmountain life. The mountains are everywhere, punctuated by restored\nsettlements, by Cades Cove, Mingus Mill, Cataloochee, and Little\nGreenbrier. But this is not the full story for there are many, many\nGreat Smokies, a double fistful of which may be just for you. There are\nas many Great Smokies as there are people who come here intent on\ndiscovering their secrets: the folklorist's and amateur historian's\nSmokies; the trout angler's Smokies; the Smokies of the backpacker,\nday-tripper, and trail walker; the botanist's, ecologist's, and birder's\nSmokies; and the automobile tourist's Smokies. Take your pick.\n\nYou can walk into the Smokies, into the heart of the wilderness. You can\ndrive through the Smokies, through the jewels in the crown of the\nAppalachian highlands. You can enter them through North Carolina or\nthrough Tennessee. But you can also enter them through any strong\ninterest _you_ may have, for there are as many Smokies as there are ways\nyou can see them. And one good way to see them is through the eyes of a\nnative son whose love for these mountains is exceeded only by his love\nfor people. Such is Glenn Cardwell.\n\nGlenn Cardwell took his aging mother and father down to the Noah \"Bud\"\nOgle cabin just after the National Park Service finished restoring it.\nGlenn works for the park and would conduct nature walks at the cabin, so\nhe wanted to see what his folks would say. They used to live nearby and\nhis mother's Aunt Cindy and her husband, Noah, built the cabin just off\nCherokee Orchard Road out of Gatlinburg.\n\n\"Well I'll tell you,\" Glenn said, \"my mother got to reminiscing not one\nstep off the parking lot and stopped at every rock and spot in the yard\nand told a tale. It must've taken the better part of an hour just to get\nher through the yard and down to the porch.\"\n\nGlenn's mother took one look at the porch and said, \"They put the step\n[a big flat rock] in the wrong place.\" And so the restoration team had\n... but it was another rock that bothered Mrs. Cardwell most.\n\nWalking back to the car she stopped dead in her tracks and said\ndespairingly, \"What have they _done_ to Cindy's rock?\"\n\nGlenn had no idea what she meant although he could see the road cut\nclose to a big boulder. The road had been relocated but Glenn recalled\nnothing unusual about the rock.\n\nHis mother, still staring, repeated her question. Glenn's father\nshrugged, \"Looks to me like somebody blowed hell out of it.\"\n\n\"I still couldn't figure out what was bothering my mother,\" Glenn said.\n\nBut now, in the 1980s, he will tell you that everyone in the Smokies had\nscaffolds in their yards back in Aunt Cindy's day for drying fruits and\nvegetables for winter storage. Everyone, that is, but Aunt Cindy. She\nused the big boulder across from their cabin, or what used to be the\nflat part of it. Many's the time Glenn's mother, as a little girl,\nhelped Aunt Cindy spread produce to sun dry on the rock.\n\nGlenn Cardwell is an affable walking encyclopedia of Smokies life at the\ntime the Smokies changed from a piece of Tennessee and North Carolina\nreal estate into our second national park in the East. Stories such as\nGlenn's--and there are many--supply a compelling human resonance to this\nwilderness land. Glenn's enthusiasm is a bit unusual, because his father\nwas bought out _twice_ by the Federal government as lands were being\nacquired for the park. And each buy-out meant an unplanned relocation\nfor the family, moving and building anew.\n\n\"I think if my mother hadn't had me on the way at the time of the first\nbuy-out,\" Glenn said, \"my father would have pulled up stakes and gone\nback to Cumberland, Virginia, like many, many of our other relatives\ndid.\" But the Cardwells stayed on near the park and Glenn embodies a\ntransition, bridging new and old ways of doing and seeing things here.\nHis father was bitter at first, but when he visited the Noah \"Bud\" Ogle\nCabin years later he admitted he was glad the park had come along so\nthat some things remained unchanged. It was nice, he said, that he and\nothers could still see the land as it had been.\n\nThe Great Smokies represented a new di"}, {"id": "gutenberg-71447", "title": "Great Smoky Mountains National Park: Open All Year", "category": "History", "path": "texts/71447.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of Great Smoky Mountains National Park\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Great Smoky Mountains National Park\n        Tennessee--North Carolina, open all year\n\nCreator: United States. National Park Service\n\n\n        \nRelease date: August 19, 2023 [eBook #71447]\n\nLanguage: English\n\nOriginal publication: Washington DC: U. S. Government Printing Office, 1954\n\nOther information and formats: www.gutenberg.org/ebooks/71447\n\nCredits: Bob Taylor, Lisa Corcoran, Stephen Hutcheson and the Online Distributed Proofreading Team at https://www.pgdp.net\n\n\n*** START OF THE PROJECT GUTENBERG EBOOK GREAT SMOKY MOUNTAINS NATIONAL PARK ***\n\n\n\n\n\n  Transcriber\u2019s Note\n  Italic text displayed as: _italic_\n  Bold text displayed as: =bold=\n\n\n\n\n  Great Smoky\n  Mountains\n  NATIONAL PARK\n\n  TENNESSEE\u2014NORTH CAROLINA\n  OPEN ALL YEAR\n\n  [Illustration: stream in woods]\n\n  UNITED STATES DEPARTMENT OF THE\n  INTERIOR \u00b7 Douglas McKay, _Secretary_\n  NATIONAL PARK SERVICE \u00b7 Conrad L. Wirth, _Director_\n\n\n\n\n  Great Smoky\n  Mountains\n  NATIONAL PARK\n\n  The National Park System, of which this park is a unit, is\n  dedicated to conserving the scenic, scientific, and historic\n  heritage of the United States for the benefit and enjoyment of its\n  people.\n\n\nGreat Smoky Mountains National Park is located on the crest of the\nhigh divide which forms the boundary between Tennessee and North\nCarolina. This mountain range, representing one of the oldest uplands\non earth, zigzags through the park from northeast to southwest for 71\nmiles, or 54 miles by air line. For 36 miles along its main crest the\nrange maintains an altitude in excess of 5,000 feet. Sixteen of its\npeaks rise more than 6,000 feet. The deep blue haze rising from the\nvalleys to the summits of the lofty peaks gives these mountains their\nname.\n\n[Illustration: _View from Heintooga Overlook._]\n\nRenowned for its splendid forests and containing a rich variety\nof plant life, the Great Smokies region has long been regarded by\nprominent botanists as the cradle of the present vegetation of\neastern America.\n\nArnold Guyot, eminent scientist whose exploration of the Appalachian\nSystem began a century ago, was the first to describe the Great Smoky\nMountains from personal observation. He wrote:\n\n\u201cAlthough the high peaks of the Smoky mountains are some fifty feet\nlower than the isolated and almost exceptional group of the Black\nmountains, by their number, their magnitude, the continuity and\ngeneral elevation of the chains, and of the base upon which they\nrepose, they are like a massive and high citadel which is really the\nculminating region of all the Appalachian System.\u201d\n\n\n\n\nHistory of the Park\n\n\nPrior to the start of the 20th century, the area now comprising\nthe park was little known to the outside world, although DeSoto is\nbelieved to have viewed the mountains. They were, and still are, the\nhome of the Cherokees who now occupy the Cherokee Indian Reservation\nin North Carolina, adjacent to the park on the south. The few white\nsettlers were the rugged mountaineer descendants of colonists from\nEngland and Scotland who lived isolated and primitive lives. The\nGreat Smokies region became better known during and subsequent to\nWorld War I when logging railroads of lumber companies penetrated\nsome of its virgin forests. Still later, highways skirted the area\nand visitors were able to view its majestic peaks from a distance.\n\nThe successful movement for the creation of a national park in this\narea was begun in 1923, and its establishment was authorized by\nthe Federal Government by act of Congress approved May 22, 1926.\nEnabling acts were passed by the State legislatures of North Carolina\nand Tennessee in 1927, and land acquisition was begun with State\nfunds, matched by a generous donation made by John D. Rockefeller,\nJr., through the Laura Spelman Rockefeller Memorial, in honor of\nhis mother. Subsequently, Federal funds were made available for the\ncompletion of the project.\n\nOn February 6, 1930, the Governors of North Carolina and Tennessee\npresented the Secretary of the Interior with deeds to an initial\n158,876 acres of land on behalf of their respective States. A limited\npark was thus established for administration and protection. The\npark, now containing 507,168 acres of Federal lands, was formally\ndedicated on September 2, 1946.\n\n\n\n\nPioneer Culture in the Great Smokies\n\n\nGreat Smoky Mountains National Park presents an opportunity to\npreserve frontier conditions of a century ago. The cultural and human\ninterest aspects of this park are exceeded only by its scenery and\nnatural history.\n\nIn places where the forest has not yet encroached upon them, there\nare clearings which were the sloping little farms of the mountain\npioneers. Sturdy log structures in varying stages of disintegration\nremain there as evidence of a way of life which has practically\ndisappeared in eastern United States. Some of these log cabins,\nbarns, and other buildings have been rehabilitated in place so that\nyou may see the original structures in their true setting. Most of\nthem are in Cades Cove, where the park\u2019s only grist mill powered by\nan overshot wheel is located. Cades Cove, an isolated, oval-shaped\nvalley surrounded by mountains, is a region of outstanding pastoral\ncharm which you should visit.\n\nSome of the finest of various types of authentic pioneer structures\nhave been assembled in the immediate vicinity of the Oconaluftee\nRanger Station and Pioneer Museum, located on the cross-mountain\nhighway about 2 miles north of Cherokee, N. C. On display in the\nmuseum are tools, household objects, and a variety of other handmade\nitems which were used by the pioneers who made their homes on lands\nwhich now comprise the park. This building is open from 9 a. m. to 5\np. m., April through October.\n\n\n\n\nThe Cherokee Indian Reservation\n\n\nYou will be interested in the Cherokee Indians on the Cherokee\nReservation, which is immediately south of the park. Although the\nGovernment has instituted here a comprehensive system of education\nand modern methods of living, ancient ceremonies and sports are\npreserved as tribal customs.\n\n[Illustration:\n\n  THOMPSON PHOTO\n\n_Rhododendron along the trail to Mount Le Conte._]\n\n\n\n\nForests\n\n\nCrowning the highest peaks with spruce and fir and carpeting the\nmountainsides with a wealth of deciduous trees is an unbroken\nforest cover, which cannot be matched in eastern America. In all of\nEurope there are not as many species of native trees as are to be\nfound in Great Smoky Mountains National Park. A number of these,\nsuch as Canada hemlock, silverbell, red spruce, yellow buckeye, and\nmountain-ash grow to record size, while others become giants of their\nkind. Approximately 40 percent of the more than half-million acres\nwhich comprise the park are in the original forested condition. A\ntotal of 130 native tree species are known to grow in this area.\n\n\n\n\nOther Plant Life\n\n\nFew, if any, areas in the eastern United States possess so great a\nvariety of plants. Altogether, the tree, shrub, and herb varieties\ntotal more than 1,300. Botanists have also listed over 1,800 species\nof fungi, 330 mosses and liverworts, and 230 lichens. The earliest\nflowers occasionally appear by the close of February in lowland\nareas, while the witchhazel, latest to bloom, may hold its blossoms\ninto December. Late April finds the spring flowers, including the\nabundant dogwood, at their blossoming peak; May is best for the\nmountain laurel; middle June usually finds both the flame azalea and\nrose-purple rhododendron at their finest; middle July is likely to be\nthe peak of the great white rhododendron\u2019s flowering. Autumn colors\nare excellent throughout October, with the height of coloration near\nthe end of the month.\n\n\n\n\nA Wildlife Sanctuary\n\n\nHere, as in all national parks, wildlife is given complete\nprotection. No hunting or trapping is permitted. Since establishment\nof the park, the black bear population has increased considerably, and\nsuch animals as the white-tailed deer, red and gray foxes, raccoon,\nbobcat, wild turkey, ruffed grouse, and others find sanctuary in\nthese mountains. More than 52 species of fur-bearing animals, some\n200 birds, 36 reptiles, 37 amphibians, and 80 fishes are known to\nlive here.\n\n=The feeding, touching, teasing, or molesting of bears is\nprohibited.= This regulation is enforced strictly for the protection\nof the public. Persons using park trails have nothing to fear from\nunmolested bears. If tempted by food, however, some bears, which\nfrequent sections of the motor road, become dangerous. They should\nnot be fed or approached. Persons using the Appalachian Trail\nshelters can protect their food supplies by suspending them from tree\nlimbs outside the shelter.\n\n\n\n\nFishing\n\n\nApproximately 600 miles of streams, many of them well suited to\ntrout, flow down the slopes of the Great Smoky Mountains. Each year\nthousands of hatchery-reared trout are released in the more heavily\nfished waters. Rainbow and brook trout and small-mouth bass lure the\ndevotees of Izaak Walton. Persons fishing in park waters must have\nthe State or county license issued and required by North Carolina, or\nthe State license issued and required by Tennessee, depending upon\nthe section of the park being fished. Catches are regulated, and some\nstreams may be found closed for restocking. The fishing season is\nfrom May 16 to August 31. Current regulations may be obtained from\nthe office of the superintendent or from park rangers or wardens.\n\n\n\n\nInterpretive Service\n\n\nBeginning in May and continuing for 6 months, a program of\nnaturalist-guided "}, {"id": "gutenberg-31709", "title": "Our Southern Highlanders", "category": "Culture", "path": "texts/31709.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of Our Southern Highlanders\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.gutenberg.org. If you are not located in the United States,\nyou will have to check the laws of the country where you are located\nbefore using this eBook.\n\nTitle: Our Southern Highlanders\n\nAuthor: Horace Kephart\n\n\n        \nRelease date: March 20, 2010 [eBook #31709]\n\nLanguage: English\n\nOther information and formats: www.gutenberg.org/ebooks/31709\n\nCredits: Produced by David Garcia, Stephanie Eason, and the Online\n        Distributed Proofreading Team at http://www.pgdp.net. (This\n        file was produced from images generously made 240\n\nA bee-gum                                               248\n\nLet the women do the work                               264\n\n\"Till the sky-line blends with the sky itself\"          288\n\nWhitewater Falls                                        312\n\nThe road follows the creek--there may be a dozen\nfords in a mile                                         320\n\n\"Dense forest and luxuriant undergrowth\"                336\n\n\n\n\n[Illustration: APPALACHIA\n\nThe wavy black line shows the outer boundaries of Southern Appalachian\nRegion. The shaded portion shows the chief areas covered by high\nmountains, 3,000 to 6,700 feet above sea-level.]\n\n\n\n\nOUR SOUTHERN HIGHLANDERS\n\n\n\n\nOUR SOUTHERN HIGHLANDERS\n\n\nCHAPTER I\n\n\"SOMETHING HIDDEN; GO AND FIND IT\"\n\n\nIn one of Poe's minor tales, written in 1845, there is a vague allusion\nto wild mountains in western Virginia \"tenanted by fierce and uncouth\nraces of men.\" This, so far as I know, was the first reference in\nliterature to our Southern mountaineers, and it stood as their only\ncharacterization until Miss Murfree (\"Charles Egbert Craddock\") began\nher stories of the Cumberland hills.\n\nTime and retouching have done little to soften our Highlander's\nportrait. Among reading people generally, South as well as North, to\nname him is to conjure up a tall, slouching figure in homespun, who\ncarries a rifle as habitually as he does his hat, and who may tilt its\nmuzzle toward a stranger before addressing him, the form of salutation\nbeing:\n\n\"Stop thar! Whut's you-unses name? Whar's you-uns a-goin' ter?\"\n\nLet us admit that there is just enough truth in this caricature to give\nit a point that will stick. Our typical mountaineer is lank, he is\nalways unkempt, he is fond of toting a gun on his shoulder, and his\ncuriosity about a stranger's name and business is promptly, though\npolitely, outspoken. For the rest, he is a man of mystery. The great\nworld outside his mountains knows almost as little about him as he does\nof it; and that is little indeed. News in order to reach him must be of\nsuch widespread interest as fairly to fall from heaven; correspondingly,\nscarce any incidents of mountain life will leak out unless they be of\nsensational nature, such as the shooting of a revenue officer in\nCarolina, the massacre of a Virginia court, or the outbreak of another\nfeud in \"bloody Breathitt.\" And so, from the grim sameness of such\nreports, the world infers that battle, murder, and sudden death are\ncommonplaces in Appalachia.\n\nTo be sure, in Miss Murfree's novels, as in those of John Fox, Jr., and\nof Alice MacGowan, we do meet characters more genial than feudists and\nillicit distillers; none the less, when we have closed the book, who is\nit that stands out clearest as type and pattern of the mountaineer? Is\nit not he of the long rifle and peremptory challenge? And whether this\nbe because he gets most of the limelight, or because we have a furtive\nliking for that sort of thing (on paper), or whether the armed outlaw be\nindeed a genuine protagonist--in any case, the Appalachian people remain\nin public estimation to-day, as Poe judged them, an uncouth and fierce\nrace of men, inhabiting a wild mountain region little known.\n\nThe Southern highlands themselves are a mysterious realm. When I\nprepared, eight years ago, for my first sojourn in the Great Smoky\nMountains, which form the master chain of the Appalachian system, I\ncould find in no library a guide to that region. The most diligent\nresearch failed to discover so much as a magazine article, written\nwithin this generation, that described the land and its people. Nay,\nthere was not even a novel or a story that showed intimate local\nknowledge. Had I been going to Teneriffe or Timbuctu, the libraries\nwould have furnished information a-plenty; but about this housetop of\neastern America they were strangely silent; it was _terra incognita_.\n\nOn the map I could see that the Southern Appalachians cover an area much\nlarger than New England, and that they are nearer the center of our\npopulation than any other mountains that deserve the name. Why, then, so\nlittle known? Quaintly there came to mind those lines familiar to my\nboyhood: \"Get you up this way southward, and go up into the mountain;\nand see the land, what it is; and the people that dwelleth therein,\nwhether they be strong or weak, few or many; and what the land is that\nthey dwell in, whether it be good or bad; and what cities they be that\nthey dwell in, whether in tents, or in strongholds; and what the land\nis, whether it be fat or lean, whether there be wood therein or not.\"\n\nIn that dustiest room of a great library where \"pub. docs.\" are stored,\nI unearthed a government report on forestry that gave, at last, a clear\nidea of the lay of the land. And here was news. We are wont to think of\nthe South as a low country with sultry climate; yet its mountain chains\nstretch uninterruptedly southwestward from Virginia to Alabama, 650\nmiles in an air line. They spread over parts of eight contiguous States,\nand cover an area somewhat larger than England and Scotland, or about\nthe same as that of the Alps. In short, the greatest mountain system of\neastern America is massed in our Southland. In its upper zone one sleeps\nunder blankets the year round.\n\nIn all the region north of Virginia and east of the Black Hills of\nDakota there"}, {"id": "gutenberg-50952", "title": "The Heart of the Alleghanies", "category": "Travel", "path": "texts/50952.html", "cover": "", "type": "TEXT", "content": "The Project Gutenberg eBook of The Heart of the Alleghanies; or, Western North Carolina\n    \nThis eBook is for the use of anyone anywhere in the United States and\nmost other parts of the world at no cost and with almost no restrictions\nwhatsoever. You may copy it, give it away or re-use it under the terms\nof the Project Gutenberg License included with this eBook or online\nat www.
